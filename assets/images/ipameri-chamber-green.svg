<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Prédio institucional verde — banner do concurso Motorista Legislativo de Ipameri</title>
<desc id="desc">Ilustração vetorial de um edifício público moderno com fachada verde, jardim e céu claro. Arte local de alta resolução para garantir que o banner apareça mesmo sem acesso a imagens externas.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9f1ff"/><stop offset="1" stop-color="#f6fbff"/></linearGradient>
 <linearGradient id="facade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58a66d"/><stop offset=".55" stop-color="#28784a"/><stop offset="1" stop-color="#165638"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7f4e5"/><stop offset="1" stop-color="#7dbda0"/></linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9fca8a"/><stop offset="1" stop-color="#4f925b"/></linearGradient>
 <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d6d9d4"/><stop offset="1" stop-color="#a9b3ad"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1320" cy="130" r="62" fill="#fff2b3" opacity=".85"/>
<g fill="#fff" opacity=".7"><ellipse cx="240" cy="140" rx="115" ry="28"/><ellipse cx="300" cy="127" rx="76" ry="40"/><ellipse cx="370" cy="144" rx="92" ry="25"/></g>
<path d="M0 580 Q230 500 470 570 T930 550 T1600 570 V900 H0Z" fill="#c8dfc2"/>
<ellipse cx="820" cy="748" rx="530" ry="66" fill="#284f3a" opacity=".25" filter="url(#shadow)"/>
<!-- Edifício público verde -->
<g>
 <path d="M265 322 L800 190 L1338 322 Z" fill="#e9f1e8" stroke="#6c8d75" stroke-width="7" stroke-linejoin="round"/>
 <path d="M300 324 L800 220 L1305 324 Z" fill="#3f8b59"/>
 <rect x="322" y="323" width="956" height="340" rx="3" fill="url(#facade)" stroke="#dbe9dc" stroke-width="10"/>
 <rect x="348" y="348" width="904" height="290" fill="#236d43"/>
 <!-- faixas de vidro -->
 <g fill="url(#glass)" stroke="#c8e9d3" stroke-width="8">
  <rect x="380" y="372" width="150" height="210" rx="3"/><rect x="568" y="372" width="150" height="210" rx="3"/>
  <rect x="882" y="372" width="150" height="210" rx="3"/><rect x="1070" y="372" width="150" height="210" rx="3"/>
 </g>
 <g stroke="#4d8964" stroke-width="6"><path d="M455 372V582M380 477H530M643 372V582M568 477H718M957 372V582M882 477H1032M1145 372V582M1070 477H1220"/></g>
 <!-- entrada principal -->
 <rect x="742" y="376" width="116" height="262" fill="#174f34" stroke="#d8e8d8" stroke-width="9"/>
 <rect x="758" y="393" width="84" height="230" fill="url(#glass)"/>
 <path d="M800 393V623" stroke="#43805a" stroke-width="6"/>
 <rect x="690" y="351" width="220" height="24" rx="3" fill="#f0f4ed"/>
 <rect x="285" y="650" width="1030" height="26" rx="3" fill="#e8eee7" stroke="#8ba892" stroke-width="5"/>
 <rect x="250" y="676" width="1100" height="22" rx="4" fill="#377e4d"/>
</g>
<!-- jardins e árvores -->
<path d="M0 718 Q400 675 800 720 T1600 705 V900 H0Z" fill="url(#ground)"/>
<path d="M690 900 L748 700 H852 L920 900Z" fill="url(#walk)"/>
<path d="M790 900 L797 700 H805 L830 900Z" fill="#eef0e8" opacity=".85"/>
<g><rect x="150" y="560" width="22" height="160" fill="#70543c"/><circle cx="160" cy="540" r="75" fill="#2d814a"/><circle cx="120" cy="565" r="48" fill="#42965a"/><circle cx="194" cy="573" r="48" fill="#247342"/>
<rect x="1410" y="565" width="22" height="160" fill="#70543c"/><circle cx="1420" cy="535" r="78" fill="#2d814a"/><circle cx="1376" cy="566" r="48" fill="#42965a"/><circle cx="1456" cy="570" r="49" fill="#247342"/></g>
<g fill="#f3d77b"><circle cx="270" cy="734" r="8"/><circle cx="298" cy="749" r="7"/><circle cx="1310" cy="740" r="8"/><circle cx="1280" cy="755" r="7"/></g>
<!-- faixa de contraste para texto -->
<path d="M0 0H1600V900H0Z" fill="#071a28" opacity=".05"/>
<rect x="56" y="62" width="12" height="160" rx="6" fill="#f5c400"/>
<text x="92" y="92" font-family="Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="5" fill="#194d35">DOCTOR CONCURSOS</text>
<text x="92" y="145" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#153b2b">CÂMARA MUNICIPAL</text>
<text x="92" y="187" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#153b2b">DE IPAMERI • GO</text>
</svg>