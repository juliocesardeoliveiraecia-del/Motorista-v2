 <path d="M916 468Q930 370 1014 370Q1080 374 1112 440L1080 430L1064 405Q1010 435 950 427Z" fill="#0b1422"/>
 <path d="M928 496Q952 476 978 493M1034 493Q1060 478 1080 495" stroke="#18202a" stroke-width="12" stroke-linecap="round"/>
