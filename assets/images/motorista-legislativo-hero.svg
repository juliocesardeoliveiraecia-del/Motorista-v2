<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Motorista Legislativo — banner principal</title><desc id="desc">Ilustração profissional de um motorista ao volante diante de um edifício público genérico, em tons de azul e dourado, sem brasões ou marcas de outros municípios.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06152c"/><stop offset=".52" stop-color="#0c3e78"/><stop offset="1" stop-color="#071323"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8bd9ff"/><stop offset="1" stop-color="#173d6b"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe66b"/><stop offset="1" stop-color="#e7a900"/></linearGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2367a8"/><stop offset="1" stop-color="#071e3a"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1310" cy="150" r="350" fill="#1e85e8" opacity=".12"/><path d="M0 700L620 900H0Z" fill="#0b2a50"/><path d="M0 0H38L0 110Z" fill="#ffd329"/><path d="M0 0H180L0 180Z" fill="#087bd8" opacity=".75"/>
<!-- generic civic building, deliberately without municipal identity -->
<g opacity=".92" transform="translate(660 125)">
 <path d="M0 170L360 20L720 170Z" fill="#d5e5f5"/><path d="M35 170H685V490H35Z" fill="#c4d6e8"/>
 <path d="M65 190H655V230H65Z" fill="#f3f7fb"/>
 <g fill="#244b73"><rect x="85" y="245" width="72" height="205" rx="3"/><rect x="190" y="245" width="72" height="205" rx="3"/><rect x="295" y="245" width="72" height="205" rx="3"/><rect x="400" y="245" width="72" height="205" rx="3"/><rect x="505" y="245" width="72" height="205" rx="3"/></g>
 <g fill="#8db6d6" opacity=".9"><rect x="95" y="255" width="52" height="185"/><rect x="200" y="255" width="52" height="185"/><rect x="305" y="255" width="52" height="185"/><rect x="410" y="255" width="52" height="185"/><rect x="515" y="255" width="52" height="185"/></g>
 <path d="M0 490H720V525H0Z" fill="#eaf2fa"/><path d="M-20 525H745V555H-20Z" fill="#081d36"/>
</g>
<!-- road -->
<path d="M450 900L875 620H1600V900Z" fill="#111f31"/><path d="M620 900L950 655H985L745 900Z" fill="#f5c72b" opacity=".8"/>
