 <path d="M700 680L790 615L1075 600Q1135 604 1195 680Z" fill="url(#glass)" stroke="#9ddfff" stroke-width="8"/>
 <path d="M815 620L840 678M1078 605L1100 680" stroke="#d9f4ff" stroke-width="7" opacity=".7"/>
 <path d="M625 735Q740 700 850 705L1160 708L1365 785L1385 860H610Z" fill="#0b3158"/>
 <path d="M620 815H1377L1395 865H610Z" fill="#06101b"/>
</g>
<!-- driver, head/neck, uniform -->
<g filter="url(#shadow)">
 <path d="M890 900Q875 800 900 700Q918 640 1000 626Q1080 627 1110 690L1155 900Z" fill="url(#shirt)"/>
 <path d="M975 635L978 590L1055 575L1082 650L1040 690Z" fill="#b9774b"/>
