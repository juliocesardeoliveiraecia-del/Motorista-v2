name: Doctor Core QA

on:
  push:
    branches: [main, core-industrial-v1.11.0]
  pull_request:
    branches: [main]

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node qa/core-static-audit.mjs
      - run: node qa/question-content-audit.mjs
