name: Doctor Core QA

on:
  push:
    branches: [main, core-industrial-v1.11.0]
  pull_request:
    branches: [main]

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node qa/core-static-audit.mjs
      - run: node qa/service-worker-offline-contract.mjs
      - run: node qa/question-content-audit.mjs
      - run: node qa/question-answer-contract.mjs
      - name: Block release when the official question distribution is incomplete
        run: node tools/audit-content.mjs --release
      - run: node --check tools/scaffold-product.mjs
      - run: node qa/scaffold-product-contract.mjs
      - run: node tools/scaffold-product.mjs --manifest templates/product-manifest.example.json
      - run: node --check doctor-platform-bridge.js
      - run: node qa/platform-bridge-contract.mjs
      - run: node qa/groq-legal-contract.mjs
      - run: node scripts/qa-core-content.mjs
