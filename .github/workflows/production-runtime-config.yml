name: Doctor Core production runtime configuration

on:
  pull_request:
    branches: [main, feature/doctor-platform-auth-session]
    paths:
      - 'tools/build-config.mjs'
      - '.github/workflows/production-runtime-config.yml'
  push:
    branches: [main, feature/doctor-platform-auth-session, chore/production-runtime-config]
    paths:
      - 'tools/build-config.mjs'
      - '.github/workflows/production-runtime-config.yml'

jobs:
  runtime-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate safe preview configuration
        run: node tools/build-config.mjs
        env:
          VERCEL_ENV: preview
      - name: Check version contract
        run: node scripts/check-version-contract.mjs
      - name: Check platform bridge contract
        run: node qa/platform-bridge-contract.mjs
