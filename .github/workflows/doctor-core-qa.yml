name: Doctor Core QA Contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  qa-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate simulated-exam and answer-key contracts
        run: node tests/doctor-core-quality.test.js
