<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="doctor-core-version" content="1.10.11">
<title>Motorista Legislativo</title>
<meta name="description" content="App de estudo para o Edital nº 02/2026 - Agente Legislativo — Motorista Legislativo, Câmara Municipal de Ipameri">
<meta name="theme-color" content="#0A192F">
<link rel="manifest" href="manifest.json?v=1.10.11">
<link rel="icon" type="image/png" sizes="48x48" href="assets/icons/icon-48.png?v=1.9.6">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=1.9.6">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-192.png?v=1.9.6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Motorista Legis">
<style>
:root {
  --blue-dark: #0A192F;
  --blue-mid: #16345E;
  --green: #2ECC71;
  --green-dark: #1E9E58;
  --orange: #F5A623;
  --red: #E74C3C;
  --gray-100: #F4F6F9;
  --gray-200: #E3E8EF;
  --gray-600: #5A6472;
  --radius: 14px;
  --font: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  --bg: var(--gray-100); --surface: #FFFFFF; --text: var(--blue-dark);
  --text-muted: var(--gray-600); --border: var(--gray-200);
}
[data-theme="dark"] { --bg: #071322; --surface: #0F2341; --text: #F4F6F9; --text-muted: #9AA5B1; --border: #1C3B63; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
body { padding-bottom: 0; }
#main-view { padding-bottom: calc(var(--radar-reserve, 52px) + 16px); }
button { font-family: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0 0 8px; }
p { margin: 0 0 8px; }
a { color: var(--green-dark); }

#splash {
  position: fixed; inset: 0; z-index: 9999; background: radial-gradient(circle at 50% 42%, rgba(34,93,163,.34), transparent 36%), linear-gradient(160deg, var(--blue-dark), var(--blue-mid));
  display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
  transition: opacity .35s ease, visibility .35s ease;
  text-align: center;
}
#splash.is-hiding { opacity: 0; visibility: hidden; pointer-events: none; }
#splash .logo { width: 140px; height: auto; margin-bottom: 16px; filter: drop-shadow(0 8px 20px rgba(0,0,0,.4)); }
#splash-text { font-weight: 800; font-size: 17px; letter-spacing: .01em; }
#splash-subtitle { margin-top: 7px; color: rgba(255,255,255,.72); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
#splash-version {
  margin-top: 18px; padding: 6px 12px; border: 1px solid rgba(255,255,255,.25);
  border-radius: 999px; background: rgba(255,255,255,.08); color: #fff;
  font-size: 12px; font-weight: 800; letter-spacing: .08em;
  box-shadow: 0 4px 16px rgba(0,0,0,.16);
}
#splash-progress { width: 86px; height: 3px; margin-top: 14px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.14); }
#splash-progress::after { content: ''; display: block; width: 42%; height: 100%; border-radius: inherit; background: rgba(255,255,255,.8); animation: splashProgress 1.8s cubic-bezier(.22,.61,.36,1) 1 forwards; }
@keyframes splashProgress { 0% { transform: translateX(-100%); } 100% { transform: translateX(240%); } }

/* ---------- Ícones SVG inline ---------- */
.icon-wrap { display: inline-flex; align-items: center; justify-content: center; vertical-align: -3px; }
.icon { width: 17px; height: 17px; }
.big-icon .icon-wrap { display: flex; justify-content: center; }
.big-icon .icon { width: 46px; height: 46px; }
h2 .icon-wrap .icon, h3 .icon-wrap .icon { width: 16px; height: 16px; }

.topbar {
  position: sticky; top: 0; z-index: 50; background: var(--blue-dark); color: #fff;
  padding: 10px 16px; display: grid; grid-template-columns: minmax(0,1fr) auto auto;
  align-items: center; column-gap: 12px; min-height: 60px;
}
.topbar-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar-logo { width: 28px; height: 28px; border-radius: 8px; display: block; flex-shrink: 0; }
.topbar-lines { display: flex; flex-direction: column; gap: 1px; }
.topbar-parent-brand { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.5); }
.topbar h1 { font-size: 15px; margin: 0; }

.app-footer {
  position: relative; z-index: 20;
  min-height: 66px; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 10px 16px; margin: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  box-shadow: 0 -8px 24px rgba(0,0,0,.16);
}
.footer-logo { width: 34px; height: auto; border-radius: 6px; flex-shrink: 0; }
.footer-text { text-align: left; line-height: 1.35; }
.footer-company { font-size: 12px; font-weight: 800; color: var(--text); }
.footer-meta { font-size: 10px; color: var(--text-muted); }
.topbar-actions { grid-column: 2; grid-row: 1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: max-content; }
.icon-btn {
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18);
  color: #fff; width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:active { background: rgba(255,255,255,.22); }
.icon-btn .icon { width: 19px; height: 19px; stroke-width: 2.1; }
.icon-btn-accent {
  background: var(--green); border-color: var(--green); color: #05271A;
}
.icon-btn-accent:active { background: var(--green-dark); border-color: var(--green-dark); }

main { padding: 16px; max-width: 640px; margin: 0 auto; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.card.center { text-align: center; }
.card.hero { background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid)); color: #fff; border: none; position: relative; overflow: hidden; }
.hero-illustration { position: absolute; right: 0; bottom: 0; width: 128px; height: auto; opacity: 0.98; filter: drop-shadow(0 8px 16px rgba(0,0,0,.35)); }
.hero-label { font-size: 12px; color: #B9C8DE; position: relative; padding-right: 108px; }
.hero-days { font-size: 30px; font-weight: 900; position: relative; padding-right: 108px; }
.hero-sub { font-size: 12px; color: #B9C8DE; position: relative; padding-right: 108px; line-height: 1.4; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { text-align: center; }
.stat-value { font-size: 22px; font-weight: 800; }
.stat-label { font-size: 11px; color: var(--text-muted); }

.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 16px 0 6px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 13px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px; margin-bottom: 8px; text-align: center; }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 12px; width: auto; display: inline-flex; }
.btn-primary { background: var(--green); color: #05271A; }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn-ghost { background: transparent; color: var(--text-muted); border: none; font-weight: 600; }
.btn-danger { background: var(--red); color: #fff; }
.btn-orange { background: var(--orange); color: #3A2400; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; background: rgba(46,204,113,.15); color: var(--green-dark); margin-right: 6px; }
.badge-ai { background: rgba(15,35,65,.1); color: var(--blue-dark); }
.badge-live { background: rgba(245,166,35,.18); color: #9A6300; }
[data-theme="dark"] .badge-live { color: var(--orange); background: rgba(245,166,35,.15); }
[data-theme="dark"] .badge-ai { background: rgba(255,255,255,.1); color: #fff; }
.badge.timer { background: var(--blue-dark); color: #fff; }

.progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 20px; overflow: hidden; margin-top: 4px; }
.progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--green-dark)); }

.subj-row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 10px; }
.subj-row:first-child { margin-top: 0; }
.subj-name { font-weight: 600; display: flex; align-items: center; gap: 6px; }

.pick-card { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
.subject-icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(15,35,65,.06); display: flex; align-items: center; justify-content: center; color: var(--blue-dark); flex-shrink: 0; }
[data-theme="dark"] .subject-icon { background: rgba(255,255,255,.06); color: #fff; }
.subject-icon .icon { width: 19px; height: 19px; }
.pick-info { flex: 1; }
.pick-info .name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pick-info .meta { font-size: 11px; color: var(--text-muted); }
.chev { color: var(--text-muted); display: flex; }

.q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.q-text { font-size: 15px; font-weight: 600; margin-bottom: 14px; line-height: 1.45; }
.q-option { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); margin-bottom: 8px; font-size: 13.5px; }
.q-option .letter { width: 24px; height: 24px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
.q-option.correct { border-color: var(--green); background: rgba(46,204,113,.1); }
.q-option.correct .letter { background: var(--green); color: #05271A; }
.q-option.wrong { border-color: var(--red); background: rgba(231,76,60,.1); }
.q-option.wrong .letter { background: var(--red); color: #fff; }

.explanation { margin-top: 10px; padding: 12px; border-radius: 12px; background: rgba(15,35,65,.05); border-left: 4px solid var(--blue-mid); font-size: 13px; line-height: 1.5; }
.explanation strong { display: flex; align-items: center; gap: 6px; }
[data-theme="dark"] .explanation { background: rgba(255,255,255,.05); }

.warn-card { border-left: 4px solid var(--orange); }

/* ---------- Plano de Hoje ---------- */
.plan-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.plan-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.plan-item:last-child { border-bottom: none; }
.plan-check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--green); }
.plan-item.done .plan-check { border-color: var(--green); }
.plan-item.done .plan-item-label { text-decoration: line-through; opacity: .6; }
.plan-item-text { flex: 1; min-width: 0; }
.plan-item-label { font-size: 13.5px; font-weight: 700; }
.plan-item-sub { font-size: 11px; color: var(--text-muted); }

/* ---------- Evolução do Doctor — V1.9.2 visual hardening ---------- */
.doctor-card { text-align: center; }
.doctor-avatar-box {
  width: 100%; max-width: 390px; min-height: 390px; margin: 0 auto 14px;
  background: radial-gradient(circle at 50% 28%, rgba(25,91,150,.26), rgba(5,10,16,.98) 68%);
  border: 1px solid rgba(255,255,255,.12); border-radius: 20px;
  display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
  padding: 12px 12px 10px; box-sizing:border-box; position:relative;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.025), 0 16px 36px rgba(0,0,0,.16);
}
.doctor-avatar-box img {
  width:auto; height:auto; max-width:88%; max-height:360px; object-fit:contain; object-position:center bottom;
  image-rendering:auto; display:block; filter: drop-shadow(0 12px 18px rgba(0,0,0,.28));
}
.doctor-avatar-box img[src*="level-01"]{max-height:150px;max-width:34%;}
.doctor-avatar-box img[src*="level-02"]{max-height:190px;max-width:44%;}
.doctor-avatar-box img[src*="level-03"]{max-height:240px;max-width:54%;}
.doctor-avatar-box img[src*="level-04"]{max-height:285px;max-width:62%;}
.doctor-avatar-box img[src*="level-05"],.doctor-avatar-box img[src*="level-06"]{max-height:330px;max-width:70%;}
.doctor-avatar-box img[src*="level-07"],.doctor-avatar-box img[src*="level-08"],.doctor-avatar-box img[src*="level-09"],.doctor-avatar-box img[src*="level-10"]{max-height:350px;max-width:80%;}
.doctor-placeholder { color: var(--text-muted); opacity: .5; }
.doctor-placeholder .icon { width: 40px; height: 40px; }
.doctor-level-name { font-weight: 900; font-size: 15px; margin-bottom: 8px; }
.doctor-avatar-image { width:auto; height:auto; }
@media (max-width: 640px){ .doctor-avatar-box{min-height:320px; max-width:330px; padding:10px 8px 8px;} .doctor-avatar-box img{max-height:300px; max-width:90%;} .doctor-avatar-box img[src*="level-01"]{max-height:120px;max-width:32%;}.doctor-avatar-box img[src*="level-02"]{max-height:160px;}.doctor-avatar-box img[src*="level-03"]{max-height:210px;}.doctor-avatar-box img[src*="level-04"]{max-height:250px;}.doctor-avatar-box img[src*="level-05"],.doctor-avatar-box img[src*="level-06"]{max-height:285px;}.doctor-avatar-box img[src*="level-07"],.doctor-avatar-box img[src*="level-08"],.doctor-avatar-box img[src*="level-09"],.doctor-avatar-box img[src*="level-10"]{max-height:295px;} }

.doctor-xp-label { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

/* ---------- Flashcards (flip 3D) ---------- */
.flashcard-wrap { perspective: 1200px; height: 220px; margin-bottom: 14px; }
.flashcard { position: relative; width: 100%; height: 100%; cursor: pointer; transform-style: preserve-3d; transition: transform .5s; }
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: var(--radius); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 20px; font-size: 15px; font-weight: 600; line-height: 1.45;
}
.flashcard-front { background: var(--surface); color: var(--text); }
.flashcard-back { background: var(--blue-dark); color: #fff; transform: rotateY(180deg); font-weight: 500; }
.muted { font-size: 12.5px; color: var(--text-muted); }
.center { text-align: center; }
.text-green { color: var(--green-dark); }
.text-orange { color: var(--orange); }
.empty { text-align: center; padding: 30px; color: var(--text-muted); }

input[type=password], input[type=text] { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; margin-bottom: 8px; }

#toast-container { position: fixed; top: 14px; left: 0; right: 0; z-index: 998; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: var(--blue-dark); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; max-width: 90%; text-align: center; }
.toast.success { background: var(--green-dark); }
.toast.warn { background: var(--orange); color: #3A2400; }

/* ---------- Rodapé institucional (ficha do edital) ---------- */
.edital-footer {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 16px; margin-top: 20px; text-align: center; position: relative;
}
.edital-illustration { width: 130px; margin: 0 auto 8px; color: var(--blue-mid); opacity: .5; }
[data-theme="dark"] .edital-illustration { color: #7C9BC9; }
.edital-illustration .illustration { width: 100%; height: auto; }
.edital-org { font-weight: 800; font-size: 15px; }
.edital-cargo { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.edital-banca { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-style: italic; }
.edital-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; text-align: left; }
.edital-item { font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
.edital-item-label { color: var(--text-muted); font-size: 10.5px; display: flex; align-items: center; gap: 4px; }
.edital-item span:last-child { font-weight: 700; }
.edital-subdivider { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; text-align: left; }
.edital-small { font-size: 12px; text-align: left; margin-top: 4px; }
.edital-subject-row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; padding: 6px 0; text-align: left; border-bottom: 1px solid var(--border); }
.edital-subject-row:last-child { border-bottom: none; }
.edital-subject-row span:first-child { display: flex; align-items: center; gap: 6px; }


/* ===== DOCTOR CORE V1 additions ===== */
.ai-banner{margin:10px auto 0;max-width:980px;background:#111;color:#fff;border:1px solid rgba(255,193,7,.45);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.ai-banner .ai-dot,.ai-status-dot{width:9px;height:9px;border-radius:50%;background:#f1c40f;flex:0 0 auto;box-shadow:0 0 0 4px rgba(241,196,15,.12)}
.ai-banner strong{color:#ffd54a}.ai-banner .spacer{flex:1}.ai-banner button{white-space:nowrap}
.ai-status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700}.ai-status.ok .ai-status-dot{background:#2ecc71;box-shadow:0 0 0 4px rgba(46,204,113,.12)}.ai-status.bad .ai-status-dot{background:#e74c3c;box-shadow:0 0 0 4px rgba(231,76,60,.12)}
.radar-ticker{width:100%;background:#050505;color:#fff;display:flex;align-items:center;overflow:hidden;border-top:2px solid #f5c400;border-bottom:2px solid #f5c400;min-height:38px;box-shadow:0 -4px 18px rgba(0,0,0,.12)}
/* Radar Doctor: fixo durante a navegação; ao alcançar o rodapé, encaixa-se no fluxo para revelar o rodapé completo. */
#radar-ticker-mount{position:fixed;left:0;right:0;bottom:0;z-index:89;margin:0;transition:none;}
#radar-ticker-mount.radar-at-footer{position:absolute;left:0;right:0;bottom:auto;z-index:19;}
#radar-ticker-mount .radar-ticker{min-height:40px;}
body{scroll-padding-bottom:52px;}
.radar-label{flex:0 0 auto;background:#050505;color:#ffd21a;padding:10px 12px;font-size:12px;font-weight:900;letter-spacing:.05em;z-index:2;border-right:1px solid #2b2b2b}.radar-label span{color:#fff}.radar-track{overflow:hidden;flex:1;white-space:nowrap}.radar-move{display:inline-flex;gap:28px;padding-left:22px;animation:radarMove 34s linear infinite}.radar-item{cursor:pointer;color:#fff;font-size:12px}.radar-item b{color:#ffd21a}.radar-item:hover{text-decoration:underline}@keyframes radarMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ============================================================
   DOCTOR CORE — VISUAL POLISH V1
   Contraste, hierarquia e destaque dos atalhos principais.
   ============================================================ */
/* Cabeçalho: atalhos principais */
#notes-toggle {
  background: linear-gradient(135deg, #F5C400, #E3A900) !important;
  border-color: #F5C400 !important;
  color: #101010 !important;
  box-shadow: 0 3px 10px rgba(0,0,0,.18), 0 0 0 1px rgba(245,196,0,.22) !important;
}
#notes-toggle:hover { filter: brightness(1.06); transform: translateY(-1px); }
#recorder-toggle {
  background: linear-gradient(135deg, #1687FF, #0757C9) !important;
  border-color: #1687FF !important;
  color: #FFFFFF !important;
  box-shadow: 0 3px 10px rgba(0,0,0,.18), 0 0 0 1px rgba(22,135,255,.22) !important;
}
#recorder-toggle:hover { filter: brightness(1.06); transform: translateY(-1px); }
#settings-toggle { background: rgba(255,255,255,.16); color:#fff; }
#theme-toggle { background: rgba(255,255,255,.10); color:#fff; }
#notes-toggle:focus-visible,#recorder-toggle:focus-visible,#settings-toggle:focus-visible,#theme-toggle:focus-visible,
.btn:focus-visible,.feature-card:focus-visible { outline: 3px solid rgba(245,196,0,.55); outline-offset: 2px; }

/* Botões de ferramentas: contraste correto nos dois temas */
.feature-card { color: var(--text) !important; background: var(--surface) !important; }
.feature-card h3 { color: var(--text) !important; }
.feature-card p { color: var(--text-muted) !important; }
.feature-card:hover { border-color: var(--blue-mid); transform: translateY(-1px); }
[data-theme="dark"] .feature-card:hover { border-color: #3D73B9; }

/* Botões gerais: nenhum texto pode desaparecer ao trocar o tema */
.btn-outline { color: var(--text) !important; }
.btn-ghost { color: var(--text-muted) !important; }
.btn-primary { color: #05271A !important; }
.btn-danger { color: #fff !important; }
.btn-orange { color: #3A2400 !important; }
[data-theme="dark"] .btn-outline { background: rgba(255,255,255,.035); border-color: #34557D; color: #F4F6F9 !important; }
[data-theme="dark"] .btn-ghost { color: #D9E2EF !important; }
[data-theme="dark"] .btn-primary { color: #041B10 !important; }

/* IA Doctor: status e ações sempre legíveis */
.ai-banner .btn-ghost { color: #E8EEF7 !important; background: rgba(255,255,255,.08); border-radius: 9px; }
.ai-banner .btn-ghost:hover { background: rgba(255,255,255,.14); }
.ai-banner strong { color: #FFD54A !important; }
[data-theme="light"] .ai-banner .btn-ghost { color: #FFFFFF !important; background: #16345E; }

/* Inputs e controles no modo escuro */
[data-theme="dark"] .textarea-core,
[data-theme="dark"] .select-core,
[data-theme="dark"] .input-core { color: #F4F6F9; background: #0B1B31; border-color: #31527A; }
[data-theme="dark"] .textarea-core::placeholder,
[data-theme="dark"] .input-core::placeholder { color: #91A2B8; }

/* Desabilitados: continuam legíveis */
button:disabled { opacity: .52; cursor: not-allowed; filter: none !important; transform: none !important; }

/* V1.9.6 — gravador reestruturado: nunca sobrepor a logo ou os atalhos. */
@media (max-width: 600px) {
  .topbar {
    grid-template-columns: minmax(0,1fr) auto;
    grid-template-rows: auto auto;
    row-gap: 3px;
    padding: 9px 12px 6px;
    min-height: 0;
  }
  .topbar-brand { grid-column: 1; grid-row: 1; }
  .topbar-actions { grid-column: 2; grid-row: 1; }
  .ai-indicator { grid-column: 1 / -1; grid-row: 2; }
}

/* Pequeno refinamento dos atalhos do cabeçalho em telas estreitas */
@media (max-width: 520px) {
  .topbar-actions { gap: 6px !important; }
  .icon-btn { width: 35px; height: 35px; }
}

/* ============================================================
   APP.JS — Doctor Core: motor genérico do app (estado, prática,
   simulado). Não conhece nenhum conaplicativo específico — tudo que é
   próprio de um concurso (nome, cargo, banca, matérias, questões,
