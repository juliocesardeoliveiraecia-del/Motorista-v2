   em outro concurso, troque apenas esses dois arquivos.
   ============================================================ */

const DOCTOR_CORE_BUILD = '1.10.8';
const STORAGE_KEY = 'motorista-ipameri-v2';
const EXAM_DATE = new Date(EXAM_CONFIG.examDateISO);

function defaultState() {
  const progress = {};
  const answeredIds = {};
  SUBJECTS.forEach(s => {
    progress[s.id] = { answered: 0, correct: 0 };
    answeredIds[s.id] = [];
  });
  return {
    theme: 'dark',
    groqApiKey: '',
    progress,
    answeredIds,
    simulados: [],
    aiQuestions: [], // questões geradas por IA, persistidas aqui para sobreviver a reload/fechar o app
    activeSession: null, // sessão de SIMULADO em andamento (prática usa "feeds", ver abaixo)
    feeds: {}, // fluxo contínuo por matéria: { subjectId: { order: [ids...], position: n } }
    answerLog: {}, // { questionId: selectedOptionIndex } — permite rever perguntas já respondidas
    flashcards: {}, // { subjectId: [ {id, front, back, aiGenerated} ] } — só os SALVOS pelo aluno
    dailyPlan: null, // { date: 'YYYY-MM-DD', items: [...] } — Plano de Hoje, regenerado a cada dia
    xp: 0, // XP do Doctor — ganho exclusivamente por atividade acadêmica real
    xpEvents: {}, // eventos de XP idempotentes: impede duplicação por reload/sync
    xpReviewRewards: {}, // questões cujo primeiro acerto de revisão já foi recompensado
    xpDailyBonuses: {}, // bônus diários já concedidos
    notes: [],
    noteFolders: [{id:'folder-general',name:'Geral',color:'#1687ff',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}],
    recordings: [],
    essays: [],
    essayDraft: {title:'',body:'',updatedAt:null,audioId:null},
    radar: { seenIds: [], interests: {}, lastSyncAt: null, items: [], lastAttemptAt: null, nextAllowedAt: null, refreshCount: 0 },
    syncQueue: [],
    deviceSession: { id: null, lastSeenAt: null },
    aiCore: { version: '1.2.0', lastReviewAt: null, lastRadarAt: null, reviewStats: { approved: 0, rejected: 0, repaired: 0 } }
  };
}

const Store = {
  state: null,
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      this.state = raw ? JSON.parse(raw) : defaultState();
      SUBJECTS.forEach(s => {
        if (!this.state.progress[s.id]) this.state.progress[s.id] = { answered: 0, correct: 0 };
        if (!this.state.answeredIds[s.id]) this.state.answeredIds[s.id] = [];
      });
      if (!Array.isArray(this.state.aiQuestions)) this.state.aiQuestions = [];
      if (this.state.activeSession === undefined) this.state.activeSession = null;
      if (!this.state.feeds) this.state.feeds = {};
      if (!this.state.answerLog) this.state.answerLog = {};
      if (!this.state.flashcards) this.state.flashcards = {};
      if (!Array.isArray(this.state.notes)) this.state.notes = [];
      if (!Array.isArray(this.state.noteFolders) || !this.state.noteFolders.length) this.state.noteFolders = [{id:'folder-general',name:'Geral',color:'#1687ff',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}];
      // Migração de notas antigas: tudo vai para a pasta Geral.
      this.state.notes.forEach(n => { if (!n.folderId) n.folderId = 'folder-general'; if (!Array.isArray(n.tags)) n.tags=[]; if (n.favorite===undefined) n.favorite=false; if (n.pinned===undefined) n.pinned=false; });
      if (!Array.isArray(this.state.recordings)) this.state.recordings = [];
      if (!Array.isArray(this.state.essays)) this.state.essays = [];
      if (!this.state.essayDraft || typeof this.state.essayDraft !== 'object') this.state.essayDraft = {title:'',body:'',updatedAt:null,audioId:null};
      if (this.state.essayDraft.audioId === undefined) this.state.essayDraft.audioId = null;
      this.state.recordings.forEach(r => { if (r.isEssayDraft === undefined) r.isEssayDraft = false; });
      if (!this.state.radar) this.state.radar = { seenIds: [], interests: {}, lastSyncAt: null, items: [], lastAttemptAt: null, nextAllowedAt: null, refreshCount: 0 };
      if (this.state.radar.lastAttemptAt === undefined) this.state.radar.lastAttemptAt = null;
      if (this.state.radar.nextAllowedAt === undefined) this.state.radar.nextAllowedAt = null;
      if (typeof this.state.radar.refreshCount !== 'number') this.state.radar.refreshCount = 0;
      if (!Array.isArray(this.state.radar.items)) this.state.radar.items = [];
      if (!Array.isArray(this.state.syncQueue)) this.state.syncQueue = [];
      if (!this.state.deviceSession) this.state.deviceSession = { id: null, lastSeenAt: null };
      if (!this.state.aiCore) this.state.aiCore = { version: '1.2.0', lastReviewAt: null, lastRadarAt: null, reviewStats: { approved: 0, rejected: 0, repaired: 0 } };
      if (!this.state.aiCore.version) this.state.aiCore.version='1.2.0';
      if (!this.state.aiCore.reviewStats) this.state.aiCore.reviewStats = { approved: 0, rejected: 0, repaired: 0 };
      if (this.state.dailyPlan === undefined) this.state.dailyPlan = null;
      if (typeof this.state.xp !== 'number') this.state.xp = 0;
      if (!this.state.xpEvents || typeof this.state.xpEvents !== 'object') this.state.xpEvents = {};
      if (!this.state.xpReviewRewards || typeof this.state.xpReviewRewards !== 'object') this.state.xpReviewRewards = {};
      if (!this.state.xpDailyBonuses || typeof this.state.xpDailyBonuses !== 'object') this.state.xpDailyBonuses = {};
      // migração: sessões de prática do formato antigo (por lote de 12) não se aplicam mais
      if (this.state.activeSession && this.state.activeSession.type === 'practice') {
        this.state.activeSession = null;
      }

      // Reintroduz no banco de questões (QUESTIONS) as que a IA já tinha gerado antes,
      // para não perdê-las ao fechar/reabrir o app.
      const existingIds = new Set(QUESTIONS.map(q => q.id));
      this.state.aiQuestions.forEach(q => {
        if (!existingIds.has(q.id)) {
          QUESTIONS.push(q);
          existingIds.add(q.id);
        }
      });
    } catch (e) {
      this.state = defaultState();
    }
    return this.state;
  },
  save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); },
  reset() {
    this.state = defaultState();
    this.save();
    // remove também da sessão atual (em memória), não só do que será salvo
    for (let i = QUESTIONS.length - 1; i >= 0; i--) {
      if (QUESTIONS[i].aiGenerated) QUESTIONS.splice(i, 1);
    }
  },
  daysUntilExam() {
    // Contagem por data civil local: evita 10 dias quando a prova é em 13/09 e
    // hoje é 04/09, independentemente do horário exato e do fuso.
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const target = new Date(EXAM_CONFIG.examDateISO);
    const examDay = new Date(target.getFullYear(), target.getMonth(), target.getDate());
    return Math.max(0, Math.round((examDay - today) / 86400000));
  },
  registerAnswer(subjectId, questionId, correct) {
    const p = this.state.progress[subjectId];
    if (this.state.answeredIds[subjectId].includes(questionId)) return false; // já contabilizada antes
    p.answered++;
    if (correct) p.correct++;
    this.state.answeredIds[subjectId].push(questionId);
    this.save();
    return true;
  },
  overallAccuracy() {
    let answered = 0, correct = 0;
    Object.values(this.state.progress).forEach(p => { answered += p.answered; correct += p.correct; });
    return answered > 0 ? Math.round((correct / answered) * 100) : 0;
  },

  // ---------- Flashcards salvos ----------
  getSavedFlashcards(subjectId) {
    if (!this.state.flashcards[subjectId]) this.state.flashcards[subjectId] = [];
    return this.state.flashcards[subjectId];
  },
  saveFlashcard(subjectId, card) {
    const list = this.getSavedFlashcards(subjectId);
    if (!list.find(c => c.front === card.front)) { // evita salvar duplicado
      list.push(card);
      this.save();
      Doctor.addXP(3, `flashcard:${subjectId}:${card.id}`);
    }
  },
  removeFlashcard(subjectId, cardId) {
    const list = this.getSavedFlashcards(subjectId);
    const idx = list.findIndex(c => c.id === cardId);
    if (idx >= 0) { list.splice(idx, 1); this.save(); }
  },

  // ---------- Caderno de Erros ----------
  // Não guarda uma lista separada: deriva direto do answerLog (resposta escolhida
  // em cada questão), comparando com o gabarito. Evita duplicar dado que já existe.
  getWrongQuestions(subjectId = null) {
    const wrong = [];
    Object.entries(this.state.answerLog).forEach(([questionId, selected]) => {
      const q = QUESTIONS.find(x => x.id === questionId);
      if (!q) return; // questão pode ter sumido (ex: reset parcial), ignora com segurança
      if (subjectId && q.subjectId !== subjectId) return;
      if (selected !== q.correct) wrong.push({ question: q, selected });
    });
    return wrong;
  },
  getWrongCountBySubject() {
    const counts = {};
    SUBJECTS.forEach(s => { counts[s.id] = 0; });
    this.getWrongQuestions().forEach(w => { counts[w.question.subjectId] = (counts[w.question.subjectId] || 0) + 1; });
    return counts;
  },
  // Re-responder uma questão do caderno de erros SOBRESCREVE o answerLog (então,
  // se acertar dessa vez, ela sai do caderno de erros naturalmente) mas NÃO mexe
  // nos contadores de progresso/aproveitamento — é revisão, não uma questão nova.
  // O XP de questão NÃO é concedido no erro; somente o primeiro acerto original
  // ou o primeiro acerto posterior na revisão pode gerar XP.
  reviewAnswer(questionId, selected) {
    this.state.answerLog[questionId] = selected;
    this.save();
  }
};

const Quiz = {
  shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },

  // ============================================================
  // PRÁTICA — fluxo contínuo e infinito por matéria.
  // Nunca reexibe uma questão já respondida antes (a não ser que
  // acabem as questões novas e a IA ainda não tenha gerado mais);
  // sempre retoma exatamente de onde parou; permite voltar e
  // revisar perguntas anteriores sem re-respondê-las.
  // ============================================================

  getFeed(subjectId) {
    if (!Store.state.feeds[subjectId]) Store.state.feeds[subjectId] = { order: [], position: 0 };
    return Store.state.feeds[subjectId];
  },

  isAnsweredAnywhere(questionId) {
    return Object.prototype.hasOwnProperty.call(Store.state.answerLog, questionId);
  },

  // Escolhe uma questão nunca respondida antes (em qualquer sessão), da matéria
  // pedida ou, no modo "todas", do conjunto inteiro.
  pickFreshQuestion(subjectId) {
    const pool = subjectId === 'todas' ? QUESTIONS : this.poolFor(subjectId);
    const candidates = pool.filter(q => !this.isAnsweredAnywhere(q.id));
    if (candidates.length === 0) return null;
    return this.shuffle(candidates)[0];
  },

  // Garante que a posição atual do feed tenha uma questão carregada.
  // Retorna false se não há nenhuma questão nova disponível (banco esgotado).
  ensureCurrent(subjectId) {
    const feed = this.getFeed(subjectId);
    if (feed.order.length === 0) {
      const q = this.pickFreshQuestion(subjectId);
      if (!q) return false;
      feed.order.push(q.id);
      feed.position = 0;
      Store.save();
    }
    return true;
  },

  currentQuestion(subjectId) {
    const feed = this.getFeed(subjectId);
    const id = feed.order[feed.position];
    return QUESTIONS.find(q => q.id === id) || null;
  },

  // Registra a resposta da questão atual do feed (não usado no simulado, que tem seu próprio fluxo)
  answerFeedQuestion(subjectId, optionIndex) {
    const q = this.currentQuestion(subjectId);
    const correct = optionIndex === q.correct;
    Store.state.answerLog[q.id] = optionIndex;
    const counted = Store.registerAnswer(q.subjectId, q.id, correct); // usa q.subjectId real
    Store.save();
    if (counted && correct) Doctor.addXP(5, `question:${q.id}`);
    return correct;
  },

  // Avança no feed. Se a próxima posição já tinha sido carregada antes (o usuário voltou
  // e está reavançando), só move o ponteiro. Se está na fronteira, busca uma questão nova
  // nunca vista. Retorna 'ok' ou 'need-more' (banco esgotado, hora de gerar com IA).
  goNext(subjectId) {
    const feed = this.getFeed(subjectId);
    if (feed.position + 1 < feed.order.length) {
      feed.position++;
      Store.save();
      return 'ok';
    }
    const q = this.pickFreshQuestion(subjectId);
    if (!q) return 'need-more';
    feed.order.push(q.id);
    feed.position++;
    Store.save();
    return 'ok';
  },

  // Verifica (sem consumir) se existe alguma questão nova disponível além da atual.
  // Usado para decidir se mostra "Próxima" ou "Gerar mais com IA".
  hasMoreFresh(subjectId) {
    return !!this.pickFreshQuestion(subjectId);
  },

  goPrev(subjectId) {
    const feed = this.getFeed(subjectId);
    if (feed.position > 0) {
      feed.position--;
      Store.save();
      return true;
    }
    return false;
  },

  // Usado no modo "todas": decide para qual matéria específica vale mais a pena
  // gerar questões novas, priorizando quem está proporcionalmente mais atrás
  // da distribuição oficial do edital.
  mostNeededSubjectForGeneration() {
    let worst = null, worstRatio = Infinity;
    SUBJECTS.forEach(s => {
      const have = this.poolFor(s.id).length;
      const ratio = have / s.officialQuestions;
      if (ratio < worstRatio) { worstRatio = ratio; worst = s; }
    });
    return worst || SUBJECTS[0];
  },

  poolFor(subjectId) {
    return QUESTIONS.filter(q => q.subjectId === subjectId);
  },

  session: null, // usado exclusivamente pelo Simulado (a Prática usa Store.state.feeds, acima)

  // Salva a sessão de SIMULADO atual para sobreviver a fechar o navegador.
  persist() {
    Store.state.activeSession = this.session;
    Store.save();
  },

  clearPersisted() {
    Store.state.activeSession = null;
    Store.save();
  },

  resumableSimulado() {
    const saved = Store.state.activeSession;
    if (saved && saved.type === 'simulado' && saved.index < saved.questions.length) {
      return saved;
    }
    return null;
  },

  // Simulado oficial: usa a distribuição exata do edital (10/3/2/25 = 40, 100 pontos)
  startSimulado() {
    let questions = [];
    SUBJECTS.forEach(s => {
      const pool = this.shuffle(this.poolFor(s.id));
      questions = questions.concat(pool.slice(0, s.officialQuestions));
    });
    this.session = {
      type: 'simulado',
      questions: this.shuffle(questions),
      index: 0,
      answers: [],
      startedAt: Date.now(),
      timeLimitSeconds: EXAM_CONFIG.durationHours * 60 * 60 // igual à duração real da prova
    };
    this.persist();
    return this.session;
  },

  simuladoReadiness() {
    return SUBJECTS.map(s => ({
      subject: s,
      have: this.poolFor(s.id).length,
      need: s.officialQuestions,
      missing: Math.max(0, s.officialQuestions - this.poolFor(s.id).length)
    }));
  },

  answerCurrent(optionIndex) {
    const s = this.session;
    const q = s.questions[s.index];
    const correct = optionIndex === q.correct;
    s.answers.push({ questionId: q.id, subjectId: q.subjectId, selected: optionIndex, correct });
    const counted = Store.registerAnswer(q.subjectId, q.id, correct);
    this.persist();
    if (counted && correct) Doctor.addXP(5, `question:${q.id}`);
    return correct;
  },

  nextQuestion() {
    this.session.index++;
    this.persist();
    return this.session.index < this.session.questions.length;
  },

  finishSimulado() {
    const s = this.session;
    const timeSpentSec = Math.round((Date.now() - s.startedAt) / 1000);
    const bySubject = {};
    let totalPoints = 0, earnedPoints = 0;

    SUBJECTS.forEach(subj => { bySubject[subj.id] = { correct: 0, total: 0, points: 0 }; });

    s.answers.forEach(a => {
      const subj = SUBJECTS.find(x => x.id === a.subjectId);
      bySubject[a.subjectId].total++;
      totalPoints += subj.points;
      if (a.correct) {
        bySubject[a.subjectId].correct++;
        bySubject[a.subjectId].points += subj.points;
        earnedPoints += subj.points;
      }
    });

    const result = {
      date: new Date().toISOString(),
      score: earnedPoints,
      total: totalPoints || EXAM_CONFIG.totalPoints,
      timeSpentSec,
      bySubject
    };
    Store.state.simulados.push(result);
    this.clearPersisted();
    Store.save();
    const dayKey = new Date().toISOString().slice(0,10);
    if (!Store.state.xpDailyBonuses[`simulado:${dayKey}`]) {
      Store.state.xpDailyBonuses[`simulado:${dayKey}`] = true;
      Store.save();
      Doctor.addXP(50, `simulado-bonus:${dayKey}`);
    } // bônus diário, evita farming por repetição no mesmo dia
    return result;
  },

  // ============================================================
  // REVISÃO DO CADERNO DE ERROS — sessão linear simples (sem
  // cronômetro) usando só as questões que o aluno errou antes.
  // Reaproveita o mesmo padrão de sessão/índice do simulado.
  // ============================================================
  startErrorReview(subjectId = null) {
    const wrong = this.shuffle(Store.getWrongQuestions(subjectId));
    this.reviewSession = {
      type: 'review',
      questions: wrong.map(w => w.question),
      index: 0,
      answers: []
    };
    return this.reviewSession;
  },

  answerReviewQuestion(optionIndex) {
    const s = this.reviewSession;
    const q = s.questions[s.index];
    const correct = optionIndex === q.correct;
    s.answers.push({ questionId: q.id, subjectId: q.subjectId, selected: optionIndex, correct });
    Store.reviewAnswer(q.id, optionIndex); // sobrescreve o answerLog, não mexe no progresso
    if (correct && !Store.state.xpReviewRewards[q.id]) {
      Store.state.xpReviewRewards[q.id] = true;
      Store.save();
      Doctor.addXP(5, `review:${q.id}`);
    } // recompensa o primeiro acerto de revisão de cada erro
    return correct;
  },

  nextReviewQuestion() {
    this.reviewSession.index++;
    return this.reviewSession.index < this.reviewSession.questions.length;
  }
};

// ============================================================
// PLANO DE HOJE — plano de estudos dinâmico, recalculado todo dia
// com base no desempenho real: prioriza a matéria mais fraca,
// reforça uma segunda área, e inclui revisão de erros se houver.
// Cada item leva direto para a atividade correspondente no app.
// ============================================================
const DailyPlan = {
  todayStr() {
    return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
  },

  // Matéria com pior aproveitamento entre as já praticadas; se nenhuma foi
  // praticada ainda, cai para a de maior peso no edital (mais estratégica).
  weakestSubject() {
    let weakest = null, weakestAcc = Infinity;
    SUBJECTS.forEach(s => {
      const p = Store.state.progress[s.id];
      if (p.answered > 0) {
        const acc = p.correct / p.answered;
        if (acc < weakestAcc) { weakestAcc = acc; weakest = s; }
      }
    });
    if (weakest) return weakest;
    return [...SUBJECTS].sort((a, b) => b.points - a.points)[0];
  },

  // Segunda matéria a reforçar: a de maior peso no edital que não seja a mais fraca
  secondarySubject(excludeId) {
    const candidates = SUBJECTS.filter(s => s.id !== excludeId);
    return [...candidates].sort((a, b) => b.points - a.points)[0];
  },

  generate() {
    const weakest = this.weakestSubject();
    const secondary = this.secondarySubject(weakest.id);
    const wrongCount = Store.getWrongQuestions().length;

    const items = [];

    items.push({
      id: 'weak', type: 'practice', subjectId: weakest.id,
      label: `${weakest.name}`, sublabel: 'Reforço de ponto fraco',
      target: 8, minutes: 12,
      baseline: Store.state.progress[weakest.id].answered
    });

    items.push({
      id: 'secondary', type: 'practice', subjectId: secondary.id,
      label: `${secondary.name}`, sublabel: 'Treino de questões',
      target: 6, minutes: 9,
      baseline: Store.state.progress[secondary.id].answered
    });

    if (wrongCount > 0) {
      items.push({
        id: 'review', type: 'review', subjectId: null,
        label: 'Revisão de erros', sublabel: `${wrongCount} questão(ões) para revisar`,
        target: wrongCount, minutes: Math.min(15, wrongCount * 1.5),
        baseline: wrongCount
      });
    }

    const plan = { date: this.todayStr(), items };
    Store.state.dailyPlan = plan;
    Store.save();
    return plan;
  },

  getOrGenerate() {
    if (!Store.state.dailyPlan || Store.state.dailyPlan.date !== this.todayStr()) {
      return this.generate();
    }
    return Store.state.dailyPlan;
  },

  // Recalcula em tempo real se cada item já foi concluído (compara o progresso
  // atual com o "baseline" salvo no momento em que o plano foi gerado).
  itemStatus(item) {
    if (item.type === 'practice') {
      const now = Store.state.progress[item.subjectId].answered;
      const done = (now - item.baseline) >= item.target;
      const doneCount = Math.min(item.target, Math.max(0, now - item.baseline));
      return { done, doneCount, target: item.target };
    }
    if (item.type === 'review') {
      const now = Store.getWrongQuestions().length;
      const resolved = Math.max(0, item.baseline - now);
      const done = now === 0 || resolved >= item.baseline;
      return { done, doneCount: Math.min(item.baseline, resolved), target: item.baseline };
    }
    return { done: false, doneCount: 0, target: 1 };
  },

  totalMinutes(plan) {
    return Math.round(plan.items.reduce((sum, it) => sum + it.minutes, 0));
  },

  completedCount(plan) {
    return plan.items.filter(it => this.itemStatus(it).done).length;
  }
};

// ============================================================
// DOCTOR — evolução do avatar, conectada 100% ao progresso real.
// 10 níveis com curva progressiva; 6.600 XP até o nível Supremo.
// "Se você evolui, o Doctor evolui" — XP só é ganho por estudo de
// verdade (questão correta, flashcard salvo, simulado feito, erro corrigido numa revisão).
// Questões erradas não geram XP; o primeiro acerto posterior no Caderno de Erros gera XP.
//
// Evolução oficial integrada ao Core: cada nível utiliza seu asset PNG
// individual em /assets/doctor/evolution/. O asset é carregado somente
// para o nível atual, mantendo o app leve e compatível com offline/PWA.
// ============================================================
const Doctor = {
  // Curva progressiva: primeiros níveis mais rápidos, níveis altos exigem
  // estudo consistente. Nível 10 é visualmente o Supremo; XP continua depois.
  LEVELS: [
    { level: 1, name: 'Iniciante',    minXP: 0,    maxXP: 300,  imageUri: './assets/doctor/evolution/doctor-level-01.png' },
    { level: 2, name: 'Aprendiz',     minXP: 300,  maxXP: 700,  imageUri: './assets/doctor/evolution/doctor-level-02.png' },
    { level: 3, name: 'Preparado',    minXP: 700,  maxXP: 1200, imageUri: './assets/doctor/evolution/doctor-level-03.png' },
    { level: 4, name: 'Focado',       minXP: 1200, maxXP: 1800, imageUri: './assets/doctor/evolution/doctor-level-04.png' },
    { level: 5, name: 'Determinado',  minXP: 1800, maxXP: 2550, imageUri: './assets/doctor/evolution/doctor-level-05.png' },
    { level: 6, name: 'Disciplinado', minXP: 2550, maxXP: 3400, imageUri: './assets/doctor/evolution/doctor-level-06.png' },
    { level: 7, name: 'Especialista', minXP: 3400, maxXP: 4350, imageUri: './assets/doctor/evolution/doctor-level-07.png' },
    { level: 8, name: 'Avançado',     minXP: 4350, maxXP: 5400, imageUri: './assets/doctor/evolution/doctor-level-08.png' },
    { level: 9, name: 'Elite',        minXP: 5400, maxXP: 6600, imageUri: './assets/doctor/evolution/doctor-level-09.png' },
    { level: 10,name: 'Supremo',      minXP: 6600, maxXP: null, imageUri: './assets/doctor/evolution/doctor-level-10.png' }
  ],

  MAX_XP: 6600,

  addXP(amount, eventId = null) {
    const n = Math.max(0, Math.round(Number(amount) || 0));
    if (!n) return false;
    const key = eventId ? String(eventId) : null;
    if (key && Store.state.xpEvents[key]) return false;
    if (key) Store.state.xpEvents[key] = { amount: n, at: new Date().toISOString() };
    // XP não trava no Supremo: o nível visual trava, o progresso histórico continua.
    Store.state.xp = Math.max(0, (Store.state.xp || 0) + n);
    Store.save();
    return true;
  },

  getCurrentLevel() {
    const xp = Math.max(0, Store.state.xp || 0);
    let current = this.LEVELS[0];
    for (const lvl of this.LEVELS) {
      if (xp >= lvl.minXP) current = lvl;
      else break;
    }
    return current;
  },

  getProgress() {
    const xp = Math.max(0, Store.state.xp || 0);
    const lvl = this.getCurrentLevel();
    const isMax = lvl.level === this.LEVELS.length;
    if (isMax) return { level: lvl, xp, into: 0, span: 0, pct: 100, isMax, remaining: 0 };
    const span = lvl.maxXP - lvl.minXP;
    const into = Math.min(span, Math.max(0, xp - lvl.minXP));
    const pct = Math.round((into / span) * 100);
    return { level: lvl, xp, into, span, pct, isMax, remaining: Math.max(0, lvl.maxXP - xp) };
  }
};


/* ===== groq.js ===== */
/* ============================================================
   GROQ.JS — Doctor Core: integração com IA (Groq), inalterada
   em comportamento. Lê banca/edital/cargo/matérias de config.js
   e data.js — nenhum dado de concurso fica escrito aqui.
   A chave nunca fica no código-fonte: só no localStorage do
   próprio dispositivo, digitada pelo usuário em Configurações.
   ============================================================ */

// Modelo de produção atual da GROQ. O app continua usando a chave GROQ do aluno;
// o identificador do modelo fica no Core e pode ser atualizado sem trocar a chave.
const GROQ_ENDPOINT = 'https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODELS_ENDPOINT = 'https://api.groq.com/openai/v1/models';
const GROQ_MODEL_PREFERENCES = ['openai/gpt-oss-120b','openai/gpt-oss-20b','qwen/qwen3.6-27b','qwen/qwen3.8-27b'];
let GROQ_MODEL = 'openai/gpt-oss-120b';

const GroqAI = {
  _inFlight: new Map(),
  _cooldownUntil: 0,
  getKey() { return (Store.state.groqApiKey || '').trim(); },
  setKey(key) { Store.state.groqApiKey = key.trim(); Store.save(); },
  getActiveModel() { return Store.state.aiCore?.activeModel || GROQ_MODEL; },
  hasKey(){ return !!this.getKey(); },
  _sleep(ms){ return new Promise(r=>setTimeout(r, Math.max(0, ms|0))); },
  _retryAfterMs(res, fallback=1200){
    const raw=res?.headers?.get?.('retry-after');
    const n=Number(raw);
    if(Number.isFinite(n) && n>=0) return Math.min(15000, Math.max(250, n*1000));
    return fallback;
  },
  _friendlyReason(status){
    if(status===401||status===403) return 'auth';
    if(status===429) return 'rate-limit';
    if(status===408) return 'timeout';
    if(status>=500) return 'server';
    return 'temporary';
  },
  async listAvailableModels() {
    const key=this.getKey(); if(!key) return {ok:false,reason:'no-key'};
    try {
      const controller=new AbortController(); const t=setTimeout(()=>controller.abort(),8000);
      const res=await fetch(GROQ_MODELS_ENDPOINT,{signal:controller.signal,headers:{'Authorization':`Bearer ${key}`,'Content-Type':'application/json'}});
      clearTimeout(t);
      if(!res.ok) return {ok:false,status:res.status};
      const data=await res.json(); const ids=new Set((data.data||[]).map(x=>x.id));
      return {ok:true,available:GROQ_MODEL_PREFERENCES.filter(id=>ids.has(id))};
    } catch(e){ return {ok:false,error:e}; }
  },
  async testModel(model) {
    const key=this.getKey(); if(!key) return {ok:false,reason:'no-key'};
    try {
      const controller=new AbortController(); const t=setTimeout(()=>controller.abort(),10000);
      const res=await fetch(GROQ_ENDPOINT,{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model,messages:[{role:'user',content:'Responda apenas OK.'}],temperature:0,max_tokens:4})});
      clearTimeout(t); return {ok:res.ok,status:res.status,error:res.ok?null:(await res.text().catch(()=>'' )).slice(0,500)};
    } catch(e){ return {ok:false,error:e}; }
  },
  async testConnection() {
    const listed=await this.listAvailableModels();
    const candidates=(listed.ok && listed.available.length?listed.available:GROQ_MODEL_PREFERENCES);
    const attempts=[];
    for(const model of candidates){ const r=await this.testModel(model); attempts.push({model,...r}); if(r.ok){ GROQ_MODEL=model; Store.state.aiCore.activeModel=model; Store.state.aiCore.modelCheckedAt=new Date().toISOString(); Store.save(); return {ok:true,model,attempts}; } if(r.status===401 || r.status===403) return {ok:false,status:r.status,attempts}; }
    return {ok:false,attempts,status:attempts.at(-1)?.status};
  },

  _buildPrompt(subject, count, existingSamples) {
    const sampleText = existingSamples.map(q => `- ${q.text}`).join('\n');
    const n = EXAM_CONFIG.alternativesPerQuestion;
    const letters = Array.from({ length: n }, (_, i) => String.fromCharCode(65 + i)).join(', ');
    return `Você é especialista em elaborar questões de concurso público brasileiro, no padrão do(a) ${EXAM_CONFIG.banca}, para o ${EXAM_CONFIG.editalNumber} do(a) ${EXAM_CONFIG.orgName}, cargo "${EXAM_CONFIG.cargo}".\n\nGere ${count} questões NOVAS e ORIGINAIS sobre a matéria "${subject.name}", usando SOMENTE os tópicos oficiais abaixo:\n${subject.topics.map(t => '- ' + t).join('\n')}\n\nQuestões já existentes (não repita o mesmo enunciado nem a mesma ideia central):\n${sampleText || '(nenhuma)'}\n\nREGRAS:\n1. Exatamente ${n} alternativas (${letters}).\n2. Apenas 1 correta.\n3. Uma explicação própria para cada alternativa, na mesma ordem.\n4. Não invente artigos, datas, normas ou fatos. Se não tiver segurança, não use o dado específico.\n5. Nível médio, objetivo e compatível com concurso público real.\n6. Português do Brasil.\n7. Responda SOMENTE JSON válido no formato {"questions":[{"text":"...","options":[...],"correct":0,"explanations":[...]}]}.`;
  },

  _validateAndTag(rawQuestions, subjectId) {
    const stamp=Date.now(); const n=EXAM_CONFIG.alternativesPerQuestion; const valid=[]; const seen=new Set();
    rawQuestions.forEach((q,i)=>{
      if(!q||typeof q.text!=='string'||q.text.trim().length<20)return;
      if(!Array.isArray(q.options)||q.options.length!==n)return;
      if(!Number.isInteger(q.correct)||q.correct<0||q.correct>=n)return;
      if(!Array.isArray(q.explanations)||q.explanations.length!==n)return;
      const options=q.options.map(o=>String(o).trim()); const exps=q.explanations.map(e=>String(e).trim());
      if(options.some(x=>!x)||exps.some(x=>!x))return;
      const normalized=[q.text,...options].map(x=>String(x).toLowerCase().replace(/\\s+/g,' ').trim());
      if(new Set(options.map(x=>x.toLowerCase())).size!==n)return;
      const signature=normalized.join('|'); if(seen.has(signature))return; seen.add(signature);
      valid.push({id:`${subjectId}-ai-${stamp}-${i}-${Math.random().toString(36).slice(2,7)}`,subjectId,text:q.text.trim(),options,correct:q.correct,explanations:exps,aiGenerated:true});
    });
    return valid;
  },

  async generateQuestions(subjectId, count=6) {
    const key=this.getKey(); if(!key) return {ok:false,reason:'no-key'};
    const subject=SUBJECTS.find(s=>s.id===subjectId); if(!subject) return {ok:false,reason:'invalid-subject'};
    const lockKey=`questions:${subjectId}`;
    if(this._inFlight.has(lockKey)) return this._inFlight.get(lockKey);
    const run=(async()=>{
      const existingSamples=Quiz.shuffle(Quiz.poolFor(subjectId)).slice(0,8);
      const prompt=this._buildPrompt(subject,count,existingSamples);
      const r=await DoctorAICore.call({messages:[{role:'system',content:'Você é o gerador de questões do Doctor. Produza apenas conteúdo dentro do contexto recebido.'},{role:'user',content:DoctorAICore.context()+'\\n'+prompt}],responseFormat:{type:'json_object'},temperature:0.45,timeout:45000});
      if(!r.ok) return r;
      const parsed=DoctorAICore.parseJSON(r.content); const raw=Array.isArray(parsed?.questions)?parsed.questions:[];
      let validated=this._validateAndTag(raw,subjectId);
      if(!validated.length) return {ok:false,reason:'invalid-generation'};
      if(EXAM_CONFIG.aiProfile?.revisionRequired!==false){
        const reviewed=await DoctorAICore.reviewQuestions(validated,subject);
        if(!reviewed.ok) return {ok:false,reason:'review-unavailable',status:reviewed.status,error:reviewed.error};
        validated=reviewed.questions||[];
      }
      if(!validated.length) return {ok:false,reason:'review-rejected'};
      validated.forEach(q=>{ QUESTIONS.push(q); Store.state.aiQuestions.push(q); });
      Store.save();
      return {ok:true,added:validated.length,model:r.model};
    })();
    this._inFlight.set(lockKey,run);
    try{return await run;}finally{this._inFlight.delete(lockKey);}
  },

  _buildFlashcardPrompt(subject,count,existingFronts,accuracy){
    const existingText=existingFronts.map(f=>`- ${f}`).join('\\n');
    const focus=accuracy===null?'Cubra uma base equilibrada dos tópicos mais importantes.':accuracy<60?`Aproveitamento ${accuracy}%. Reforce fundamentos.`:accuracy<85?`Aproveitamento ${accuracy}%. Misture fundamentos e pontos de atenção.`:`Aproveitamento ${accuracy}%. Aprofunde nuances e pontos que costumam gerar erro.`;
    return `Você é especialista em concursos. ${DoctorAICore.context()}\nMatéria: ${subject.name}\n${focus}\nTópicos:\n${subject.topics.map(t=>'- '+t).join('\\n')}\nFlashcards já salvos:\n${existingText||'(nenhum)'}\nCrie ${count} flashcards novos. Responda somente JSON: {"flashcards":[{"front":"...","back":"..."}]}.`;
  },
  async generateFlashcards(subjectId,count=6){
    const key=this.getKey(); if(!key)return {ok:false,reason:'no-key'};
    const subject=SUBJECTS.find(s=>s.id===subjectId); if(!subject)return {ok:false,reason:'invalid-subject'};
    const saved=Store.getSavedFlashcards(subjectId); const fronts=saved.slice(-15).map(c=>c.front);
    const p=Store.state.progress[subjectId]; const accuracy=p&&p.answered>0?Math.round(p.correct/p.answered*100):null;
    const r=await DoctorAICore.call({messages:[{role:'system',content:'Você é o gerador de flashcards do Doctor.'},{role:'user',content:this._buildFlashcardPrompt(subject,count,fronts,accuracy)}],responseFormat:{type:'json_object'},temperature:0.35,timeout:45000});
    if(!r.ok)return r;
    const parsed=DoctorAICore.parseJSON(r.content); const raw=Array.isArray(parsed?.flashcards)?parsed.flashcards:[];
    const cards=raw.filter(c=>c&&String(c.front||'').trim()&&String(c.back||'').trim()).slice(0,count).map((c,i)=>({id:`${subjectId}-ai-card-${Date.now()}-${i}-${Math.random().toString(36).slice(2,7)}`,subjectId,front:String(c.front).trim(),back:String(c.back).trim(),aiGenerated:true}));
    if(!cards.length)return {ok:false,reason:'invalid-generation'};
    const reviewed=await DoctorAICore.reviewFlashcards(cards,subject); if(!reviewed.ok)return {ok:false,reason:'review-unavailable',status:reviewed.status};
    const approved=reviewed.cards||[]; approved.forEach(c=>Store.state.flashcards[subjectId].push(c)); Store.save(); return {ok:true,added:approved.length,model:r.model};
  }
};


/* ============================================================
   DOCTOR AI CORE — camada de orquestração e revisão
   ------------------------------------------------------------
   Regra: o Core não conversa com a GROQ de forma solta. Cada
   tarefa recebe contexto do concurso + perfil da banca + schema,
   passa por validação local e, quando necessário, por um revisor
   independente antes de chegar ao aluno.
   ============================================================ */
const DoctorAICore = {
  VERSION: '1.2.0',
  questionSchema(count, n) {
    return {
      type: 'object', additionalProperties: false,
      properties: { questions: { type:'array', items: { type:'object', additionalProperties:false,
        properties: {
          text:{type:'string'}, options:{type:'array',items:{type:'string'}}, correct:{type:'integer'},
          explanations:{type:'array',items:{type:'string'}}
        }, required:['text','options','correct','explanations']
      }}}, required:['questions']
    };
  },
  flashcardSchema() {
    return {type:'object',additionalProperties:false,properties:{flashcards:{type:'array',items:{type:'object',additionalProperties:false,properties:{front:{type:'string'},back:{type:'string'}},required:['front','back']}}},required:['flashcards']};
  },
  essaySchema() {
    return {type:'object',additionalProperties:false,properties:{score:{type:'number'},summary:{type:'string'},strengths:{type:'array',items:{type:'string'}},improvements:{type:'array',items:{type:'string'}},criteria:{type:'array',items:{type:'object',additionalProperties:false,properties:{name:{type:'string'},score:{type:'number'},comment:{type:'string'}},required:['name','score','comment']}},rewrittenExcerpt:{type:'string'}},required:['score','summary','strengths','improvements','criteria','rewrittenExcerpt']};
  },
  context() {
    const c=EXAM_CONFIG;
    return `CONTEXTO DO PRODUTO\nConcurso: ${c.productName}\nÓrgão: ${c.orgName} - ${c.orgState}\nCargo: ${c.cargo}\nBanca: ${c.banca}\nEdital: ${c.editalNumber}\nModo editorial: ${c.editorialMode}\nFormato da prova: ${c.alternativesPerQuestion} alternativas por questão; regra de resposta: ${c.aiProfile?.answerPolicy||'single-correct'}\nMatérias: ${SUBJECTS.map(x=>x.name).join(', ')}\nRegra de ouro: o edital define o conteúdo; a banca define o modo de cobrança. Nunca misture informações de outro concurso.`;
  },
  async call({model=null,messages,responseFormat=null,temperature=0.2,timeout=45000,searchSettings=null,maxTokens=null}) {
    const key=GroqAI.getKey(); if(!key)return {ok:false,reason:'no-key'};
    const primary=model || GroqAI.getActiveModel();
    const candidates=searchSettings?[primary]:[primary,...GROQ_MODEL_PREFERENCES.filter(x=>x!==primary)];
    const maxAttempts=searchSettings?1:2;
    let last={ok:false,reason:'unavailable'};
    for(const candidate of candidates){
      let attempt=0;
      while(attempt<maxAttempts){
        attempt++;
        const controller=new AbortController(); const tid=setTimeout(()=>controller.abort(),timeout);
        try{
          const body={model:candidate,messages,temperature};
          if(maxTokens)body.max_completion_tokens=maxTokens;
          if(responseFormat)body.response_format=responseFormat;
          if(searchSettings){
            body.search_settings=searchSettings;
            // Groq desativou Compound em 21/09/2026. O Radar usa o
            // Browser Search nativo do GPT-OSS, que permanece suportado.
            body.tools=[{type:'browser_search'}];
            body.tool_choice='required';
          }
          const headers={'Content-Type':'application/json','Authorization':`Bearer ${key}`};
          if(searchSettings) headers['Groq-Model-Version']='latest';
          const res=await fetch(GROQ_ENDPOINT,{method:'POST',signal:controller.signal,headers,body:JSON.stringify(body)});
          if(res.ok){
            const data=await res.json(); const content=data.choices?.[0]?.message?.content||'';
            const executed=data?.choices?.[0]?.message?.executed_tools;
            // Compound pode concluir uma pesquisa web com o conteúdo final vazio,
            // mas ainda assim entregar os resultados em executed_tools. Para o Radar,
            // isso é uma resposta válida: nunca descarte a busca real por falta de texto.
            if(!content && !(searchSettings && Array.isArray(executed) && executed.length)){last={ok:false,reason:'empty-response',model:candidate}; continue;}
            Store.state.aiCore.activeModel=candidate; Store.state.aiCore.lastSuccessfulModelAt=new Date().toISOString(); Store.save();
            return {ok:true,content,data,model:candidate};
          }
          const text=await res.text().catch(()=>'' );
          const retryAfterMs=this._retryAfterMs(res,900);
          last={ok:false,status:res.status,error:text.slice(0,500),model:candidate,reason:GroqAI._friendlyReason(res.status),retryAfterMs};
          if(res.status===401||res.status===403)return last;
          if(res.status===429){
            // Para chamadas do Radar, nunca repetir automaticamente: protege a
            // cota da GROQ e evita tempestade de requisições.
            if(searchSettings)return last;
            if(attempt===1){ await GroqAI._sleep(GroqAI._retryAfterMs(res,900)); continue; }
            break;
          }
          if([408,409,425,500,502,503,504].includes(res.status)){
            if(attempt===1){ await GroqAI._sleep(600); continue; }
            break;
          }
          if(res.status===400||res.status===404)break;
          return last;
        }catch(e){
          last={ok:false,error:e,model:candidate,reason:e?.name==='AbortError'?'timeout':'network'};
          if(attempt===1){await GroqAI._sleep(500);continue;}
          break;
        }finally{clearTimeout(tid);}
      }
    }
    return last;
  },
  parseJSON(text){
    const raw=String(text||'').trim();
    if(!raw)return null;
    const candidates=[raw,raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'')];
    for(const c of candidates){try{return JSON.parse(c)}catch(_) {}}
    const starts=[raw.indexOf('{'),raw.indexOf('[')].filter(x=>x>=0).sort((a,b)=>a-b);
    for(const a of starts){
      const endChar=raw[a]==='['?']':'}';
      const b=raw.lastIndexOf(endChar);
      if(b>a){try{return JSON.parse(raw.slice(a,b+1))}catch(_) {}}
    }
    return null;
  },
  validateQuestion(q,subjectId){
    const n=EXAM_CONFIG.alternativesPerQuestion;
    if(!q||typeof q.text!=='string'||q.text.trim().length<20)return false;
    if(!Array.isArray(q.options)||q.options.length!==n)return false;
    if(!q.options.every(x=>typeof x==='string'&&x.trim()))return false;
    if(!Number.isInteger(q.correct)||q.correct<0||q.correct>=n)return false;
    if(!Array.isArray(q.explanations)||q.explanations.length!==n)return false;
    if(!q.explanations.every(x=>typeof x==='string'&&x.trim()))return false;
    // Não permitir alternativas duplicadas.
    const normalized=q.options.map(x=>x.trim().toLowerCase());
    if(new Set(normalized).size!==normalized.length)return false;
    return true;
  },
  async reviewQuestions(questions,subject) {
    if(!questions?.length) return {ok:true,questions:[]};
    const n=EXAM_CONFIG.alternativesPerQuestion;
    const payload=questions.map((q,i)=>({index:i,text:q.text,options:q.options,correct:q.correct,explanations:q.explanations}));
    const prompt=`Você é o REVISOR DOCTOR, uma camada independente do gerador.\n${this.context()}\nMatéria: ${subject.name}\nTópicos permitidos:\n${subject.topics.map(x=>'- '+x).join('\n')}\n\nAnalise cada questão abaixo ANTES de permitir sua entrega ao aluno.\nREGRAS: (1) exatamente ${n} alternativas; (2) somente uma correta; (3) gabarito deve ser defensável; (4) explicações coerentes com o gabarito; (5) sem informação inventada; (6) se houver artigo, lei, data ou fato atual cuja correção não possa ser sustentada com segurança pelo contexto recebido, marque REJEITAR em vez de adivinhar; (7) questão fora do edital ou incompatível com o estilo da banca = REJEITAR.\nResponda JSON com decisions: [{index,status,reason,correctedQuestion}]. status só pode ser APROVAR, CORRIGIR ou REJEITAR. correctedQuestion deve existir sempre; quando não houver correção segura, repita a questão original.\nQUESTÕES:\n${JSON.stringify(payload)}`;
    const r=await this.call({messages:[{role:'system',content:'Você é o Revisor Doctor. Nunca aprove uma questão só porque parece plausível.'},{role:'user',content:prompt}],responseFormat:{type:'json_object'},temperature:0});
    if(!r.ok)return {ok:false,reason:'review-unavailable',error:r.error,status:r.status};
    const parsed=this.parseJSON(r.content); if(!parsed||!Array.isArray(parsed.decisions))return {ok:false,reason:'review-invalid'};
    const out=[];
    parsed.decisions.forEach(d=>{
      const original=questions[d.index]; if(!original)return;
      const q=d.correctedQuestion||original;
      if((d.status==='APROVAR'||d.status==='CORRIGIR')&&this.validateQuestion(q,subject.id)){
        out.push({...original,text:q.text.trim(),options:q.options.map(String),correct:q.correct,explanations:q.explanations.map(String),reviewedByDoctor:true,reviewStatus:d.status,reviewReason:d.reason||''});
        Store.state.aiCore.reviewStats.approved++;
        if(d.status==='CORRIGIR')Store.state.aiCore.reviewStats.repaired++;
      } else { Store.state.aiCore.reviewStats.rejected++; }
    });
    Store.state.aiCore.lastReviewAt=new Date().toISOString(); Store.save();
    return {ok:true,questions:out};
  },
  async reviewFlashcards(cards,subject){
    const payload=cards.map((c,i)=>({index:i,front:c.front,back:c.back}));
    const prompt=`Você é o REVISOR DOCTOR de flashcards.\n${this.context()}\nMatéria: ${subject.name}.\nVerifique se cada card está dentro do edital, factual e claro, sem ambiguidade e sem invenção. Rejeite conteúdo que dependa de informação atual não sustentada pelo contexto. Responda JSON: {"cards":[{"index":0,"status":"APROVAR|CORRIGIR|REJEITAR","front":"...","back":"...","reason":"..."}]}.`;
    const r=await this.call({messages:[{role:'system',content:'Você é revisor independente de conteúdo educacional.'},{role:'user',content:prompt+'\nCARDS:\n'+JSON.stringify(payload)}],responseFormat:{type:'json_object'},temperature:0});
    if(!r.ok)return {ok:false,reason:'review-unavailable'};
    const p=this.parseJSON(r.content); if(!p?.cards)return {ok:false,reason:'review-invalid'};
    const out=[]; p.cards.forEach(d=>{const c=cards[d.index];if(!c)return;if((d.status==='APROVAR'||d.status==='CORRIGIR')&&String(d.front||'').trim()&&String(d.back||'').trim()){out.push({...c,front:String(d.front).trim(),back:String(d.back).trim(),reviewedByDoctor:true});Store.state.aiCore.reviewStats.approved++;if(d.status==='CORRIGIR')Store.state.aiCore.reviewStats.repaired++;}else Store.state.aiCore.reviewStats.rejected++;});
    Store.state.aiCore.lastReviewAt=new Date().toISOString();Store.save();return {ok:true,cards:out};
  },
  async teachEssay(){
    const prompt=`Você é o Professor de Redação Doctor. ${this.context()}\nEnsine o aluno a escrever redações para concursos. Explique de forma prática: estrutura, introdução, desenvolvimento, conclusão, tese, argumentação, coesão, coerência, gramática e como adaptar-se aos critérios da banca. Não invente critérios específicos que não estejam no edital. Responda em texto organizado, curto e acionável.`;
    return this.call({messages:[{role:'system',content:'Você é um professor de redação para concursos públicos brasileiros.'},{role:'user',content:prompt}],temperature:0.35});
  },
  async analyzeEssay(title,body){
    if(!body?.trim())return {ok:false,reason:'empty'};
    const prompt=`Você é o avaliador de Redação Doctor.\n${this.context()}\nTema: ${title||'não informado'}\n\nAnalise o texto abaixo. A avaliação é ESTIMATIVA e não é nota oficial da banca. Não invente critérios que não constem do edital. Entregue JSON com score (0-100), summary, strengths[], improvements[], criteria[] e rewrittenExcerpt.\nTEXTO:\n${body}`;
    const r=await this.call({messages:[{role:'system',content:'Avalie redações de forma pedagógica, objetiva e respeitosa.'},{role:'user',content:prompt}],responseFormat:{type:'json_object'},temperature:0.15});
    if(!r.ok)return r; const p=this.parseJSON(r.content); if(!p)return {ok:false,reason:'invalid'}; return {ok:true,result:p};
  },
  _extractRadarSearchResults(data){
    // A API da Groq pode devolver o resultado da busca em search_results.results
    // OU em executed_tools[].output como texto. As versões anteriores só tratavam
    // do primeiro formato, o que fazia o Radar parecer vazio mesmo quando a busca
    // tinha sido executada com sucesso.
    const out=[]; const seen=new Set();
    const add=(node,forcedSource='')=>{
      if(!node || out.length>=40)return;
      if(typeof node==='string'){
        const text=node.trim();
        if(!text)return;
        // Formato comum: Title: ... / URL: ... / Content: ...
        const blocks=text.split(/\n(?=Title\s*:)/i).filter(Boolean);
        for(const block of blocks){
          const title=(block.match(/Title\s*:\s*(.+)/i)?.[1]||'').trim();
          const url=(block.match(/(?:URL|Link|Source)\s*:\s*(https?:\/\/\S+)/i)?.[1]||'').trim().replace(/[),.;]+$/,'');
          const snippet=(block.match(/(?:Content|Snippet|Description|Text)\s*:\s*([\s\S]*?)(?=\n(?:Title|URL|Link|Source|Content|Snippet)\s*:|$)/i)?.[1]||block).trim();
          if(title||url)add({title,url,snippet,source:forcedSource});
        }
        // Se não houver rótulos, ainda aproveita qualquer URL oficial encontrada.
        if(!blocks.length || !out.length){
          const urls=[...text.matchAll(/https?:\/\/[^\s<>"']+/g)].map(m=>m[0].replace(/[),.;]+$/,''));
          urls.slice(0,8).forEach((url,i)=>add({title:`Atualização encontrada na fonte oficial ${i+1}`,url,snippet:text,source:forcedSource}));
        }
        return;
      }
      if(Array.isArray(node)){node.forEach(x=>add(x,forcedSource));return;}
      if(typeof node!=='object')return;
      const title=String(node.title||node.name||'').trim();
      const url=String(node.url||node.link||node.source_url||'').trim();
      const snippet=String(node.content||node.snippet||node.text||node.description||node.summary||node.output||'').trim();
      const source=String(node.source||node.domain||forcedSource||'').trim();
      if(title&&(url||snippet)){
        const key=(title+'|'+url).toLowerCase();
        if(!seen.has(key)){seen.add(key);out.push({title,url,snippet,source});}
      }
      if(Array.isArray(node.results))node.results.forEach(x=>add(x,source));
      if(node.search_results) add(node.search_results,source);
      if(node.searchResults) add(node.searchResults,source);
      if(node.sources) add(node.sources,source);
      if(node.output) add(node.output,source);
      Object.entries(node).forEach(([k,v])=>{
        if(['results','search_results','searchResults','sources','output','title','name','url','link','source_url','content','snippet','text','description','summary'].includes(k))return;
        if(v&&typeof v==='object')add(v,source);
      });
    };
    add(data?.choices?.[0]?.message?.executed_tools);
    return out.slice(0,40);
  },

  _radarAllowedUrl(url){
    try{
      const host=new URL(url).hostname.toLowerCase().replace(/^www\./,'');
      return host==='institutoverbena.ufg.br' || host.endsWith('.institutoverbena.ufg.br') || host==='camaraipameri.go.gov.br';
    }catch(_){return false;}
  },

  _catalogPromotions(now){
    const list=RadarDoctor.platformCatalog();
    return list.slice(0,3).map((p,i)=>({
      id:`radar-promo-${now}-${p.productId||i}`,
      tag:'APP DOCTOR',
      title:String(p.name||p.shortName||p.productId||'Novo aplicativo Doctor').slice(0,180),
      text:String(p.promoText||p.description||`Estude com o aplicativo ${p.shortName||p.name||'Doctor'} e tenha uma preparação focada no seu concurso.`).slice(0,700),
      body:String(p.promoText||p.description||`Aplicativo Doctor focado em ${p.shortName||p.name||'um novo concurso'}. Conheça a plataforma e estude com conteúdo direcionado ao edital e à banca.`).slice(0,2600),
      source:'Doctor Concursos',url:String(p.url||p.appUrl||''),date:new Date(now).toLocaleDateString('pt-BR'),
      priority:'normal',official:false,contestRelated:false,isPromotion:true,productId:p.productId||'',appId:p.appId||''
    }));
  },

  _radarItemsFromSearchResults(results,now){
    const c=EXAM_CONFIG;
    const terms=[c.orgName,c.cargo,c.productName,c.banca,c.editalNumber,'câmara municipal de ipameri','concurso público da câmara municipal de ipameri','ipameri','verbena','ufg'].map(String).map(x=>x.toLowerCase());
    const ranked=results.map((r,i)=>{
      const hay=`${r.title} ${r.source} ${r.snippet} ${r.url}`.toLowerCase();
      const official=/(institutoverbena\.ufg\.br|sistemas\.institutoverbena\.ufg\.br|camaraipameri\.go\.gov\.br)/i.test(hay);
      const related=official || terms.some(t=>t&&hay.includes(t));
      return {...r,related,official,score:(related?1000:0)+(official?250:0)+(r.url?10:0)-i};
    }).filter(x=>x.related).sort((a,b)=>b.score-a.score);
    return ranked.slice(0,7).map((x,i)=>({
      id:`radar-web-${now}-${i}`,tag:'CONCURSO ATUAL',title:x.title.slice(0,180),
      text:(x.snippet||'Atualização encontrada em fonte oficial.').slice(0,700),
      body:(x.snippet||'Atualização encontrada em fonte oficial.').slice(0,2600),
      source:(x.source||'Fonte oficial').slice(0,140),url:x.url||'',date:new Date(now).toLocaleDateString('pt-BR'),
      priority:'high',official:true,contestRelated:true,isPromotion:false
    }));
  },

  async refreshRadar(force=false){
    const now=Date.now();
    const TTL=6*60*60*1000;
    const MANUAL_COOLDOWN=10*60*1000;
    const radarState=Store.state.radar||{};
    const last=radarState.lastSyncAt?new Date(radarState.lastSyncAt).getTime():0;
    const lastAttempt=radarState.lastAttemptAt?new Date(radarState.lastAttemptAt).getTime():0;
    const fresh=last>0&&(now-last)<TTL;
    const cooling=lastAttempt>0&&(now-lastAttempt)<MANUAL_COOLDOWN;
    const rateUntil=radarState.rateLimitedUntil?new Date(radarState.rateLimitedUntil).getTime():0;

    if(!force&&fresh)return {ok:true,items:RadarDoctor.relevant(),cached:true,reason:'fresh'};
    if(force&&rateUntil>now)return {ok:false,reason:'rate-limit',nextAllowedAt:rateUntil,items:RadarDoctor.relevant()};
    if(force&&cooling)return {ok:false,reason:'cooldown',nextAllowedAt:lastAttempt+MANUAL_COOLDOWN,items:RadarDoctor.relevant()};
    if(!navigator.onLine)return {ok:false,reason:'offline',items:RadarDoctor.relevant()};
    if(!GroqAI.hasKey())return {ok:false,reason:'no-key',items:RadarDoctor.relevant()};
    if(this._refreshing)return {ok:false,reason:'busy',items:RadarDoctor.relevant()};

    this._refreshing=true;
    // Every attempt, including a failed one, gets a local cooldown. This is
    // critical: repeated clicks must never turn a 429 into a request storm.
    Store.state.radar.lastAttemptAt=new Date(now).toISOString();
    Store.state.radar.nextAllowedAt=new Date(now+MANUAL_COOLDOWN).toISOString();
    Store.save();
    try{
      const c=EXAM_CONFIG;
      const officialDomains=['institutoverbena.ufg.br','camaraipameri.go.gov.br'];
      const radarSources=Array.isArray(c.radarSources)?c.radarSources:[];
      const prompt=[
        'Você é o RADAR DOCTOR. Faça UMA busca web real e exclusiva do concurso deste aplicativo.',
        `CONCURSO: ${c.productName}. Órgão: ${c.orgName}. Cargo: ${c.cargo}. Banca: ${c.banca}. Edital: ${c.editalNumber}.`,
        'A busca web é obrigatória. Procure a publicação oficial mais recente e qualquer atualização relevante do certame.',
        `Pesquise pelos termos: "${c.orgName}", "${c.cargo}", "${c.editalNumber}", "${c.banca}" e "Ipameri".`,
        radarSources.length?`Páginas-âncora: ${radarSources.join(' | ')}`:'',
        'Prioridade: Instituto Verbena/UFG e Câmara Municipal de Ipameri. Considere edital, retificação, comunicado, cronograma, local/horário de prova, convocação, gabarito e resultado.',
        'Não invente notícia, URL ou data. Não use conhecimento interno como fonte.',
        'Retorne SOMENTE JSON: {"items":[{"title":"...","summary":"...","body":"...","action":"...","category":"EDITAL|COMUNICADO|CRONOGRAMA|PROVA|GABARITO|RESULTADO|OUTRO","source":"...","url":"...","date":"...","official":true,"contestRelated":true}]}.',
        'No máximo 7 itens. Se não encontrar novidade, retorne items vazio.',
        `Data atual: ${new Date(now).toLocaleDateString('pt-BR')}.`
      ].filter(Boolean).join('\n');

      // UMA única chamada por atualização. Nada de segunda tentativa automática:
      // isso era uma das causas do consumo desnecessário da quota.
      const r=await this.call({
        model:'groq/compound-mini',
        messages:[
          {role:'system',content:'Você é um monitor oficial de concursos. Execute uma busca web antes de responder. Use somente fontes encontradas na web.'},
          {role:'user',content:prompt}
        ],
        responseFormat:null,temperature:0,timeout:60000,
        searchSettings:{country:'brazil',include_domains:officialDomains},maxTokens:1800
      });
      if(!r.ok){
        if(r.status===429){
          const until=Date.now()+Math.max(60000,Number(r.retryAfterMs||0));
          Store.state.radar.rateLimitedUntil=new Date(until).toISOString();
          Store.state.radar.nextAllowedAt=new Date(until).toISOString();
          Store.save();
          return {...r,reason:'rate-limit',nextAllowedAt:until,items:RadarDoctor.relevant()};
        }
        return {...r,items:RadarDoctor.relevant()};
      }

      const parsed=this.parseJSON(r.content);
      let contestItems=Array.isArray(parsed?.items)?parsed.items:[];
      if(!contestItems.length){
        contestItems=this._radarItemsFromSearchResults(this._extractRadarSearchResults(r.data),now);
      }

      const clean=[]; const seen=new Set();
      for(const x of contestItems){
        if(!x||!x.title)continue;
        const title=String(x.title).trim();
        const summary=String(x.summary||x.text||x.snippet||x.content||'').trim();
        const url=String(x.url||x.link||'').trim();
        let source=String(x.source||x.domain||'').trim();
        if(!source&&url){try{source=new URL(url).hostname.replace(/^www\./,'')}catch(_){} }
        if(!title||!summary||!source||!url||!this._radarAllowedUrl(url))continue;
        const key=title.toLowerCase().replace(/\W+/g,' ')+'|'+url.toLowerCase();
        if(seen.has(key))continue; seen.add(key);
        clean.push({
          id:`radar-ai-${now}-${clean.length}`,tag:String(x.category||'CONCURSO ATUAL'),
          title:title.slice(0,180),text:summary.slice(0,700),body:String(x.body||summary).trim().slice(0,2600),
          action:String(x.action||'').trim().slice(0,1400),source:source.slice(0,140),url,
          date:String(x.date||new Date(now).toLocaleDateString('pt-BR')).slice(0,40),
          priority:'high',official:Boolean(x.official!==false),contestRelated:true,isPromotion:false
        });
        if(clean.length>=7)break;
      }

      const promotions=RadarDoctor.platformCatalog().length?this._catalogPromotions(now):[];
      const finalItems=[...clean,...promotions.slice(0,3)];
      if(!finalItems.length)return {ok:false,reason:'radar-empty',items:RadarDoctor.relevant()};

      delete Store.state.radar.rateLimitedUntil;
      RadarDoctor.items=finalItems;
      Store.state.radar.items=finalItems;
      Store.state.radar.seenIds=finalItems.map(x=>x.id);
      Store.state.radar.lastSyncAt=new Date().toISOString();
      Store.state.radar.nextAllowedAt=new Date(now+MANUAL_COOLDOWN).toISOString();
      Store.state.radar.refreshCount=(Store.state.radar.refreshCount||0)+1;
      Store.state.aiCore.lastRadarAt=Store.state.radar.lastSyncAt;
      Store.save();
      return {ok:true,items:finalItems,webSearch:true,model:r.model,refreshCount:Store.state.radar.refreshCount,contestCount:clean.length,promotionCount:promotions.length};
    } finally { this._refreshing=false; }
  }};

window.__DOCTOR_SPLASH_STARTED_AT = window.__DOCTOR_SPLASH_STARTED_AT || performance.now();

const UI = {
  currentView: 'home',
  practiceSubject: null,
  flashcardSubject: null,
  flashcardSession: null,
  _navIndex: 0,
  _navReady: false,
  _renderingFromHistory: false,

  init() {
    Store.load();
    document.documentElement.setAttribute('data-theme', Store.state.theme);
    document.documentElement.style.setProperty('--blue-dark', EXAM_CONFIG.primaryColor);
    document.documentElement.style.setProperty('--blue-mid', EXAM_CONFIG.primaryColorMid);
    document.documentElement.style.setProperty('--green', EXAM_CONFIG.accentColor);
    document.documentElement.style.setProperty('--green-dark', EXAM_CONFIG.accentColorDark);
    document.getElementById('theme-toggle').innerHTML = Store.state.theme === 'dark' ? ICONS.moon : ICONS.sun;
    document.getElementById('notes-toggle').innerHTML = ICONS.book;
    document.getElementById('recorder-toggle').innerHTML = ICONS.microphone;
    document.getElementById('settings-toggle').innerHTML = ICONS.gear;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js?v=1.10.8', { updateViaCache: 'none' }).then(reg => { try { reg.update(); } catch(e) {} }).catch(() => {});
      // IMPORTANTE: clients.claim() pode disparar controllerchange na PRIMEIRA
      // instalação. Isso não é uma atualização e não pode recarregar o app.
      // Só recarregamos quando a página já estava sendo controlada por um
      // SW anterior. Assim eliminamos o segundo splash ao abrir a PWA.
      const hadServiceWorkerController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadServiceWorkerController) return;
        if (sessionStorage.getItem('doctor-core-sw-reloaded') !== '1') {
          sessionStorage.setItem('doctor-core-sw-reloaded','1');
          window.location.reload();
        }
      });
      setTimeout(() => sessionStorage.removeItem('doctor-core-sw-reloaded'), 12000);
      // Se uma instalação antiga conseguir abrir uma cópia stale do HTML,
      // consulta o marcador de build sem usar cache e força a versão atual.
      fetch('./version.json?v=1.10.8-' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(v => {
        if (v?.version && v.version !== DOCTOR_CORE_BUILD) window.location.reload();
      }).catch(() => {});
    }
    // A navegação do PWA usa a History API como pilha real. Isso faz o
    // botão físico/gesto de voltar do Android navegar dentro do app em vez
    // de encerrar a tela. O primeiro estado é sempre a Home.
    const resumableSim = Quiz.resumableSimulado();
    history.replaceState({ doctorCore: true, view: 'home', navIndex: 0 }, '', location.href);
    this._navIndex = 0;
    this._navReady = true;
    if (resumableSim) {
      Quiz.session = resumableSim;
      this.render('simuladoRunning');
    } else {
      this.render('home', { replaceHistory: true, fromHistory: true });
    }
    window.addEventListener('popstate', (event) => {
      const state = event.state;
      if (state?.doctorCore) {
        this._navIndex = Math.max(0, Number(state.navIndex) || 0);
        this.render(state.view || 'home', { fromHistory: true, skipHistory: true });
      } else if (this.currentView !== 'home') {
        // Se o navegador entregar um estado externo inesperado, preservamos
        // a regra do app: primeiro voltar para a Home, sem perder o usuário.
        history.pushState({ doctorCore: true, view: 'home', navIndex: 0 }, '', location.href);
        this._navIndex = 0;
        this.render('home', { replaceHistory: true, fromHistory: true });
      }
    });
    window.addEventListener('pagehide', () => { try { if (CoreRecorder.isRecording()) CoreRecorder.stop(); } catch(e) {} });
    this.refreshGlobalChrome();
    window.addEventListener('online', () => { CoreSync.flush(); this.refreshGlobalChrome(); });
    window.addEventListener('offline', () => this.refreshGlobalChrome());
    CoreSync.claimSession();
    // V1.10.8: Radar NÃO pesquisa automaticamente no boot. Uma abertura do app
    // não pode consumir quota GROQ nem disparar várias buscas silenciosas.
    document.getElementById('theme-toggle').addEventListener('click', () => this.toggleTheme());
    // V1.8.5 — a marca Doctor Concursos é a âncora global da navegação.
    // O listener fica dentro do ciclo de inicialização do Core, garantindo
    // que o clique seja registrado depois que UI.render já existe.
    document.getElementById('topbar-home')?.addEventListener('click', () => {
      this.goHome();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.getElementById('notes-toggle')?.addEventListener('click', () => this.render('notes'));
    document.getElementById('recorder-toggle')?.addEventListener('click', () => this.render('recorderPick'));
    document.getElementById('settings-toggle')?.addEventListener('click', () => this.render('settings'));
    // V1.9.9+ — Splash com duração mínima para reforçar a sensação de
    // inicialização/atualização. A versão fica visível antes mesmo do JS
    // terminar o boot, evitando a impressão de que a atualização não entrou.
    const splash = document.getElementById('splash');
    const splashStartedAt = window.__DOCTOR_SPLASH_STARTED_AT || performance.now();
    const SPLASH_MIN_MS = 2000;
    const elapsed = performance.now() - splashStartedAt;
    const wait = Math.max(0, SPLASH_MIN_MS - elapsed);
    if (splash) {
      const versionBadge = document.getElementById('splash-version');
      if (versionBadge) versionBadge.textContent = 'VERSÃO ' + DOCTOR_CORE_BUILD;
      const status = document.getElementById('splash-subtitle');
      if (status) status.textContent = navigator.onLine ? 'Preparando seu ambiente de estudo' : 'Carregando seus estudos salvos';
      setTimeout(() => {
        splash.classList.add('is-hiding');
        setTimeout(() => splash.remove(), 380);
      }, wait);
    }
  },

  refreshGlobalChrome() {
    const mount=document.getElementById('radar-ticker-mount');
    if(mount){
      mount.innerHTML=RadarDoctor.ticker();
      if(!mount.dataset.radarBound){
        mount.addEventListener('click',(e)=>{
          const item=e.target.closest('[data-radar-id]');
          if(!item) return;
          this._radarArticleId=item.dataset.radarId;
          this.render('radarArticle');
        });
        mount.dataset.radarBound='1';
      }
    }
    const b=document.getElementById('ai-indicator'); if(!b) return;
    const has=!!GroqAI.getKey();
    b.classList.toggle('off',!has);
    b.innerHTML=`<span class="ai-mini-dot"></span><span class="ai-mini-text">${has?'IA ativa':'IA'}</span>`;
    b.title=has?'IA Doctor ativa · GROQ configurada · abrir status':'IA Doctor não configurada · toque para configurar';
    b.setAttribute('aria-label',b.title);
    b.onclick=()=>this.render('settings');
  },

  toggleTheme() {
    Store.state.theme = Store.state.theme === 'dark' ? 'light' : 'dark';
    Store.save();
    document.documentElement.setAttribute('data-theme', Store.state.theme);
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.innerHTML = Store.state.theme === 'dark' ? ICONS.moon : ICONS.sun;
  },

  toast(msg, type = '') {
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  },

  _decoratePageBack() {
    const legacyIds = ['rec-back','rec-sub-back','notes-back','essay-back','radar-back','radar-article-back','pf-back','rv-back','back-home','practice-back','fc-back','fc-session-back'];
    legacyIds.forEach(id => document.getElementById(id)?.classList.add('legacy-page-back'));
    if (this.currentView !== 'home' && this.currentView !== 'simuladoRunning') {
      const main = document.getElementById('main-view');
      if (main && !main.querySelector('.page-back-bottom')) {
        const nav = document.createElement('div');
        nav.className = 'page-back-bottom';
        nav.innerHTML = '<button type="button" class="btn btn-outline page-back-button" id="page-back-bottom" aria-label="Voltar para a página anterior">← Voltar</button>';
        main.appendChild(nav);
        nav.querySelector('#page-back-bottom')?.addEventListener('click', () => this.back());
      }
    }
  },

  back() {
    if (this.currentView === 'home') return;
    if (this._navIndex > 0) { history.back(); return; }
    this.goHome();
  },

  goHome() {
    if (this.currentView === 'home') return;
    if (this._navIndex > 0) { history.go(-this._navIndex); return; }
    this.render('home', { replaceHistory: true });
  },

  render(view, opts = {}) {
    // Home é a raiz da navegação: ir para Home limpa a pilha interna.
    if (view === 'home' && !opts.fromHistory && this.currentView !== 'home' && this._navIndex > 0) {
      this.goHome();
      return;
    }
    this.currentView = view;
    if (this._navReady && !opts.skipHistory && !opts.fromHistory) {
      if (opts.replaceHistory) {
        history.replaceState({ doctorCore: true, view, navIndex: this._navIndex }, '', location.href);
      } else {
        this._navIndex += 1;
        history.pushState({ doctorCore: true, view, navIndex: this._navIndex }, '', location.href);
      }
    }
    document.getElementById('main-view').innerHTML = Views[view] ? Views[view]() : Views.home();
    if (Views.bind[view]) Views.bind[view]();
    this._decoratePageBack();
    this.refreshGlobalChrome();
    window.scrollTo(0, 0);
  }
};


/* ===== DOCTOR CORE V1 SERVICES ===== */
const RadarDoctor = {
  _refreshing:false,
  _lastAutoRefreshAt:0,
  items:[],

  // Catálogo comercial: somente produtos ativos da Plataforma podem aparecer
  // como divulgação. O produto atual nunca entra na propaganda.
  platformCatalog(){
    const bridge=window.DOCTOR_PLATFORM_BRIDGE;
    let list=null;
    try{
      if(bridge && typeof bridge.getProductCatalog==='function') list=bridge.getProductCatalog();
    }catch(_){ list=null; }
    if(!Array.isArray(list)) list=window.DOCTOR_PLATFORM_CATALOG;
    if(!Array.isArray(list)) list=EXAM_CONFIG.platformCatalog;
    return list.filter(x=>x && (x.status==='active'||x.active===true) && x.productId!==EXAM_CONFIG.productId);
  },

  currentProduct(){
    const c=EXAM_CONFIG;
    return {
      productId:c.productId,
      appId:c.appId,
      name:c.productName,
      shortName:c.productName,
      banca:c.banca,
      orgName:c.orgName,
      cargo:c.cargo,
      editalNumber:c.editalNumber
    };
  },

  relevant(){
    const stored=Store.state.radar?.items;
    if(Array.isArray(stored))this.items=stored;
    return [...this.items].sort((a,b)=>{
      if(Boolean(a.isPromotion)!==Boolean(b.isPromotion)) return a.isPromotion?1:-1;
      return (b.priority==='high'?2:1)-(a.priority==='high'?2:1);
    });
  },

  ticker(){
    const arr=this.relevant();
    if(!arr.length){
      return `<div class="radar-ticker" aria-label="Radar Doctor"><div class="radar-label">📡 RADAR DOCTOR <span>• AO VIVO</span></div><div class="radar-track"><div class="radar-move" style="animation:none;transform:none;padding-left:22px"><span class="radar-item">Radar aguardando pesquisa manual — toque em <b>Atualizar Radar</b></span></div></div></div>`;
    }
    const doubled=[...arr,...arr];
    return `<div class="radar-ticker" aria-label="Radar Doctor"><div class="radar-label">📡 RADAR DOCTOR <span>• AO VIVO</span></div><div class="radar-track"><div class="radar-move">${doubled.map(n=>`<span class="radar-item" data-radar-id="${n.id}">[${String(n.tag||'RADAR')}] <b>${String(n.title||'').replace(/</g,'&lt;')}</b></span>`).join('')}</div></div></div>`;
  },

  card(){
    const n=this.relevant()[0];
    const title=n?String(n.title||'Radar Doctor'):'Radar Doctor pronto para monitorar seu concurso';
    const text=n?String(n.text||''):'Toque em Ver notícias para consultar a banca e as fontes oficiais em tempo real.';
    const source=n?String(n.source||''):'Pesquisa web oficial · GROQ';
    return `<div class="section-title">📡 Radar Doctor</div><div class="card radar-card"><div class="radar-preview"><div><span class="tag">RADAR</span><h3>${title.replace(/</g,'&lt;')}</h3><p>${text.replace(/</g,'&lt;')}</p></div></div><div class="subj-row" style="margin-top:10px"><span class="muted">${source.replace(/</g,'&lt;')}</span><button class="btn btn-outline btn-sm" id="open-radar">Ver notícias</button></div></div>`;
  },

  _timeLabel(){const t=Store.state.radar?.lastSyncAt;return t?new Date(t).toLocaleString('pt-BR'):'Ainda não atualizada';},

// Armazenamento persistente dos áudios: IndexedDB evita perder gravações ao recarregar o PWA.
const AudioDB = {
  db:null,
  async open(){
    if(this.db)return this.db;
    this.db=await new Promise((resolve,reject)=>{const r=indexedDB.open('doctor-audio-v1',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('blobs'))r.result.createObjectStore('blobs');};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
    return this.db;
  },
  async put(id,blob){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('blobs','readwrite');tx.objectStore('blobs').put(blob,id);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);});},
  async get(id){const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction('blobs').objectStore('blobs').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});},
  async remove(id){try{const db=await this.open();db.transaction('blobs','readwrite').objectStore('blobs').delete(id);}catch(e){}}
};
const CoreRecorder = {
  mediaRecorder:null, chunks:[], stream:null, startedAt:null, stopping:false, stopPromise:null, mimeType:'', lastError:null,
  isRecording(){ return !!this.mediaRecorder && this.mediaRecorder.state === 'recording'; },
  _cleanup(){
    try{ this.stream?.getTracks?.().forEach(t=>{try{t.stop();}catch(e){}}); }catch(e){}
    this.stream=null; this.mediaRecorder=null; this.startedAt=null; this.stopping=false;
  },
  _errorMessage(err){
    const n=err?.name||'';
    if(n==='NotAllowedError'||n==='SecurityError') return 'Permissão do microfone negada. Autorize o microfone para este aplicativo e tente novamente.';
    if(n==='NotFoundError') return 'Nenhum microfone disponível foi encontrado neste dispositivo.';
    if(n==='NotReadableError'||n==='TrackStartError') return 'O microfone está ocupado por outro aplicativo. Feche o outro uso do microfone e tente novamente.';
    if(n==='OverconstrainedError') return 'O microfone deste dispositivo não aceitou as configurações solicitadas.';
    if(n==='AbortError') return 'O acesso ao microfone foi interrompido. Tente novamente.';
    return err?.message || 'Não foi possível iniciar a gravação neste dispositivo.';
  },
  async start(){
    if(this.isRecording()) return;
    if(this.stopping) throw new Error('O gravador ainda está finalizando a gravação anterior. Aguarde um instante.');
    if(!window.isSecureContext) throw new Error('O microfone só pode ser usado em uma conexão segura (HTTPS).');
    if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) throw new Error('Gravação de áudio não é suportada neste navegador.');
    this.lastError=null; this.chunks=[]; this.mimeType='';
    let stream=null;
    try{
      // Compatibilidade ampla: começamos com áudio simples e aplicamos melhorias quando o navegador aceitar.
      try{
        stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      }catch(firstErr){
        stream=await navigator.mediaDevices.getUserMedia({audio:true});
      }
      this.stream=stream;
      const candidates=[
        'audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/ogg;codecs=opus'
      ];
      const supported=candidates.filter(x=>{try{return typeof MediaRecorder.isTypeSupported==='function'?MediaRecorder.isTypeSupported(x):true;}catch(e){return false;}});
      const attempts=[...supported,''];
      let recorder=null, chosen='';
      let lastCtorError=null;
      for(const mime of attempts){
        try{
          recorder=mime?new MediaRecorder(stream,{mimeType:mime,audioBitsPerSecond:128000}):new MediaRecorder(stream,{audioBitsPerSecond:128000});
          chosen=recorder.mimeType||mime||'';
          break;
        }catch(e){lastCtorError=e;}
      }
      if(!recorder) throw lastCtorError||new Error('Este dispositivo não encontrou um formato de gravação compatível.');
      this.mediaRecorder=recorder; this.mimeType=chosen||'audio/webm'; this.chunks=[];
      recorder.ondataavailable=e=>{ if(e?.data?.size) this.chunks.push(e.data); };
      recorder.onerror=e=>{ this.lastError=e?.error||new Error('O navegador interrompeu a gravação.'); };
      try{ recorder.start(250); }catch(e){ this._cleanup(); throw e; }
      this.startedAt=Date.now();
      return {mimeType:this.mimeType};
    }catch(err){
      this._cleanup();
      const e=new Error(this._errorMessage(err)); e.name=err?.name||'RecorderStartError'; throw e;
    }
  },
  stop(){
    if(this.stopPromise) return this.stopPromise;
    const r=this.mediaRecorder;
    if(!r){ this._cleanup(); return Promise.resolve(null); }
    this.stopping=true;
    this.stopPromise=new Promise(resolve=>{
      let settled=false;
      const finish=()=>{
        if(settled)return; settled=true;
        const type=r.mimeType||this.mimeType||'audio/webm';
        const parts=this.chunks.slice();
        const blob=parts.length?new Blob(parts,{type}):null;
        this._cleanup(); this.chunks=[]; this.stopPromise=null;
        resolve(blob);
      };
      const watchdog=setTimeout(finish,5000);
      const done=()=>{clearTimeout(watchdog);finish();};
      r.addEventListener?.('stop',done,{once:true});
      r.addEventListener?.('error',done,{once:true});
      try{
        if(r.state==='recording'){
          try{r.requestData?.();}catch(e){}
          r.stop();
        }else done();
      }catch(e){done();}
    });
    return this.stopPromise;
  }
};

  save(title,body,editingId=null){const now=new Date().toISOString();if(editingId){const e=Store.state.essays.find(x=>x.id===editingId);if(!e)return null;Object.assign(e,{title:title.trim()||'Redação',body:body.trim(),updatedAt:now});Store.save();return e;}const e={id:'essay-'+Date.now(),title:title.trim()||'Redação',body:body.trim(),createdAt:now,updatedAt:now};Store.state.essays.unshift(e);Store.state.syncQueue.push({type:'upsert',entity:'essay',id:e.id,at:now});Store.save();return e;},

    const key=GroqAI.getKey(); if(!key) return {ok:false,reason:'no-key'};
    const fd=new FormData(); fd.append('file',blob,`${rec.name||'rascunho'}.${(blob.type||'audio/webm').includes('mp4')?'mp4':'webm'}`); fd.append('model','whisper-large-v3-turbo'); fd.append('language','pt'); fd.append('response_format','json'); fd.append('temperature','0');
    try{
      const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),90000);
      const res=await fetch('https://api.groq.com/openai/v1/audio/transcriptions',{method:'POST',signal:controller.signal,headers:{'Authorization':`Bearer ${key}`},body:fd}); clearTimeout(timeout);
      let data=null; try{data=await res.json();}catch{}
      if(!res.ok) return {ok:false,status:res.status,error:data?.error?.message||'A GROQ não conseguiu transcrever este áudio.'};
      const text=String(data?.text||'').trim(); if(!text)return {ok:false,error:'A transcrição retornou vazia.'};
      rec.transcript=text; rec.transcribedAt=new Date().toISOString(); Store.state.essayDraft.audioId=rec.audioId; Store.state.essayDraft.body=text; Store.state.essayDraft.title=Store.state.essayDraft.title||`Rascunho falado — ${new Date(rec.createdAt).toLocaleDateString('pt-BR')}`; Store.save();
      return {ok:true,text,recording:rec};
    }catch(e){return {ok:false,error:e?.name==='AbortError'?'A transcrição demorou demais. Tente novamente.':'Não foi possível conectar à GROQ para transcrever o áudio.'};}
  }
};
