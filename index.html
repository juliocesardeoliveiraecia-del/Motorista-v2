[data-theme="dark"] { --bg: #071322; --surface: #0F2341; --text: #F4F6F9; --text-muted: #9AA5B1; --border: #1C3B63; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
body { padding-bottom: 24px; }
button { font-family: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0 0 8px; }
p { margin: 0 0 8px; }
a { color: var(--green-dark); }

#splash {
  position: fixed; inset: 0; z-index: 999; background: linear-gradient(160deg, var(--blue-dark), var(--blue-mid));
  display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; transition: opacity .3s;
}
#splash .logo { font-size: 48px; margin-bottom: 12px; }

.topbar {
  position: sticky; top: 0; z-index: 50; background: var(--blue-dark); color: #fff;
  padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
}
.topbar h1 { font-size: 15px; }
.icon-btn { background: rgba(255,255,255,.1); border: none; color: #fff; width: 34px; height: 34px; border-radius: 8px; }

main { padding: 16px; max-width: 640px; margin: 0 auto; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.card.center { text-align: center; }
.card.hero { background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid)); color: #fff; border: none; }
.hero-label { font-size: 12px; color: #B9C8DE; }
.hero-days { font-size: 30px; font-weight: 900; }
.hero-sub { font-size: 12px; color: #B9C8DE; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { text-align: center; }
.stat-value { font-size: 22px; font-weight: 800; }
.stat-label { font-size: 11px; color: var(--text-muted); }

.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 16px 0 6px; }

.btn { display: block; width: 100%; padding: 13px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px; margin-bottom: 8px; text-align: center; }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 12px; width: auto; }
.btn-primary { background: var(--green); color: #05271A; }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn-ghost { background: transparent; color: var(--text-muted); border: none; font-weight: 600; }
.btn-danger { background: var(--red); color: #fff; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; background: rgba(46,204,113,.15); color: var(--green-dark); margin-right: 6px; }
.badge-ai { background: rgba(15,35,65,.1); color: var(--blue-dark); }
.badge-live { background: rgba(245,166,35,.18); color: #9A6300; }
[data-theme="dark"] .badge-live { color: var(--orange); background: rgba(245,166,35,.15); }
[data-theme="dark"] .badge-ai { background: rgba(255,255,255,.1); color: #fff; }
.badge.timer { background: var(--blue-dark); color: #fff; }

.progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 20px; overflow: hidden; margin-top: 4px; }
.progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--green-dark)); }

.subj-row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 10px; }
.subj-row:first-child { margin-top: 0; }
.subj-name { font-weight: 600; }

.pick-card { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
.subject-icon { font-size: 22px; }
.pick-info { flex: 1; }
.pick-info .name { font-weight: 700; font-size: 14px; }
.pick-info .meta { font-size: 11px; color: var(--text-muted); }
.chev { color: var(--text-muted); font-size: 18px; }

.q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.q-text { font-size: 15px; font-weight: 600; margin-bottom: 14px; line-height: 1.45; }
.q-option { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); margin-bottom: 8px; font-size: 13.5px; }
.q-option .letter { width: 24px; height: 24px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
.q-option.correct { border-color: var(--green); background: rgba(46,204,113,.1); }
.q-option.correct .letter { background: var(--green); color: #05271A; }
.q-option.wrong { border-color: var(--red); background: rgba(231,76,60,.1); }
.q-option.wrong .letter { background: var(--red); color: #fff; }

.explanation { margin-top: 10px; padding: 12px; border-radius: 12px; background: rgba(15,35,65,.05); border-left: 4px solid var(--blue-mid); font-size: 13px; line-height: 1.5; }
[data-theme="dark"] .explanation { background: rgba(255,255,255,.05); }

.warn-card { border-left: 4px solid var(--orange); }
.muted { font-size: 12.5px; color: var(--text-muted); }
.center { text-align: center; }
.big-emoji { font-size: 38px; }
.text-green { color: var(--green-dark); }
.text-orange { color: var(--orange); }
.empty { text-align: center; padding: 30px; color: var(--text-muted); }

input[type=password], input[type=text] { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; margin-bottom: 8px; }

#toast-container { position: fixed; top: 14px; left: 0; right: 0; z-index: 998; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: var(--blue-dark); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; max-width: 90%; text-align: center; }
.toast.success { background: var(--green-dark); }
.toast.warn { background: var(--orange); color: #3A2400; }

</style>
</head>

/* ============================================================
   APP.JS — Motorista Legislativo Ipameri · versão enxuta
   Foco: praticar questões fiéis ao edital, gerar mais com IA
   quando acabar, guardar desempenho, simulado oficial.

const STORAGE_KEY = 'motorista-ipameri-v2';
const EXAM_DATE = new Date('2026-09-13T13:00:00'); // prova é no período vespertino

function defaultState() {
  const progress = {};
  const answeredIds = {};
  SUBJECTS.forEach(s => {
    progress[s.id] = { answered: 0, correct: 0 };
    answeredIds[s.id] = [];
  });
  return {
    theme: 'dark',
    groqApiKey: '',
    progress,
    answeredIds,
    simulados: [],
    aiQuestions: [], // questões geradas por IA, persistidas aqui para sobreviver a reload/fechar o app
    activeSession: null // sessão de prática/simulado em andamento, para retomar de onde parou
  };
}

const Store = {
  state: null,
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      this.state = raw ? JSON.parse(raw) : defaultState();
      SUBJECTS.forEach(s => {
        if (!this.state.progress[s.id]) this.state.progress[s.id] = { answered: 0, correct: 0 };
        if (!this.state.answeredIds[s.id]) this.state.answeredIds[s.id] = [];
      });
      if (!Array.isArray(this.state.aiQuestions)) this.state.aiQuestions = [];
      if (this.state.activeSession === undefined) this.state.activeSession = null;

      // Reintroduz no banco de questões (QUESTIONS) as que a IA já tinha gerado antes,
      // para não perdê-las ao fechar/reabrir o app.
      const existingIds = new Set(QUESTIONS.map(q => q.id));
      this.state.aiQuestions.forEach(q => {
        if (!existingIds.has(q.id)) {
          QUESTIONS.push(q);
          existingIds.add(q.id);
        }
      });
    } catch (e) {
      this.state = defaultState();
    }
    return this.state;
  },
  save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); },
  reset() {
    this.state = defaultState();
    this.save();
    // remove também da sessão atual (em memória), não só do que será salvo
    for (let i = QUESTIONS.length - 1; i >= 0; i--) {
      if (QUESTIONS[i].aiGenerated) QUESTIONS.splice(i, 1);
    }
  },
  daysUntilExam() {
    const diff = EXAM_DATE - new Date();
    return Math.max(0, Math.ceil(diff / 86400000));
  },
  registerAnswer(subjectId, questionId, correct) {
    const p = this.state.progress[subjectId];
    p.answered++;
    if (correct) p.correct++;
    if (!this.state.answeredIds[subjectId].includes(questionId)) {
      this.state.answeredIds[subjectId].push(questionId);
    }
    this.save();
  },
  overallAccuracy() {
    let answered = 0, correct = 0;
    Object.values(this.state.progress).forEach(p => { answered += p.answered; correct += p.correct; });
    return answered > 0 ? Math.round((correct / answered) * 100) : 0;
  }
};

const Quiz = {
  shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },

  poolFor(subjectId) {
    return QUESTIONS.filter(q => q.subjectId === subjectId);
  },

  // Prioriza questões nunca respondidas; se acabar, embaralha as já vistas.
  buildPracticeQueue(subjectId, count) {
    const all = this.poolFor(subjectId);
    const seen = new Set(Store.state.answeredIds[subjectId]);
    const unseen = this.shuffle(all.filter(q => !seen.has(q.id)));
    const alreadySeen = this.shuffle(all.filter(q => seen.has(q.id)));
    return [...unseen, ...alreadySeen].slice(0, count);
  },

  session: null,

  // Salva a sessão atual (fila exata de questões, posição, respostas) para
  // sobreviver a fechar o navegador ou apertar "voltar". É isso que permite
  // continuar exatamente de onde parou, em vez de recomeçar do zero.
  persist() {
    Store.state.activeSession = this.session;
    Store.save();
  },

  clearPersisted() {
    Store.state.activeSession = null;
    Store.save();
  },

  // Tenta retomar uma sessão salva anteriormente (se ainda não tiver sido concluída).
  // Retorna true se conseguiu retomar.
  resumeIfAny() {
    const saved = Store.state.activeSession;
    if (saved && saved.questions && saved.index < saved.questions.length) {
      this.session = saved;
      return true;
    }
    return false;
  },

  // Verifica se já existe uma sessão de prática em andamento para essa matéria específica
  resumablePracticeFor(subjectId) {
    const saved = Store.state.activeSession;
    if (saved && saved.type === 'practice' && saved.subjectId === subjectId && saved.index < saved.questions.length) {
      return saved;
    }
    return null;
  },

  resumableSimulado() {
    const saved = Store.state.activeSession;
    if (saved && saved.type === 'simulado' && saved.index < saved.questions.length) {
      return saved;
    }
    return null;
  },

  startPractice(subjectId, count = 10) {
    this.session = {
      type: 'practice',
      subjectId,
      questions: this.buildPracticeQueue(subjectId, count),
      index: 0,
      answers: []
    };
    this.persist();
    return this.session;
  },

  // Simulado oficial: usa a distribuição exata do edital (10/3/2/25 = 40, 100 pontos)
  startSimulado() {
    let questions = [];
    SUBJECTS.forEach(s => {
      const pool = this.shuffle(this.poolFor(s.id));
      questions = questions.concat(pool.slice(0, s.officialQuestions));
    });
    this.session = {
      type: 'simulado',
      questions: this.shuffle(questions),
      index: 0,
      answers: [],
      startedAt: Date.now(),
      timeLimitSeconds: 4 * 60 * 60 // 4 horas, igual à prova real
    };
    this.persist();
    return this.session;
  },

  simuladoReadiness() {
    return SUBJECTS.map(s => ({
      subject: s,
      have: this.poolFor(s.id).length,
      need: s.officialQuestions,
      missing: Math.max(0, s.officialQuestions - this.poolFor(s.id).length)
    }));
  },

  answerCurrent(optionIndex) {
    const s = this.session;
    const q = s.questions[s.index];
    const correct = optionIndex === q.correct;
    s.answers.push({ questionId: q.id, subjectId: q.subjectId, selected: optionIndex, correct });
    Store.registerAnswer(q.subjectId, q.id, correct);
    this.persist();
    return correct;
  },

  nextQuestion() {
    this.session.index++;
    this.persist();
    return this.session.index < this.session.questions.length;
  },

  finishSimulado() {
    const s = this.session;
    const timeSpentSec = Math.round((Date.now() - s.startedAt) / 1000);
    const bySubject = {};
    let totalPoints = 0, earnedPoints = 0;

    SUBJECTS.forEach(subj => { bySubject[subj.id] = { correct: 0, total: 0, points: 0 }; });

    s.answers.forEach(a => {
      const subj = SUBJECTS.find(x => x.id === a.subjectId);
      bySubject[a.subjectId].total++;
      totalPoints += subj.points;
      if (a.correct) {
        bySubject[a.subjectId].correct++;
        bySubject[a.subjectId].points += subj.points;
        earnedPoints += subj.points;
      }
    });

    const result = {
      date: new Date().toISOString(),
      score: earnedPoints,
      total: totalPoints || 100,
      timeSpentSec,
      bySubject
    };
    Store.state.simulados.push(result);
    this.clearPersisted();
    Store.save();
    return result;
  }
};

    {
      "text": "texto da pergunta",
      "options": ["alternativa a", "alternativa b", "alternativa c", "alternativa d"],
      "correct": 0,
      "explanations": ["explicação da a", "explicação da b", "explicação da c", "explicação da d"]
    }
  ]
}`;
  },

  async generateQuestions(subjectId, count = 6) {
    const key = this.getKey();
    if (!key) return { ok: false, reason: 'no-key' };

    const subject = SUBJECTS.find(s => s.id === subjectId);
    if (!subject) return { ok: false, reason: 'invalid-subject' };

    const existingSamples = Quiz.shuffle(Quiz.poolFor(subjectId)).slice(0, 5);
    const prompt = this._buildPrompt(subject, count, existingSamples);

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      const res = await fetch(GROQ_ENDPOINT, {
        method: 'POST',
        signal: controller.signal,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body: JSON.stringify({
          model: GROQ_MODEL,
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.6,
          response_format: { type: 'json_object' }
        })
      });
      clearTimeout(timeoutId);

      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status}: ${errText.slice(0, 150)}`);
      }

      const data = await res.json();
      const rawContent = data.choices?.[0]?.message?.content;
      if (!rawContent) throw new Error('Resposta vazia da IA.');

      const parsed = JSON.parse(rawContent);
      const rawQuestions = Array.isArray(parsed.questions) ? parsed.questions : [];
      const validated = this._validateAndTag(rawQuestions, subjectId);

      if (validated.length === 0) throw new Error('Nenhuma questão passou na validação de formato.');

      validated.forEach(q => {
        QUESTIONS.push(q);
        Store.state.aiQuestions.push(q); // salva de verdade, sobrevive a fechar o app
      });
      Store.save();

      return { ok: true, added: validated.length };
    } catch (e) {
      console.error('Erro ao gerar questões:', e);
      return { ok: false, reason: 'error', error: e };
    }
  },

  _validateAndTag(rawQuestions, subjectId) {
    const stamp = Date.now();
    const valid = [];
    rawQuestions.forEach((q, i) => {
      if (!q || typeof q.text !== 'string' || !q.text.trim()) return;
      if (!Array.isArray(q.options) || q.options.length !== 4) return;
      if (typeof q.correct !== 'number' || q.correct < 0 || q.correct > 3) return;
      if (!Array.isArray(q.explanations) || q.explanations.length !== 4) return;
      valid.push({
        id: `${subjectId}-ai-${stamp}-${i}`,
        subjectId,
        text: q.text.trim(),
        options: q.options.map(o => String(o).trim()),
        correct: q.correct,
        explanations: q.explanations.map(e => String(e).trim()),
        aiGenerated: true
      });
    });
    return valid;
  },

  // Gera em lotes até atingir a quantidade alvo (usado para completar o simulado oficial)
  async fillSubjectTo(subjectId, targetCount, onProgress) {
    let attempts = 0;
    while (Quiz.poolFor(subjectId).length < targetCount && attempts < 6) {
      const missing = targetCount - Quiz.poolFor(subjectId).length;
      const batch = Math.min(8, missing);
      const result = await this.generateQuestions(subjectId, batch);
      attempts++;
      if (onProgress) onProgress(Quiz.poolFor(subjectId).length, targetCount);
      if (!result.ok) break; // evita loop infinito em caso de erro persistente
    }
    return Quiz.poolFor(subjectId).length;
  }
};

const UI = {
  currentView: 'home',
  practiceSubject: null,

  init() {
    Store.load();
    document.documentElement.setAttribute('data-theme', Store.state.theme);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    }
    if (Quiz.resumeIfAny()) {
      this.render(Quiz.session.type === 'simulado' ? 'simuladoRunning' : 'practice');
    } else {
      this.render('home');
    }
    document.getElementById('theme-toggle').addEventListener('click', () => this.toggleTheme());
    setTimeout(() => {
      const splash = document.getElementById('splash');
      if (splash) { splash.style.opacity = '0'; setTimeout(() => splash.remove(), 300); }
    }, 400);
  },

  toggleTheme() {
    Store.state.theme = Store.state.theme === 'dark' ? 'light' : 'dark';
    Store.save();
    document.documentElement.setAttribute('data-theme', Store.state.theme);
  },

  toast(msg, type = '') {
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  },

  render(view) {
    this.currentView = view;
    document.getElementById('main-view').innerHTML = Views[view] ? Views[view]() : Views.home();
    if (Views.bind[view]) Views.bind[view]();
    window.scrollTo(0, 0);
  }
};

Views.bind.pickSubject = function () {

          combined = combined.concat(Quiz.buildPracticeQueue(s.id, n));
        });
        Quiz.session = { type: 'practice', subjectId: 'todas', questions: Quiz.shuffle(combined), index: 0, answers: [] };

      } else {
        Quiz.startPractice(subjectId, 12);
      }
      UI.render('practice');
    });

// ---------------- PRATICAR (quiz) ----------------
Views.practice = function () {
  const s = Quiz.session;
  if (!s) return '<div class="empty">Nenhuma sessão ativa.</div>';

  if (s.index >= s.questions.length) {
    Quiz.clearPersisted(); // sessão realmente concluída, não há mais o que retomar
    return `
      <div class="card center">
        <div class="big-emoji">✅</div>
        <h2>Sessão concluída</h2>
        <p>Você praticou ${s.questions.length} questão(ões) nesta sessão.</p>
        <button class="btn btn-primary btn-block" id="practice-more">Praticar mais desta matéria</button>
        <button class="btn btn-outline btn-block" id="practice-home">Voltar ao início</button>
      </div>
    `;
  }

  const q = s.questions[s.index];
  const answered = s.answers.length > s.index;
  const last = answered ? s.answers[s.index] : null;
  const letters = ['A', 'B', 'C', 'D'];

  return `
    <button class="btn btn-ghost btn-sm" id="practice-back">← Voltar</button>
    <div class="q-header">
      <span class="badge">${s.index + 1}/${s.questions.length}</span>
      ${q.aiGenerated ? '<span class="badge badge-ai">🤖 IA</span>' : ''}
    </div>
    <div class="card">
      <p class="q-text">${q.text}</p>
      ${q.options.map((opt, i) => {
        let cls = 'q-option';
        if (answered) {
          if (i === q.correct) cls += ' correct';
          else if (i === last.selected) cls += ' wrong';
        }
        return `<div class="${cls}" data-i="${i}"><span class="letter">${letters[i]}</span>${opt}</div>`;
      }).join('')}
      ${answered ? `
        <div class="explanation">
          <strong>${last.correct ? '✅ Correto!' : '❌ Incorreto.'}</strong>
          <p>${q.explanations[last.selected]}</p>
          ${!last.correct ? `<p><strong>Resposta certa:</strong> ${q.explanations[q.correct]}</p>` : ''}
        </div>
        <button class="btn btn-primary btn-block" id="q-next">${s.index + 1 < s.questions.length ? 'Próxima' : 'Finalizar'}</button>
      ` : ''}
    </div>
    ${!answered && s.subjectId !== 'todas' ? `<button class="btn btn-ghost btn-sm" id="q-ai-more">🤖 Gerar mais questões desta matéria com IA</button>` : ''}
  `;
};

Views.bind.practice = function () {
  document.getElementById('practice-back')?.addEventListener('click', () => UI.render('pickSubject'));
  document.querySelectorAll('.q-option').forEach(el => {
    el.addEventListener('click', () => {
      if (Quiz.session.answers.length > Quiz.session.index) return; // já respondida
      Quiz.answerCurrent(parseInt(el.dataset.i, 10));
      UI.render('practice');
    });
  });
  document.getElementById('q-next')?.addEventListener('click', () => {
    Quiz.nextQuestion();
    UI.render('practice');
  });
  document.getElementById('practice-more')?.addEventListener('click', () => {
    Quiz.startPractice(Quiz.session.subjectId, 12);
    UI.render('practice');
  });
  document.getElementById('practice-home')?.addEventListener('click', () => UI.render('home'));
  document.getElementById('q-ai-more')?.addEventListener('click', async (e) => {
    if (!GroqAI.hasKey()) { UI.toast('Cadastre sua chave da Groq em Configurações.', 'warn'); UI.render('settings'); return; }
    const btn = e.target;
    btn.textContent = '🤖 Gerando...';
    btn.disabled = true;
    const result = await GroqAI.generateQuestions(Quiz.session.subjectId, 6);

      UI.toast(`${result.added} questão(ões) nova(s) geradas!`, 'success');

    }
    UI.render('practice');
  });
};

Views.simuladoRunning = function () {
  const s = Quiz.session;
  if (!s || s.type !== 'simulado') return '<div class="empty">Nenhum simulado ativo.</div>';

  if (s.index >= s.questions.length) {
    UI._lastResult = Quiz.finishSimulado();
    return Views.simuladoResult();
  }

  const q = s.questions[s.index];
  const answered = s.answers.length > s.index;
  const last = answered ? s.answers[s.index] : null;
  const letters = ['A', 'B', 'C', 'D'];

  return `
    <button class="btn btn-ghost btn-sm" id="sim-back">← Sair do simulado</button>
    <div class="q-header">
      <span class="badge">${s.index + 1}/${s.questions.length}</span>
      <span class="badge timer" id="sim-timer">⏱ --:--:--</span>
    </div>
    <div class="card">
      <p class="q-text">${q.text}</p>
      ${q.options.map((opt, i) => {
        let cls = 'q-option';
        if (answered) {
          if (i === q.correct) cls += ' correct';
          else if (i === last.selected) cls += ' wrong';
        }
        return `<div class="${cls}" data-i="${i}"><span class="letter">${letters[i]}</span>${opt}</div>`;
      }).join('')}
      ${answered ? `
        <div class="explanation"><p>${q.explanations[last.selected]}</p></div>
        <button class="btn btn-primary btn-block" id="sim-next">${s.index + 1 < s.questions.length ? 'Próxima' : 'Finalizar'}</button>
      ` : ''}
    </div>
  `;
};

Views.bind.simuladoRunning = function () {
  document.getElementById('sim-back')?.addEventListener('click', () => {
    if (confirm('Sair do simulado? Seu progresso fica salvo e você pode continuar depois, na tela de Simulado.')) {
      clearInterval(UI._timerInterval);
      UI.render('home');
    }
  });
  const s = Quiz.session;
  if (s && s.type === 'simulado') {
    clearInterval(UI._timerInterval);
    UI._timerInterval = setInterval(() => {
      const el = document.getElementById('sim-timer');
      if (!el) { clearInterval(UI._timerInterval); return; }
      const elapsed = Math.round((Date.now() - s.startedAt) / 1000);
      const remaining = Math.max(0, s.timeLimitSeconds - elapsed);
      const h = String(Math.floor(remaining / 3600)).padStart(2, '0');
      const m = String(Math.floor((remaining % 3600) / 60)).padStart(2, '0');
      const sec = String(remaining % 60).padStart(2, '0');
      el.textContent = `⏱ ${h}:${m}:${sec}`;
      if (remaining <= 0) {
        clearInterval(UI._timerInterval);
        s.index = s.questions.length;
        UI.render('simuladoRunning');
      }
    }, 1000);
  }
  document.querySelectorAll('.q-option').forEach(el => {
    el.addEventListener('click', () => {
      if (Quiz.session.answers.length > Quiz.session.index) return;
      Quiz.answerCurrent(parseInt(el.dataset.i, 10));
      UI.render('simuladoRunning');
    });
  });
  document.getElementById('sim-next')?.addEventListener('click', () => {
    Quiz.nextQuestion();
    UI.render('simuladoRunning');
  });
};

  document.getElementById('export-backup')?.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ state: Store.state, aiQuestions: QUESTIONS.filter(q => q.aiGenerated) }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'motorista-ipameri-backup.json'; a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('reset-progress')?.addEventListener('click', () => {
    if (confirm('Zerar todo o progresso? Essa ação não pode ser desfeita.')) {
      Store.reset();
      UI.toast('Progresso zerado.', 'warn');
      UI.render('home');
    }
  });
};


UI.init();
</script>
</body>
</html>
