// ---------------- SESSÃO DE REVISÃO DE ERROS ----------------
Views.reviewSession = function () {
  const s = Quiz.reviewSession;
  if (!s) return '<div class="empty">Nenhuma revisão ativa.</div>';

  if (s.questions.length === 0) {
    return `
      <button class="btn btn-ghost btn-sm" id="rv-back">${iconEl('arrowLeft')} Voltar</button>
      <div class="card center"><p class="muted">Nenhum erro pendente para revisar aqui.</p></div>
    `;
  }

  if (s.index >= s.questions.length) {
    const correctedCount = s.answers.filter(a => a.correct).length;
    return `
      <div class="card center">
        <div class="big-icon">${iconEl('trophy')}</div>
        <h2>Revisão concluída</h2>
        <p class="muted">Você acertou ${correctedCount} de ${s.answers.length} questão(ões) revisada(s).</p>
        <button class="btn btn-primary btn-block" id="rv-done">Voltar ao início</button>
      </div>
    `;
  }

  const q = s.questions[s.index];
  const answered = s.answers.length > s.index;
  const last = answered ? s.answers[s.index] : null;
  const letters = Array.from({ length: EXAM_CONFIG.alternativesPerQuestion }, (_, i) => String.fromCharCode(65 + i));

  return `
    <div class="q-header">
      <button class="btn btn-ghost btn-sm" id="rv-back">${iconEl('arrowLeft')} Voltar</button>
      <span class="badge">${s.index + 1}/${s.questions.length}</span>
    </div>
    <div class="card">
      <p class="q-text">${q.text}</p>
      ${q.options.map((opt, i) => {
        let cls = 'q-option';
        if (answered) {
          if (i === q.correct) cls += ' correct';
          else if (i === last.selected) cls += ' wrong';
        }
        return `<div class="${cls}" data-i="${i}"><span class="letter">${letters[i]}</span>${opt}</div>`;
      }).join('')}
      ${answered ? `
        <div class="explanation">
          <strong>${last.correct ? iconEl('checkCircle') + ' Acertou dessa vez!' : iconEl('xCircle') + ' Ainda não foi.'}</strong>
          <p>${q.explanations[last.selected]}</p>
          ${!last.correct ? `<p><strong>Resposta certa:</strong> ${q.explanations[q.correct]}</p>` : ''}
        </div>
        <button class="btn btn-primary btn-block" id="rv-next">${s.index + 1 < s.questions.length ? 'Próxima' : 'Finalizar'}</button>
      ` : ''}
    </div>
  `;
};

// ---------------- PRATICAR (fluxo contínuo e infinito) ----------------
Views.practice = function () {
  const subjectId = UI.practiceSubject;
  if (!subjectId) return '<div class="empty">Nenhuma matéria selecionada.</div>';

  const hasCurrent = Quiz.ensureCurrent(subjectId);
  if (!hasCurrent) {
    const subject = SUBJECTS.find(x => x.id === subjectId);
    return `
      <button class="btn btn-ghost btn-sm" id="practice-back">${iconEl('arrowLeft')} Voltar</button>
      <div class="card center">
        <div class="big-icon">${iconEl('trophy')}</div>
        <h2>Você viu todas as questões ${subject ? 'de ' + subject.name : 'disponíveis'}!</h2>
        <p class="muted">Gere novas com IA pra continuar praticando sem repetir nada.</p>
        <button class="btn btn-primary btn-block" id="q-generate-more">${iconEl('bot')} Gerar novas questões com IA</button>
      </div>
    `;
  }

  const feed = Quiz.getFeed(subjectId);
  const q = Quiz.currentQuestion(subjectId);
  const answered = Quiz.isAnsweredAnywhere(q.id);
  const selected = answered ? Store.state.answerLog[q.id] : null;
  const correct = answered ? selected === q.correct : null;
  const letters = Array.from({ length: EXAM_CONFIG.alternativesPerQuestion }, (_, i) => String.fromCharCode(65 + i));
  const canGoPrev = feed.position > 0;
  const isFrontier = feed.position === feed.order.length - 1;
  const needsMoreToAdvance = isFrontier && !Quiz.hasMoreFresh(subjectId);

  return `
    <button class="btn btn-ghost btn-sm" id="practice-back">${iconEl('arrowLeft')} Voltar</button>
    <div class="q-header">
      <span class="badge">Questão ${feed.position + 1}</span>
      ${q.aiGenerated ? `<span class="badge badge-ai">${iconEl('bot')} IA</span>` : ''}
    </div>
    <div class="card">
      <p class="q-text">${q.text}</p>
      ${q.options.map((opt, i) => {
        let cls = 'q-option';
        if (answered) {
          if (i === q.correct) cls += ' correct';
          else if (i === selected) cls += ' wrong';
        }
        return `<div class="${cls}" data-i="${i}"><span class="letter">${letters[i]}</span>${opt}</div>`;
      }).join('')}
      ${answered ? `
        <div class="explanation">
          <strong>${correct ? iconEl('checkCircle') + ' Correto!' : iconEl('xCircle') + ' Incorreto.'}</strong>
          <p>${q.explanations[selected]}</p>
          ${!correct ? `<p><strong>Resposta certa:</strong> ${q.explanations[q.correct]}</p>` : ''}
        </div>
        ${needsMoreToAdvance ? `
          <p class="muted center">Você viu todas as questões disponíveis até aqui.</p>
          <div class="grid-2">
            <button class="btn btn-outline btn-block" id="q-prev" ${canGoPrev ? '' : 'disabled'}>${iconEl('arrowLeft')} Anterior</button>
            <button class="btn btn-primary btn-block" id="q-generate-inline">${iconEl('bot')} Gerar mais</button>
          </div>
        ` : `
          <div class="grid-2">
            <button class="btn btn-outline btn-block" id="q-prev" ${canGoPrev ? '' : 'disabled'}>${iconEl('arrowLeft')} Anterior</button>
            <button class="btn btn-primary btn-block" id="q-next">Próxima ${iconEl('chevronRight')}</button>
          </div>
        `}
      ` : `
        ${canGoPrev ? `<button class="btn btn-ghost btn-sm" id="q-prev">${iconEl('arrowLeft')} Ver anterior</button>` : ''}
      `}
    </div>
  `;
};

Views.bind.practice = function () {
  const subjectId = UI.practiceSubject;
  document.getElementById('practice-back')?.addEventListener('click', () => UI.back());

  document.querySelectorAll('.q-option').forEach(el => {
    el.addEventListener('click', () => {
      const q = Quiz.currentQuestion(subjectId);
      if (Quiz.isAnsweredAnywhere(q.id)) return; // já respondida, não deixa responder de novo
      Quiz.answerFeedQuestion(subjectId, parseInt(el.dataset.i, 10));
      UI.render('practice');
    });
  });

  document.getElementById('q-prev')?.addEventListener('click', () => {
    Quiz.goPrev(subjectId);
    UI.render('practice');
  });

  document.getElementById('q-next')?.addEventListener('click', () => {
    const result = Quiz.goNext(subjectId);
    if (result === 'need-more') {
      UI.toast('Você chegou ao fim das questões disponíveis desta matéria.', 'warn');
    }
    UI.render('practice');
  });

  document.getElementById('q-generate-inline')?.addEventListener('click', async (e) => {
    if (!GroqAI.hasKey()) { UI.toast('Cadastre sua chave da Groq em Configurações.', 'warn'); UI.render('settings'); return; }
    const btn = e.target;
    btn.innerHTML = iconEl('bot') + ' Gerando...';
    btn.disabled = true;
    const targetSubject = subjectId === 'todas' ? Quiz.mostNeededSubjectForGeneration().id : subjectId;
    const result = await GroqAI.generateQuestions(targetSubject, 6);
    if (result.ok) {
      UI.toast(`${result.added} questão(ões) nova(s) geradas!`, 'success');
      Quiz.goNext(subjectId); // avança direto pra primeira questão nova, sem precisar de outro clique
    } else {
      UI.toast(result.reason==='no-key' ? 'Configure sua chave GROQ em Configurações.' : 'A IA está ocupada no momento. Aguarde alguns segundos e tente novamente.', 'warn');
    }
    UI.render('practice');
  });

  document.getElementById('q-generate-more')?.addEventListener('click', async (e) => {
    if (!GroqAI.hasKey()) { UI.toast('Cadastre sua chave da Groq em Configurações.', 'warn'); UI.render('settings'); return; }
    const btn = e.target;
    btn.innerHTML = iconEl('bot') + ' Gerando...';
    btn.disabled = true;
    const targetSubject = subjectId === 'todas' ? Quiz.mostNeededSubjectForGeneration().id : subjectId;
    const result = await GroqAI.generateQuestions(targetSubject, 6);
    if (result.ok) {
      UI.toast(`${result.added} questão(ões) nova(s) geradas!`, 'success');
    } else {
      UI.toast(result.reason==='no-key' ? 'Configure sua chave GROQ em Configurações.' : 'A IA está ocupada no momento. Aguarde alguns segundos e tente novamente.', 'warn');
    }
    UI.render('practice'); // ensureCurrent vai pegar automaticamente uma das novas
  });
};

Views.flashcardsSession = function () {

  if (!s) return '<div class="empty">Nenhuma sessão de flashcards ativa.</div>';

  if (s.cards.length === 0) {
    return `
      <button class="btn btn-ghost btn-sm" id="fc-session-back">${iconEl('arrowLeft')} Voltar</button>
      <div class="card center">
        <p class="muted">${s.mode === 'browse' ? 'Você ainda não salvou nenhum flashcard desta matéria.' : 'Nenhum flashcard disponível.'}</p>
      </div>
    `;
  }

  if (s.index >= s.cards.length) {
    const savedCount = s.mode === 'review' ? s.savedCount || 0 : s.cards.length;
    return `
      <div class="card center">
        <div class="big-icon">${iconEl('checkCircle')}</div>
        <h2>${s.mode === 'review' ? 'Revisão concluída' : 'Fim da lista'}</h2>
        ${s.mode === 'review' ? `<p class="muted">Você salvou ${savedCount} de ${s.cards.length} flashcard(s) gerados.</p>` : ''}
        <button class="btn btn-primary btn-block" id="fc-session-done">Voltar</button>
      </div>
    `;
  }

  const card = s.cards[s.index];
  const isSaved = s.mode === 'browse' || (Store.getSavedFlashcards(s.subjectId).some(c => c.front === card.front));

  return `
    <div class="q-header">
      <button class="btn btn-ghost btn-sm" id="fc-session-back">${iconEl('arrowLeft')} Voltar</button>
      <span class="badge">${s.index + 1}/${s.cards.length}</span>
    </div>
    <div class="flashcard-wrap">
      <div class="flashcard ${s.flipped ? 'flipped' : ''}" id="flashcard-el">
        <div class="flashcard-face flashcard-front">${card.front}</div>
        <div class="flashcard-face flashcard-back">${card.back}</div>
      </div>
    </div>
    <p class="muted center">Toque no card para virar</p>
    ${s.mode === 'review' ? `
      <div class="grid-2">
        <button class="btn btn-outline btn-block" id="fc-skip">Pular</button>
        <button class="btn btn-primary btn-block" id="fc-save">${iconEl('star')} Salvar</button>
      </div>

        <button class="btn btn-outline btn-block" id="fc-remove">${iconEl('trash')} Remover</button>
        <button class="btn btn-primary btn-block" id="fc-next-browse">Próximo</button>
      </div>

  `;
};

Views.bind.flashcardsSession = function () {
  const s = UI.flashcardSession;
  document.getElementById('fc-session-back')?.addEventListener('click', () => UI.back());
  document.getElementById('fc-session-done')?.addEventListener('click', () => UI.render('flashcardsSubject'));

  document.getElementById('flashcard-el')?.addEventListener('click', () => {
    s.flipped = !s.flipped;
    UI.render('flashcardsSession');
  });

  document.getElementById('fc-skip')?.addEventListener('click', () => {
    s.index++; s.flipped = false;
    UI.render('flashcardsSession');
  });

  document.getElementById('fc-save')?.addEventListener('click', () => {
    const card = s.cards[s.index];
    Store.saveFlashcard(s.subjectId, card);
    s.savedCount = (s.savedCount || 0) + 1;
    s.index++; s.flipped = false;
    UI.toast('Flashcard salvo!', 'success');
    UI.render('flashcardsSession');
  });

  document.getElementById('fc-remove')?.addEventListener('click', () => {
    const card = s.cards[s.index];
    Store.removeFlashcard(s.subjectId, card.id);
    s.cards.splice(s.index, 1);
    s.flipped = false;
    UI.render('flashcardsSession');
  });

  document.getElementById('fc-next-browse')?.addEventListener('click', () => {
    s.index++; s.flipped = false;
    UI.render('flashcardsSession');
  });
};

        <button class="btn btn-danger btn-block" id="abandon-simulado">Abandonar e começar um novo</button>

  }

          <div class="subj-name">${r.subject.icon} ${r.subject.name}</div>

      `).join('')}

    ${allReady ? `
      <button class="btn btn-primary btn-block" id="start-simulado">Iniciar Simulado (4h)</button>

  document.getElementById('fill-missing')?.addEventListener('click', async (e) => {

// ---------------- SIMULADO: EXECUÇÃO ----------------
Views.simuladoRunning = function () {
  const s = Quiz.session;
  if (!s || s.type !== 'simulado') return '<div class="empty">Nenhum simulado ativo.</div>';

  if (s.index >= s.questions.length) {
    UI._lastResult = Quiz.finishSimulado();
    return Views.simuladoResult();
  }

  const q = s.questions[s.index];
  const answered = s.answers.length > s.index;
  const last = answered ? s.answers[s.index] : null;
  const letters = Array.from({ length: EXAM_CONFIG.alternativesPerQuestion }, (_, i) => String.fromCharCode(65 + i));

  return `
    <button class="btn btn-ghost btn-sm" id="sim-back">${iconEl('arrowLeft')} Sair do simulado</button>
    <div class="q-header">
      <span class="badge">${s.index + 1}/${s.questions.length}</span>
      <span class="badge timer" id="sim-timer">${iconEl('clock')} --:--:--</span>
    </div>
    <div class="card">
      <p class="q-text">${q.text}</p>
      ${q.options.map((opt, i) => {
        let cls = 'q-option';
        if (answered) {
          if (i === q.correct) cls += ' correct';
          else if (i === last.selected) cls += ' wrong';
        }
        return `<div class="${cls}" data-i="${i}"><span class="letter">${letters[i]}</span>${opt}</div>`;
      }).join('')}
      ${answered ? `
        <div class="explanation"><p>${q.explanations[last.selected]}</p></div>
        <button class="btn btn-primary btn-block" id="sim-next">${s.index + 1 < s.questions.length ? 'Próxima' : 'Finalizar'}</button>
      ` : ''}
    </div>
  `;
};

Views.bind.simuladoRunning = function () {
  document.getElementById('sim-back')?.addEventListener('click', () => {
    if (confirm('Sair do simulado? Seu progresso fica salvo e você pode continuar depois, na tela de Simulado.')) {
      clearInterval(UI._timerInterval);
      UI.render('home');
    }
  });
  const s = Quiz.session;
  if (s && s.type === 'simulado') {
    clearInterval(UI._timerInterval);
    UI._timerInterval = setInterval(() => {
      const el = document.getElementById('sim-timer');
      if (!el) { clearInterval(UI._timerInterval); return; }
      const elapsed = Math.round((Date.now() - s.startedAt) / 1000);
      const remaining = Math.max(0, s.timeLimitSeconds - elapsed);
      const h = String(Math.floor(remaining / 3600)).padStart(2, '0');
      const m = String(Math.floor((remaining % 3600) / 60)).padStart(2, '0');
      const sec = String(remaining % 60).padStart(2, '0');
      el.innerHTML = iconEl('clock') + ` ${h}:${m}:${sec}`;
      if (remaining <= 0) {
        clearInterval(UI._timerInterval);
        s.index = s.questions.length;
        UI.render('simuladoRunning');
      }
    }, 1000);
  }
  document.querySelectorAll('.q-option').forEach(el => {
    el.addEventListener('click', () => {
      if (Quiz.session.answers.length > Quiz.session.index) return;
      Quiz.answerCurrent(parseInt(el.dataset.i, 10));
      UI.render('simuladoRunning');
    });
  });
  document.getElementById('sim-next')?.addEventListener('click', () => {
    Quiz.nextQuestion();
    UI.render('simuladoRunning');
  });
};

Views.simuladoResult = function () {
  const r = UI._lastResult;
  if (!r) return '<div class="empty">Nenhum resultado disponível.</div>';
  const pct = Math.round((r.score / r.total) * 100);
  const passed = r.score >= 60;

  return `
    <div class="card center">
      <div class="big-icon">${passed ? iconEl('trophy') : iconEl('book')}</div>
      <h2>${r.score} / ${r.total} pontos</h2>
      <p class="${passed ? 'text-green' : 'text-orange'}"><strong>${passed ? 'Aprovado(a)! Acima dos 60 pontos mínimos.' : 'Abaixo dos 60 pontos mínimos — bora reforçar.'}</strong></p>
      <p class="muted">Tempo utilizado: ${Math.floor(r.timeSpentSec / 60)} min</p>
    </div>
    <div class="section-title">Desempenho por matéria</div>
    ${SUBJECTS.map(s => {
      const b = r.bySubject[s.id];
      const pct2 = b.total > 0 ? Math.round((b.correct / b.total) * 100) : 0;
      return `
        <div class="card">
          <div class="subj-row"><div class="subj-name">${s.icon} ${s.name}</div><div class="subj-pct">${b.correct}/${b.total}</div></div>
          <div class="progress-bar"><div class="fill" style="width:${pct2}%"></div></div>
        </div>
      `;
    }).join('')}
    <button class="btn btn-primary btn-block" id="result-home">Voltar ao início</button>
  `;
};

Views.bind.simuladoResult = function () {

};

Views.bind.radar = function(){
  document.getElementById('radar-back')?.addEventListener('click',()=>UI.back());
  document.getElementById('radar-refresh')?.addEventListener('click',async e=>{
    if(!GroqAI.hasKey()){UI.toast('Configure sua chave GROQ para ativar o Radar.','warn');UI.render('settings');return;}
    if(!navigator.onLine){UI.toast('Sem internet. O Radar está mostrando o último conteúdo salvo.','warn');return;}
    e.currentTarget.disabled=true;e.currentTarget.textContent='🔎 Pesquisando novidades...';
    const r=await DoctorAICore.refreshRadar(true);
    if(r.reason==='cooldown'){const t=r.nextAllowedAt?new Date(r.nextAllowedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'em breve';UI.toast(`Radar protegido contra buscas repetidas. Próxima pesquisa após ${t}.`,'warn');}
    else if(r.ok){UI.toast(`${r.items.filter(x=>!x.isPromotion).length} notícia(s) verificadas.`,'success');}
    else if(r.reason==='offline'){UI.toast('Sem internet. O Radar continua mostrando o último conteúdo salvo.','warn');}
    else if(r.reason==='no-key'){UI.toast('Configure sua chave GROQ para atualizar o Radar.','warn');}
    else if(r.reason==='rate-limit'){const t=r.nextAllowedAt?new Date(r.nextAllowedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'em alguns instantes';UI.toast(`A GROQ está temporariamente limitada. O Radar não fará novas tentativas até ${t}.`,'warn');}
    else{UI.toast(`Radar: ${r.status?`erro HTTP ${r.status}`:(r.reason||'falha na pesquisa web')}. O conteúdo salvo continua disponível.`,'warn');}
    UI.render('radar');
  });
  document.querySelectorAll('.radar-news-v17').forEach(el=>{const open=()=>{UI._radarArticleId=el.dataset.radarId;UI.render('radarArticle');};el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});});
};

Views.bind.recorder=function(){
  document.getElementById('rec-sub-back')?.addEventListener('click',()=>UI.back());
  let mode='normal',recording=false,timerId=null,stopLock=false;
  const btn=document.getElementById('rec-toggle'),state=document.getElementById('rec-state'),timer=document.getElementById('rec-timer'),badge=document.getElementById('rec-live-badge'),banner=document.getElementById('rec-essay-banner'),help=document.getElementById('rec-mode-help');
  const normalBtn=document.getElementById('rec-mode-normal'),essayBtn=document.getElementById('rec-mode-essay');
  const sub=SUBJECTS.find(s=>s.id===UI._recordSubject)||SUBJECTS[0];
  const resetButton=()=>{ recording=false; stopLock=false; clearInterval(timerId); timerId=null; badge.textContent='PRONTO'; badge.classList.remove('live'); btn?.classList.remove('recording'); btn?.setAttribute('aria-pressed','false'); if(btn){btn.disabled=false;btn.innerHTML='<span>●</span><strong>Iniciar gravação</strong>';} };
  const setMode=m=>{
    if(recording||stopLock)return;
    mode=m;
    normalBtn?.classList.toggle('active',m==='normal'); essayBtn?.classList.toggle('active',m==='essay');
    normalBtn?.setAttribute('aria-pressed',String(m==='normal')); essayBtn?.setAttribute('aria-pressed',String(m==='essay'));
    banner.hidden=m!=='essay';
    if(help)help.textContent=m==='essay'?'Rascunho de redação: toque uma vez para iniciar e toque novamente para parar e salvar. Depois, você poderá transcrever e enviar para a Redação Doctor.':'Gravação normal: toque uma vez para iniciar e toque novamente para parar e salvar.';
    if(state)state.textContent=m==='essay'?'Rascunho de redação selecionado. Pronto para gravar.':'Gravação de estudo selecionada. Pronto para gravar.';
  };
  setMode('normal');
  normalBtn?.addEventListener('click',()=>setMode('normal'));
  essayBtn?.addEventListener('click',()=>setMode('essay'));
  const tick=()=>{const sec=Math.floor((Date.now()-(CoreRecorder.startedAt||Date.now()))/1000);timer.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;};
  const saveFinishedRecording=async()=>{
    const started=CoreRecorder.startedAt||Date.now();
    const durationMs=Math.max(0,Date.now()-started);
    state.textContent='Finalizando e salvando o áudio…';
    const blob=await CoreRecorder.stop();
    if(!blob||!blob.size)throw new Error('O navegador encerrou a gravação sem entregar os dados de áudio. Tente novamente mantendo o aplicativo aberto até aparecer “Gravação salva”.');
    const now=new Date().toISOString();
    const id='rec-'+Date.now(),audioId='audio-'+id;
    const name=mode==='essay'?`Rascunho de redação — ${new Date(now).toLocaleDateString('pt-BR')}`:`${sub.name} — revisão ${new Date(now).toLocaleDateString('pt-BR')}`;
    await AudioDB.put(audioId,blob);
    const r={id,subjectId:UI._recordSubject,name,audioId,createdAt:now,mimeType:blob.type||CoreRecorder.mimeType,durationMs,size:blob.size,isEssayDraft:mode==='essay',transcript:'',transcribedAt:null};
    Store.state.recordings.unshift(r);
    if(mode==='essay'){
      Store.state.essayDraft={title:Store.state.essayDraft?.title||r.name,body:Store.state.essayDraft?.body||'',audioId:r.audioId,updatedAt:now};
    }
    CoreSync.markLocalChange('recording',r.id); Store.save();
    return r;
  };
  const finishRecording=async()=>{
    if(!recording||stopLock)return;
    stopLock=true; clearInterval(timerId); timerId=null;
    try{
      const r=await saveFinishedRecording();
      const wasEssay=mode==='essay';
      resetButton();
      state.textContent=wasEssay?'Rascunho salvo e vinculado à Redação Doctor.':'Gravação salva com segurança.';
      UI.toast(wasEssay?'✍️ Rascunho salvo e vinculado à Redação Doctor.':'🎙️ Gravação salva com segurança.','success');
      if(wasEssay && UI._recordReturnView==='essay'){ UI._recordReturnView=null; UI.render('essay'); } else { UI.render('recorder'); }
      return r;
    }catch(err){
      try{await CoreRecorder.stop();}catch(e){}
      resetButton();
      state.textContent='Não foi possível salvar esta gravação. O microfone está pronto para tentar novamente.';
      UI.toast(err?.message||'Não foi possível salvar a gravação.','warn');
      return null;
    }
  };
  const startRecording=async()=>{
    if(recording||stopLock)return;
    stopLock=true;
    try{
      await CoreRecorder.start();
      recording=true; stopLock=false;
      badge.textContent='GRAVANDO'; badge.classList.add('live'); btn.classList.add('recording'); btn.setAttribute('aria-pressed','true'); btn.innerHTML='<span>■</span><strong>Parar e salvar</strong>';
      state.textContent=mode==='essay'?'Gravando rascunho de redação… fale naturalmente.':'Gravando… fale normalmente.';
      timer.textContent='00:00'; tick(); timerId=setInterval(tick,250);
    }catch(err){
      resetButton(); UI.toast(err?.message||'Não foi possível acessar o microfone.','warn');
    }
  };
  btn?.addEventListener('click',async e=>{
    e.preventDefault();
    if(stopLock)return;
    if(recording){await finishRecording();}else{await startRecording();}
  });
  window.addEventListener('blur',()=>{if(recording)finishRecording();},{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&recording)finishRecording();},{passive:true});
  document.querySelectorAll('[data-delete-rec]').forEach(el=>el.addEventListener('click',async()=>{if(!confirm('Excluir esta gravação?'))return;const r=Store.state.recordings.find(x=>x.id===el.dataset.deleteRec);if(r?.audioId)await AudioDB.remove(r.audioId);Store.state.recordings=Store.state.recordings.filter(x=>x.id!==el.dataset.deleteRec);Store.save();UI.render('recorder');}));
  document.querySelectorAll('audio[data-audio-id]').forEach(async a=>{try{const blob=await AudioDB.get(a.dataset.audioId);if(blob){const url=URL.createObjectURL(blob);a.src=url;a.addEventListener('emptied',()=>URL.revokeObjectURL(url),{once:true});}else{a.outerHTML='<div class="audio-missing">Áudio não encontrado neste dispositivo.</div>';}}catch(e){a.outerHTML='<div class="audio-missing">Não foi possível carregar este áudio.</div>';}});
  document.querySelectorAll('[data-send-redaction],[data-send-transcript]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.sendRedaction||el.dataset.sendTranscript;const r=Store.state.recordings.find(x=>x.id===id);if(!r)return;CoreEssay.attachAudio(r.audioId);Store.state.essayDraft.title=r.transcript?`Rascunho falado — ${new Date(r.createdAt).toLocaleDateString('pt-BR')}`:(r.name||'Rascunho de redação');if(r.transcript)Store.state.essayDraft.body=r.transcript;Store.state.essayDraft.updatedAt=new Date().toISOString();Store.save();UI._recordReturnView=null;UI.render('essay');}));
};

<script>
/* ===== V1.8.3 — RADAR/RODAPÉ CONSISTENTE EM TODAS AS TELAS ===== */
(function(){
  const mount = document.getElementById('radar-ticker-mount');
  const footer = document.querySelector('.app-footer');
  const mainView = document.getElementById('main-view');
  if(!mount || !footer || !mainView) return;

  let docked = false;
  let ticking = false;
  const GAP = 12;

  function radarHeight(){
    return Math.max(40, Math.ceil(mount.getBoundingClientRect().height || 40));
  }

  // Reserva espaço real para o Radar em TODA página. Isso impede que
  // conteúdo de Caderno, Gravador, Redação, Configurações etc. fique
  // escondido atrás do letreiro.
  function reserveRadarSpace(){
    const h = radarHeight();
    document.documentElement.style.setProperty('--radar-reserve', `${h + GAP}px`);
    mainView.style.paddingBottom = `${h + GAP + 16}px`;
  }

  function updateRadarDock(){
    ticking = false;
    reserveRadarSpace();
    const h = radarHeight();
    const footerTopViewport = footer.getBoundingClientRect().top;
    const footerTopDocument = footerTopViewport + window.scrollY;
    const trigger = window.innerHeight + 8;

    if(!docked && footerTopViewport <= trigger){
      // No final do conteúdo o Radar deixa de flutuar e passa a fazer
      // parte do fluxo da página, imediatamente antes do rodapé.
      docked = true;
      mount.classList.add('radar-at-footer');
      mount.style.position = 'absolute';
      mount.style.left = '0';
      mount.style.right = '0';
      mount.style.bottom = 'auto';
      mount.style.top = `${Math.max(0, footerTopDocument - h)}px`;
    } else if(docked && footerTopViewport > window.innerHeight + h + 32){
      // Voltou a existir bastante conteúdo abaixo: Radar volta a ficar
      // fixo, sempre disponível, sem sobrepor o conteúdo.
      docked = false;
      mount.classList.remove('radar-at-footer');
      mount.style.position = 'fixed';
      mount.style.top = '';
      mount.style.bottom = '0px';
      mount.style.left = '0';
      mount.style.right = '0';
    } else if(docked){
      mount.style.top = `${Math.max(0, footerTopDocument - h)}px`;
    }
  }

  function schedule(){
    if(!ticking){
      ticking = true;
      requestAnimationFrame(updateRadarDock);
    }
  }

  window.addEventListener('scroll', schedule, {passive:true});
  window.addEventListener('resize', schedule);
  window.addEventListener('load', schedule);
  document.addEventListener('visibilitychange', schedule);

  if(window.ResizeObserver){
    const ro = new ResizeObserver(schedule);
    ro.observe(footer);
    ro.observe(mount);
    ro.observe(mainView);
  }

  // UI.render troca o conteúdo de #main-view dinamicamente.
  // Um pequeno observador garante que TODAS as páginas recebam a mesma
  // reserva de espaço sem precisar adicionar código em cada View.
  if(window.MutationObserver){
    new MutationObserver(schedule).observe(mainView, {childList:true, subtree:true});
  }

  reserveRadarSpace();
  schedule();
})();
</script>
