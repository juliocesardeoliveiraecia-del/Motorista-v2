<style>
:root {
  --blue-dark: #0A192F;
  --blue-mid: #16345E;
  --green: #2ECC71;
  --green-dark: #1E9E58;
  --orange: #F5A623;
  --red: #E74C3C;
  --gray-100: #F4F6F9;
  --gray-200: #E3E8EF;
  --gray-600: #5A6472;
  --radius: 14px;
  --font: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  --bg: var(--gray-100); --surface: #FFFFFF; --text: var(--blue-dark);
  --text-muted: var(--gray-600); --border: var(--gray-200);
}
[data-theme="dark"] { --bg: #071322; --surface: #0F2341; --text: #F4F6F9; --text-muted: #9AA5B1; --border: #1C3B63; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
body { padding-bottom: 24px; }
button { font-family: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0 0 8px; }
p { margin: 0 0 8px; }
a { color: var(--green-dark); }

#splash {
  position: fixed; inset: 0; z-index: 999; background: linear-gradient(160deg, var(--blue-dark), var(--blue-mid));
  display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; transition: opacity .3s;
}
#splash .logo { width: 140px; height: auto; margin-bottom: 14px; filter: drop-shadow(0 8px 20px rgba(0,0,0,.4)); }
#splash-text { font-weight: 700; font-size: 15px; letter-spacing: .02em; }

/* ---------- Ícones SVG inline ---------- */
.icon-wrap { display: inline-flex; align-items: center; justify-content: center; vertical-align: -3px; }
.icon { width: 17px; height: 17px; }
.big-icon .icon-wrap { display: flex; justify-content: center; }
.big-icon .icon { width: 46px; height: 46px; }
h2 .icon-wrap .icon, h3 .icon-wrap .icon { width: 16px; height: 16px; }

.topbar {
  position: sticky; top: 0; z-index: 50; background: var(--blue-dark); color: #fff;
  padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
}
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 28px; height: 28px; border-radius: 8px; display: block; flex-shrink: 0; }
.topbar-lines { display: flex; flex-direction: column; gap: 1px; }
.topbar-parent-brand { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.5); }
.topbar h1 { font-size: 15px; margin: 0; }

.app-footer {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 16px; margin-top: 8px; border-top: 1px solid var(--border);
}
.footer-logo { width: 34px; height: auto; border-radius: 6px; flex-shrink: 0; }
.footer-text { text-align: left; line-height: 1.35; }
.footer-company { font-size: 12px; font-weight: 800; color: var(--text); }
.footer-meta { font-size: 10px; color: var(--text-muted); }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18);
  color: #fff; width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:active { background: rgba(255,255,255,.22); }
.icon-btn .icon { width: 19px; height: 19px; stroke-width: 2.1; }
.icon-btn-accent {
  background: var(--green); border-color: var(--green); color: #05271A;
}
.icon-btn-accent:active { background: var(--green-dark); border-color: var(--green-dark); }

main { padding: 16px; max-width: 640px; margin: 0 auto; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.card.center { text-align: center; }
.card.hero { background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid)); color: #fff; border: none; position: relative; overflow: hidden; }
.hero-illustration { position: absolute; right: 0; bottom: 0; width: 128px; height: auto; opacity: 0.98; filter: drop-shadow(0 8px 16px rgba(0,0,0,.35)); }
.hero-label { font-size: 12px; color: #B9C8DE; position: relative; padding-right: 108px; }
.hero-days { font-size: 30px; font-weight: 900; position: relative; padding-right: 108px; }
.hero-sub { font-size: 12px; color: #B9C8DE; position: relative; padding-right: 108px; line-height: 1.4; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { text-align: center; }
.stat-value { font-size: 22px; font-weight: 800; }
.stat-label { font-size: 11px; color: var(--text-muted); }

.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 16px 0 6px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 13px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px; margin-bottom: 8px; text-align: center; }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 12px; width: auto; display: inline-flex; }
.btn-primary { background: var(--green); color: #05271A; }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn-ghost { background: transparent; color: var(--text-muted); border: none; font-weight: 600; }
.btn-danger { background: var(--red); color: #fff; }
.btn-orange { background: var(--orange); color: #3A2400; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; background: rgba(46,204,113,.15); color: var(--green-dark); margin-right: 6px; }
.badge-ai { background: rgba(15,35,65,.1); color: var(--blue-dark); }
.badge-live { background: rgba(245,166,35,.18); color: #9A6300; }
[data-theme="dark"] .badge-live { color: var(--orange); background: rgba(245,166,35,.15); }
[data-theme="dark"] .badge-ai { background: rgba(255,255,255,.1); color: #fff; }
.badge.timer { background: var(--blue-dark); color: #fff; }

.progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 20px; overflow: hidden; margin-top: 4px; }
.progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--green-dark)); }

.subj-row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 10px; }
.subj-row:first-child { margin-top: 0; }
.subj-name { font-weight: 600; display: flex; align-items: center; gap: 6px; }

.pick-card { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
.subject-icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(15,35,65,.06); display: flex; align-items: center; justify-content: center; color: var(--blue-dark); flex-shrink: 0; }
[data-theme="dark"] .subject-icon { background: rgba(255,255,255,.06); color: #fff; }
.subject-icon .icon { width: 19px; height: 19px; }
.pick-info { flex: 1; }
.pick-info .name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pick-info .meta { font-size: 11px; color: var(--text-muted); }
.chev { color: var(--text-muted); display: flex; }

.q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.q-text { font-size: 15px; font-weight: 600; margin-bottom: 14px; line-height: 1.45; }
.q-option { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); margin-bottom: 8px; font-size: 13.5px; }
.q-option .letter { width: 24px; height: 24px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
.q-option.correct { border-color: var(--green); background: rgba(46,204,113,.1); }
.q-option.correct .letter { background: var(--green); color: #05271A; }
.q-option.wrong { border-color: var(--red); background: rgba(231,76,60,.1); }
.q-option.wrong .letter { background: var(--red); color: #fff; }

.explanation { margin-top: 10px; padding: 12px; border-radius: 12px; background: rgba(15,35,65,.05); border-left: 4px solid var(--blue-mid); font-size: 13px; line-height: 1.5; }
.explanation strong { display: flex; align-items: center; gap: 6px; }
[data-theme="dark"] .explanation { background: rgba(255,255,255,.05); }

.warn-card { border-left: 4px solid var(--orange); }

/* ---------- Plano de Hoje ---------- */
.plan-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.plan-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.plan-item:last-child { border-bottom: none; }
.plan-check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--green); }
.plan-item.done .plan-check { border-color: var(--green); }
.plan-item.done .plan-item-label { text-decoration: line-through; opacity: .6; }
.plan-item-text { flex: 1; min-width: 0; }
.plan-item-label { font-size: 13.5px; font-weight: 700; }
.plan-item-sub { font-size: 11px; color: var(--text-muted); }

/* ---------- Evolução do Doctor ---------- */
.doctor-card { text-align: center; }
.doctor-avatar-box {
  width: 100%; max-width: 240px; aspect-ratio: 1 / 1; margin: 0 auto 14px;
  background: rgba(255,255,255,.03); border: 1.5px dashed var(--border); border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.doctor-avatar-box img { width: 100%; height: 100%; object-fit: contain; }
.doctor-placeholder { color: var(--text-muted); opacity: .5; }
.doctor-placeholder .icon { width: 40px; height: 40px; }
.doctor-level-name { font-weight: 800; font-size: 15px; margin-bottom: 8px; }
.doctor-xp-label { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

/* ---------- Flashcards (flip 3D) ---------- */
.flashcard-wrap { perspective: 1200px; height: 220px; margin-bottom: 14px; }
.flashcard { position: relative; width: 100%; height: 100%; cursor: pointer; transform-style: preserve-3d; transition: transform .5s; }
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: var(--radius); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 20px; font-size: 15px; font-weight: 600; line-height: 1.45;
}
.flashcard-front { background: var(--surface); color: var(--text); }
.flashcard-back { background: var(--blue-dark); color: #fff; transform: rotateY(180deg); font-weight: 500; }
.muted { font-size: 12.5px; color: var(--text-muted); }
.center { text-align: center; }
.text-green { color: var(--green-dark); }
.text-orange { color: var(--orange); }
.empty { text-align: center; padding: 30px; color: var(--text-muted); }

input[type=password], input[type=text] { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; margin-bottom: 8px; }

#toast-container { position: fixed; top: 14px; left: 0; right: 0; z-index: 998; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: var(--blue-dark); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; max-width: 90%; text-align: center; }
.toast.success { background: var(--green-dark); }
.toast.warn { background: var(--orange); color: #3A2400; }

/* ---------- Rodapé institucional (ficha do edital) ---------- */
.edital-footer {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 16px; margin-top: 20px; text-align: center; position: relative;
}
.edital-illustration { width: 130px; margin: 0 auto 8px; color: var(--blue-mid); opacity: .5; }
[data-theme="dark"] .edital-illustration { color: #7C9BC9; }
.edital-illustration .illustration { width: 100%; height: auto; }
.edital-org { font-weight: 800; font-size: 15px; }
.edital-cargo { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.edital-banca { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-style: italic; }
.edital-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; text-align: left; }
.edital-item { font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
.edital-item-label { color: var(--text-muted); font-size: 10.5px; display: flex; align-items: center; gap: 4px; }
.edital-item span:last-child { font-weight: 700; }
.edital-subdivider { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; text-align: left; }
.edital-small { font-size: 12px; text-align: left; margin-top: 4px; }
.edital-subject-row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; padding: 6px 0; text-align: left; border-bottom: 1px solid var(--border); }
.edital-subject-row:last-child { border-bottom: none; }
.edital-subject-row span:first-child { display: flex; align-items: center; gap: 6px; }

</style>
</head>
<body>
<div id="splash"><img class="logo" id="splash-logo" alt=""><div id="splash-text"></div></div>
<div id="toast-container"></div>

/* ===== app.js ===== */
/* ============================================================
   APP.JS — Doctor Core: motor genérico do app (estado, prática,
   simulado). Não conhece nenhum concurso específico — tudo que é
   próprio de um concurso (nome, cargo, banca, matérias, questões,
   cores) vem de config.js e data.js. Para reaproveitar esta base
   em outro concurso, troque apenas esses dois arquivos.
   ============================================================ */

const STORAGE_KEY = 'motorista-ipameri-v2';
const EXAM_DATE = new Date(EXAM_CONFIG.examDateISO);

function defaultState() {
  const progress = {};
  const answeredIds = {};
  SUBJECTS.forEach(s => {
    progress[s.id] = { answered: 0, correct: 0 };
    answeredIds[s.id] = [];
  });
  return {
    theme: 'dark',
    groqApiKey: '',
    progress,
    answeredIds,
    simulados: [],
    aiQuestions: [], // questões geradas por IA, persistidas aqui para sobreviver a reload/fechar o app
    activeSession: null, // sessão de SIMULADO em andamento (prática usa "feeds", ver abaixo)
    feeds: {}, // fluxo contínuo por matéria: { subjectId: { order: [ids...], position: n } }
    answerLog: {}, // { questionId: selectedOptionIndex } — permite rever perguntas já respondidas
    flashcards: {}, // { subjectId: [ {id, front, back, aiGenerated} ] } — só os SALVOS pelo aluno
    dailyPlan: null, // { date: 'YYYY-MM-DD', items: [...] } — Plano de Hoje, regenerado a cada dia
    xp: 0 // XP do Doctor — ganho por estudo real (questões, flashcards, simulados, revisões)
  };
}

const Store = {
  state: null,
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      this.state = raw ? JSON.parse(raw) : defaultState();
      SUBJECTS.forEach(s => {
        if (!this.state.progress[s.id]) this.state.progress[s.id] = { answered: 0, correct: 0 };
        if (!this.state.answeredIds[s.id]) this.state.answeredIds[s.id] = [];
      });
      if (!Array.isArray(this.state.aiQuestions)) this.state.aiQuestions = [];
      if (this.state.activeSession === undefined) this.state.activeSession = null;
      if (!this.state.feeds) this.state.feeds = {};
      if (!this.state.answerLog) this.state.answerLog = {};
      if (!this.state.flashcards) this.state.flashcards = {};
      if (this.state.dailyPlan === undefined) this.state.dailyPlan = null;
      if (typeof this.state.xp !== 'number') this.state.xp = 0;
      // migração: sessões de prática do formato antigo (por lote de 12) não se aplicam mais
      if (this.state.activeSession && this.state.activeSession.type === 'practice') {
        this.state.activeSession = null;
      }

      // Reintroduz no banco de questões (QUESTIONS) as que a IA já tinha gerado antes,
      // para não perdê-las ao fechar/reabrir o app.
      const existingIds = new Set(QUESTIONS.map(q => q.id));
      this.state.aiQuestions.forEach(q => {
        if (!existingIds.has(q.id)) {
          QUESTIONS.push(q);
          existingIds.add(q.id);
        }
      });
    } catch (e) {
      this.state = defaultState();
    }
    return this.state;
  },
  save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); },
  reset() {
    this.state = defaultState();
    this.save();
    // remove também da sessão atual (em memória), não só do que será salvo
    for (let i = QUESTIONS.length - 1; i >= 0; i--) {
      if (QUESTIONS[i].aiGenerated) QUESTIONS.splice(i, 1);
    }
  },
  daysUntilExam() {
    const diff = EXAM_DATE - new Date();
    return Math.max(0, Math.ceil(diff / 86400000));
  },
  registerAnswer(subjectId, questionId, correct) {
    const p = this.state.progress[subjectId];
    if (this.state.answeredIds[subjectId].includes(questionId)) return; // já contabilizada antes, evita duplicar
    p.answered++;
    if (correct) p.correct++;
    this.state.answeredIds[subjectId].push(questionId);
    this.save();
  },
  overallAccuracy() {
    let answered = 0, correct = 0;
    Object.values(this.state.progress).forEach(p => { answered += p.answered; correct += p.correct; });
    return answered > 0 ? Math.round((correct / answered) * 100) : 0;
  },

  // ---------- Flashcards salvos ----------
  getSavedFlashcards(subjectId) {
    if (!this.state.flashcards[subjectId]) this.state.flashcards[subjectId] = [];
    return this.state.flashcards[subjectId];
  },
  saveFlashcard(subjectId, card) {
    const list = this.getSavedFlashcards(subjectId);
    if (!list.find(c => c.front === card.front)) { // evita salvar duplicado
      list.push(card);
      this.save();
      Doctor.addXP(3);
    }
  },
  removeFlashcard(subjectId, cardId) {
    const list = this.getSavedFlashcards(subjectId);
    const idx = list.findIndex(c => c.id === cardId);
    if (idx >= 0) { list.splice(idx, 1); this.save(); }
  },

  // ---------- Caderno de Erros ----------
  // Não guarda uma lista separada: deriva direto do answerLog (resposta escolhida
  // em cada questão), comparando com o gabarito. Evita duplicar dado que já existe.
  getWrongQuestions(subjectId = null) {
    const wrong = [];
    Object.entries(this.state.answerLog).forEach(([questionId, selected]) => {
      const q = QUESTIONS.find(x => x.id === questionId);
      if (!q) return; // questão pode ter sumido (ex: reset parcial), ignora com segurança
      if (subjectId && q.subjectId !== subjectId) return;
      if (selected !== q.correct) wrong.push({ question: q, selected });
    });
    return wrong;
  },
  getWrongCountBySubject() {
    const counts = {};
    SUBJECTS.forEach(s => { counts[s.id] = 0; });
    this.getWrongQuestions().forEach(w => { counts[w.question.subjectId] = (counts[w.question.subjectId] || 0) + 1; });
    return counts;
  },
  // Re-responder uma questão do caderno de erros SOBRESCREVE o answerLog (então,
  // se acertar dessa vez, ela sai do caderno de erros naturalmente) mas NÃO mexe
  // nos contadores de progresso/aproveitamento — é revisão, não uma questão nova.
  reviewAnswer(questionId, selected) {
    this.state.answerLog[questionId] = selected;
    this.save();
  }
};

const Quiz = {
  shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },

  // ============================================================
  // PRÁTICA — fluxo contínuo e infinito por matéria.
  // Nunca reexibe uma questão já respondida antes (a não ser que
  // acabem as questões novas e a IA ainda não tenha gerado mais);
  // sempre retoma exatamente de onde parou; permite voltar e
  // revisar perguntas anteriores sem re-respondê-las.
  // ============================================================

  getFeed(subjectId) {
    if (!Store.state.feeds[subjectId]) Store.state.feeds[subjectId] = { order: [], position: 0 };
    return Store.state.feeds[subjectId];
  },

  isAnsweredAnywhere(questionId) {
    return Object.prototype.hasOwnProperty.call(Store.state.answerLog, questionId);
  },

  // Escolhe uma questão nunca respondida antes (em qualquer sessão), da matéria
  // pedida ou, no modo "todas", do conjunto inteiro.
  pickFreshQuestion(subjectId) {
    const pool = subjectId === 'todas' ? QUESTIONS : this.poolFor(subjectId);
    const candidates = pool.filter(q => !this.isAnsweredAnywhere(q.id));
    if (candidates.length === 0) return null;
    return this.shuffle(candidates)[0];
  },

  // Garante que a posição atual do feed tenha uma questão carregada.
  // Retorna false se não há nenhuma questão nova disponível (banco esgotado).
  ensureCurrent(subjectId) {
    const feed = this.getFeed(subjectId);
    if (feed.order.length === 0) {
      const q = this.pickFreshQuestion(subjectId);
      if (!q) return false;
      feed.order.push(q.id);
      feed.position = 0;
      Store.save();
    }
    return true;
  },

  currentQuestion(subjectId) {
    const feed = this.getFeed(subjectId);
    const id = feed.order[feed.position];
    return QUESTIONS.find(q => q.id === id) || null;
  },

  // Registra a resposta da questão atual do feed (não usado no simulado, que tem seu próprio fluxo)
  answerFeedQuestion(subjectId, optionIndex) {
    const q = this.currentQuestion(subjectId);
    const correct = optionIndex === q.correct;
    Store.state.answerLog[q.id] = optionIndex;
    Store.registerAnswer(q.subjectId, q.id, correct); // usa q.subjectId real (importa no modo "todas")
    Store.save();
    Doctor.addXP(correct ? 5 : 1);
    return correct;
  },

  // Avança no feed. Se a próxima posição já tinha sido carregada antes (o usuário voltou
  // e está reavançando), só move o ponteiro. Se está na fronteira, busca uma questão nova
  // nunca vista. Retorna 'ok' ou 'need-more' (banco esgotado, hora de gerar com IA).
  goNext(subjectId) {
    const feed = this.getFeed(subjectId);
    if (feed.position + 1 < feed.order.length) {
      feed.position++;
      Store.save();
      return 'ok';
    }
    const q = this.pickFreshQuestion(subjectId);
    if (!q) return 'need-more';
    feed.order.push(q.id);
    feed.position++;
    Store.save();
    return 'ok';
  },

  // Verifica (sem consumir) se existe alguma questão nova disponível além da atual.
  // Usado para decidir se mostra "Próxima" ou "Gerar mais com IA".
  hasMoreFresh(subjectId) {
    return !!this.pickFreshQuestion(subjectId);
  },

  goPrev(subjectId) {
    const feed = this.getFeed(subjectId);
    if (feed.position > 0) {
      feed.position--;
      Store.save();
      return true;
    }
    return false;
  },

  // Usado no modo "todas": decide para qual matéria específica vale mais a pena
  // gerar questões novas, priorizando quem está proporcionalmente mais atrás
  // da distribuição oficial do edital.
  mostNeededSubjectForGeneration() {
    let worst = null, worstRatio = Infinity;
    SUBJECTS.forEach(s => {
      const have = this.poolFor(s.id).length;
      const ratio = have / s.officialQuestions;
      if (ratio < worstRatio) { worstRatio = ratio; worst = s; }
    });
    return worst || SUBJECTS[0];
  },

  poolFor(subjectId) {
    return QUESTIONS.filter(q => q.subjectId === subjectId);
  },

  session: null, // usado exclusivamente pelo Simulado (a Prática usa Store.state.feeds, acima)

  // Salva a sessão de SIMULADO atual para sobreviver a fechar o navegador.
  persist() {
    Store.state.activeSession = this.session;
    Store.save();
  },

  clearPersisted() {
    Store.state.activeSession = null;
    Store.save();
  },

  resumableSimulado() {
    const saved = Store.state.activeSession;
    if (saved && saved.type === 'simulado' && saved.index < saved.questions.length) {
      return saved;
    }
    return null;
  },

  // Simulado oficial: usa a distribuição exata do edital (10/3/2/25 = 40, 100 pontos)
  startSimulado() {
    let questions = [];
    SUBJECTS.forEach(s => {
      const pool = this.shuffle(this.poolFor(s.id));
      questions = questions.concat(pool.slice(0, s.officialQuestions));
    });
    this.session = {
      type: 'simulado',
      questions: this.shuffle(questions),
      index: 0,
      answers: [],
      startedAt: Date.now(),
      timeLimitSeconds: EXAM_CONFIG.durationHours * 60 * 60 // igual à duração real da prova
    };
    this.persist();
    return this.session;
  },

  simuladoReadiness() {
    return SUBJECTS.map(s => ({
      subject: s,
      have: this.poolFor(s.id).length,
      need: s.officialQuestions,
      missing: Math.max(0, s.officialQuestions - this.poolFor(s.id).length)
    }));
  },

  answerCurrent(optionIndex) {
    const s = this.session;
    const q = s.questions[s.index];
    const correct = optionIndex === q.correct;
    s.answers.push({ questionId: q.id, subjectId: q.subjectId, selected: optionIndex, correct });
    Store.registerAnswer(q.subjectId, q.id, correct);
    this.persist();
    Doctor.addXP(correct ? 5 : 1);
    return correct;
  },

  nextQuestion() {
    this.session.index++;
    this.persist();
    return this.session.index < this.session.questions.length;
  },

  finishSimulado() {
    const s = this.session;
    const timeSpentSec = Math.round((Date.now() - s.startedAt) / 1000);
    const bySubject = {};
    let totalPoints = 0, earnedPoints = 0;

    SUBJECTS.forEach(subj => { bySubject[subj.id] = { correct: 0, total: 0, points: 0 }; });

    s.answers.forEach(a => {
      const subj = SUBJECTS.find(x => x.id === a.subjectId);
      bySubject[a.subjectId].total++;
      totalPoints += subj.points;
      if (a.correct) {
        bySubject[a.subjectId].correct++;
        bySubject[a.subjectId].points += subj.points;
        earnedPoints += subj.points;
      }
    });

    const result = {
      date: new Date().toISOString(),
      score: earnedPoints,
      total: totalPoints || EXAM_CONFIG.totalPoints,
      timeSpentSec,
      bySubject
    };
    Store.state.simulados.push(result);
    this.clearPersisted();
    Store.save();
    Doctor.addXP(50); // bônus por completar um simulado oficial inteiro
    return result;
  },

  // ============================================================
  // REVISÃO DO CADERNO DE ERROS — sessão linear simples (sem
  // cronômetro) usando só as questões que o aluno errou antes.
  // Reaproveita o mesmo padrão de sessão/índice do simulado.
  // ============================================================
  startErrorReview(subjectId = null) {
    const wrong = this.shuffle(Store.getWrongQuestions(subjectId));
    this.reviewSession = {
      type: 'review',
      questions: wrong.map(w => w.question),
      index: 0,
      answers: []
    };
    return this.reviewSession;
  },

  answerReviewQuestion(optionIndex) {
    const s = this.reviewSession;
    const q = s.questions[s.index];
    const correct = optionIndex === q.correct;
    s.answers.push({ questionId: q.id, subjectId: q.subjectId, selected: optionIndex, correct });
    Store.reviewAnswer(q.id, optionIndex); // sobrescreve o answerLog, não mexe no progresso
    if (correct) Doctor.addXP(10); // bônus por corrigir um erro de verdade
    return correct;
  },

  nextReviewQuestion() {
    this.reviewSession.index++;
    return this.reviewSession.index < this.reviewSession.questions.length;
  }
};

// ============================================================
// PLANO DE HOJE — plano de estudos dinâmico, recalculado todo dia
// com base no desempenho real: prioriza a matéria mais fraca,
// reforça uma segunda área, e inclui revisão de erros se houver.
// Cada item leva direto para a atividade correspondente no app.
// ============================================================
const DailyPlan = {
  todayStr() {
    return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
  },

  // Matéria com pior aproveitamento entre as já praticadas; se nenhuma foi
  // praticada ainda, cai para a de maior peso no edital (mais estratégica).
  weakestSubject() {
    let weakest = null, weakestAcc = Infinity;
    SUBJECTS.forEach(s => {
      const p = Store.state.progress[s.id];
      if (p.answered > 0) {
        const acc = p.correct / p.answered;
        if (acc < weakestAcc) { weakestAcc = acc; weakest = s; }
      }
    });
    if (weakest) return weakest;
    return [...SUBJECTS].sort((a, b) => b.points - a.points)[0];
  },

  // Segunda matéria a reforçar: a de maior peso no edital que não seja a mais fraca
  secondarySubject(excludeId) {
    const candidates = SUBJECTS.filter(s => s.id !== excludeId);
    return [...candidates].sort((a, b) => b.points - a.points)[0];
  },

  generate() {
    const weakest = this.weakestSubject();
    const secondary = this.secondarySubject(weakest.id);
    const wrongCount = Store.getWrongQuestions().length;

    const items = [];

    items.push({
      id: 'weak', type: 'practice', subjectId: weakest.id,
      label: `${weakest.name}`, sublabel: 'Reforço de ponto fraco',
      target: 8, minutes: 12,
      baseline: Store.state.progress[weakest.id].answered
    });

    items.push({
      id: 'secondary', type: 'practice', subjectId: secondary.id,
      label: `${secondary.name}`, sublabel: 'Treino de questões',
      target: 6, minutes: 9,
      baseline: Store.state.progress[secondary.id].answered
    });

    if (wrongCount > 0) {
      items.push({
        id: 'review', type: 'review', subjectId: null,
        label: 'Revisão de erros', sublabel: `${wrongCount} questão(ões) para revisar`,
        target: wrongCount, minutes: Math.min(15, wrongCount * 1.5),
        baseline: wrongCount
      });
    }

    const plan = { date: this.todayStr(), items };
    Store.state.dailyPlan = plan;
    Store.save();
    return plan;
  },

  getOrGenerate() {
    if (!Store.state.dailyPlan || Store.state.dailyPlan.date !== this.todayStr()) {
      return this.generate();
    }
    return Store.state.dailyPlan;
  },

  // Recalcula em tempo real se cada item já foi concluído (compara o progresso
  // atual com o "baseline" salvo no momento em que o plano foi gerado).
  itemStatus(item) {
    if (item.type === 'practice') {
      const now = Store.state.progress[item.subjectId].answered;
      const done = (now - item.baseline) >= item.target;
      const doneCount = Math.min(item.target, Math.max(0, now - item.baseline));
      return { done, doneCount, target: item.target };
    }
    if (item.type === 'review') {
      const now = Store.getWrongQuestions().length;
      const resolved = Math.max(0, item.baseline - now);
      const done = now === 0 || resolved >= item.baseline;
      return { done, doneCount: Math.min(item.baseline, resolved), target: item.baseline };
    }
    return { done: false, doneCount: 0, target: 1 };
  },

  totalMinutes(plan) {
    return Math.round(plan.items.reduce((sum, it) => sum + it.minutes, 0));
  },

  completedCount(plan) {
    return plan.items.filter(it => this.itemStatus(it).done).length;
  }
};

// ============================================================
// DOCTOR — evolução do avatar, conectada 100% ao progresso real.
// 10 níveis, 500 XP cada, 5.000 XP no total até o nível máximo.
// "Se você evolui, o Doctor evolui" — XP só é ganho por estudo de
// verdade (questão respondida, flashcard salvo, simulado feito,
// erro corrigido numa revisão). Não existe compra nem atalho.
//
// As imagens de cada nível ainda não existem — assim que chegarem,
// basta preencher o campo "imageUri" de cada item de LEVELS abaixo
// com o data URI da ilustração. Nenhuma outra parte do código
// precisa mudar.
// ============================================================
const Doctor = {
  LEVELS: [
    { level: 1, name: 'Iniciante', minXP: 0, maxXP: 500, imageUri: null },
    { level: 2, name: 'Aprendiz', minXP: 500, maxXP: 1000, imageUri: null },
    { level: 3, name: 'Preparado', minXP: 1000, maxXP: 1500, imageUri: null },
    { level: 4, name: 'Focado', minXP: 1500, maxXP: 2000, imageUri: null },
    { level: 5, name: 'Determinado', minXP: 2000, maxXP: 2500, imageUri: null },
    { level: 6, name: 'Disciplinado', minXP: 2500, maxXP: 3000, imageUri: null },
    { level: 7, name: 'Especialista', minXP: 3000, maxXP: 3500, imageUri: null },
    { level: 8, name: 'Avançado', minXP: 3500, maxXP: 4000, imageUri: null },
    { level: 9, name: 'Elite', minXP: 4000, maxXP: 4500, imageUri: null },
    { level: 10, name: 'Supremo', minXP: 4500, maxXP: 5000, imageUri: null }
  ],

  MAX_XP: 5000,

  addXP(amount) {
    Store.state.xp = Math.min(this.MAX_XP, (Store.state.xp || 0) + amount);
    Store.save();
  },

  getCurrentLevel() {
    const xp = Store.state.xp || 0;
    let current = this.LEVELS[0];
    for (const lvl of this.LEVELS) {
      if (xp >= lvl.minXP) current = lvl;
    }
    return current;
  },

  getProgress() {
    const xp = Store.state.xp || 0;
    const lvl = this.getCurrentLevel();
    const isMax = lvl.level === this.LEVELS.length;
    const span = lvl.maxXP - lvl.minXP;
    const into = Math.min(span, xp - lvl.minXP);
    const pct = isMax ? 100 : Math.round((into / span) * 100);
    return { level: lvl, xp, into, span, pct, isMax };
  }
};


/* ===== groq.js ===== */
/* ============================================================
   GROQ.JS — Doctor Core: integração com IA (Groq), inalterada
   em comportamento. Lê banca/edital/cargo/matérias de config.js
   e data.js — nenhum dado de concurso fica escrito aqui.
   A chave nunca fica no código-fonte: só no localStorage do
   próprio dispositivo, digitada pelo usuário em Configurações.
   ============================================================ */

const GROQ_MODEL = 'llama-3.3-70b-versatile';
const GROQ_ENDPOINT = 'https://api.groq.com/openai/v1/chat/completions';

const GroqAI = {
  getKey() { return (Store.state.groqApiKey || '').trim(); },
  setKey(key) { Store.state.groqApiKey = key.trim(); Store.save(); },
  hasKey() { return this.getKey().length > 0; },

  _buildPrompt(subject, count, existingSamples) {
    const sampleText = existingSamples.map(q => `- ${q.text}`).join('\n');
    const n = EXAM_CONFIG.alternativesPerQuestion;
    const letters = Array.from({ length: n }, (_, i) => String.fromCharCode(65 + i)).join(', ');
    return `Você é especialista em elaborar questões de concurso público brasileiro, no padrão do(a) ${EXAM_CONFIG.banca}, para o ${EXAM_CONFIG.editalNumber} do(a) ${EXAM_CONFIG.orgName}, cargo "${EXAM_CONFIG.cargo}" (nível médio).

Gere ${count} questões de múltipla escolha NOVAS e ORIGINAIS sobre a matéria "${subject.name}", cobrindo estes tópicos oficiais do edital:
${subject.topics.map(t => '- ' + t).join('\n')}

Questões que JÁ EXISTEM no banco (não repita, crie ângulos diferentes):
${sampleText || '(nenhuma ainda)'}

REGRAS OBRIGATÓRIAS (seguem exatamente o padrão real da prova):
1. Cada questão deve ter EXATAMENTE ${n} alternativas (${letters}). Nunca mais, nunca menos.
2. Apenas 1 alternativa correta.
3. Cada uma das ${n} alternativas precisa de uma explicação própria (por que está certa OU por que está errada), na mesma ordem das alternativas.
4. Use APENAS fatos corretos e verificáveis. Não invente número de artigo de lei, decreto ou normativo se não tiver certeza — nesse caso, refira-se à norma de forma genérica em vez de citar um número específico incerto.
5. Nível médio de dificuldade, direto e objetivo, sem pegadinhas artificiais — no estilo de banca de concurso público real.
6. Português do Brasil.
7. Responda APENAS com um JSON válido, sem nenhum texto antes ou depois, no formato exato abaixo:

{
  "questions": [
    {
      "text": "texto da pergunta",
      "options": [${Array.from({ length: n }, (_, i) => `"alternativa ${String.fromCharCode(97 + i)}"`).join(', ')}],
      "correct": 0,
      "explanations": [${Array.from({ length: n }, (_, i) => `"explicação da ${String.fromCharCode(97 + i)}"`).join(', ')}]
    }
  ]
}`;
  },

  async generateQuestions(subjectId, count = 6) {
    const key = this.getKey();
    if (!key) return { ok: false, reason: 'no-key' };

    const subject = SUBJECTS.find(s => s.id === subjectId);
    if (!subject) return { ok: false, reason: 'invalid-subject' };

    const existingSamples = Quiz.shuffle(Quiz.poolFor(subjectId)).slice(0, 5);
    const prompt = this._buildPrompt(subject, count, existingSamples);

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      const res = await fetch(GROQ_ENDPOINT, {
        method: 'POST',
        signal: controller.signal,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body: JSON.stringify({
          model: GROQ_MODEL,
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.6,
          response_format: { type: 'json_object' }
        })
      });
      clearTimeout(timeoutId);

      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status}: ${errText.slice(0, 150)}`);
      }

      const data = await res.json();
      const rawContent = data.choices?.[0]?.message?.content;
      if (!rawContent) throw new Error('Resposta vazia da IA.');

      const parsed = JSON.parse(rawContent);
      const rawQuestions = Array.isArray(parsed.questions) ? parsed.questions : [];
      const validated = this._validateAndTag(rawQuestions, subjectId);

      if (validated.length === 0) throw new Error('Nenhuma questão passou na validação de formato.');

      validated.forEach(q => {
        QUESTIONS.push(q);
        Store.state.aiQuestions.push(q); // salva de verdade, sobrevive a fechar o app
      });
      Store.save();

      return { ok: true, added: validated.length };
    } catch (e) {
      console.error('Erro ao gerar questões:', e);
      return { ok: false, reason: 'error', error: e };
    }
  },

  _validateAndTag(rawQuestions, subjectId) {
    const stamp = Date.now();
    const n = EXAM_CONFIG.alternativesPerQuestion;
    const valid = [];
    rawQuestions.forEach((q, i) => {
      if (!q || typeof q.text !== 'string' || !q.text.trim()) return;
      if (!Array.isArray(q.options) || q.options.length !== n) return;
      if (typeof q.correct !== 'number' || q.correct < 0 || q.correct >= n) return;
      if (!Array.isArray(q.explanations) || q.explanations.length !== n) return;
      valid.push({
        id: `${subjectId}-ai-${stamp}-${i}`,
        subjectId,
        text: q.text.trim(),
        options: q.options.map(o => String(o).trim()),
        correct: q.correct,
        explanations: q.explanations.map(e => String(e).trim()),
        aiGenerated: true
      });
    });
    return valid;
  },

  // Gera em lotes até atingir a quantidade alvo (usado para completar o simulado oficial)
  async fillSubjectTo(subjectId, targetCount, onProgress) {
    let attempts = 0;
    while (Quiz.poolFor(subjectId).length < targetCount && attempts < 6) {
      const missing = targetCount - Quiz.poolFor(subjectId).length;
      const batch = Math.min(8, missing);
      const result = await this.generateQuestions(subjectId, batch);
      attempts++;
      if (onProgress) onProgress(Quiz.poolFor(subjectId).length, targetCount);
      if (!result.ok) break; // evita loop infinito em caso de erro persistente
    }
    return Quiz.poolFor(subjectId).length;
  },

  // ============================================================
  // FLASHCARDS — geração "inteligente": prioriza os tópicos mais
  // cobrados no edital para a matéria e, se o aluno já tem
  // desempenho registrado nessa matéria, ajusta o foco conforme
  // o aproveitamento (fraco → reforça o básico; forte → aprofunda).
  // ============================================================

  _buildFlashcardPrompt(subject, count, existingFronts, accuracy) {
    const existingText = existingFronts.map(f => `- ${f}`).join('\n');
    let focusHint;
    if (accuracy === null) {
      focusHint = 'O aluno ainda não tem histórico de questões respondidas nesta matéria — cubra uma base equilibrada dos tópicos mais importantes.';
    } else if (accuracy < 60) {
      focusHint = `O aproveitamento atual do aluno nesta matéria é de apenas ${accuracy}%. Priorize os CONCEITOS MAIS FUNDAMENTAIS e básicos dos tópicos abaixo, os que mais aparecem em prova, para reforçar a base.`;
    } else if (accuracy < 85) {
      focusHint = `O aproveitamento atual do aluno nesta matéria é ${accuracy}%. Misture conceitos fundamentais com pontos um pouco mais específicos que costumam gerar confusão.`;
    } else {
      focusHint = `O aproveitamento atual do aluno nesta matéria já é alto (${accuracy}%). Foque em detalhes mais específicos, pegadinhas comuns e nuances que costumam derrubar quem já domina o básico.`;
    }

    return `Você é especialista em preparar candidatos para concurso público brasileiro, no padrão do(a) ${EXAM_CONFIG.banca}, para o ${EXAM_CONFIG.editalNumber} do(a) ${EXAM_CONFIG.orgName}, cargo "${EXAM_CONFIG.cargo}".

Crie ${count} flashcards de estudo NOVOS e ORIGINAIS para a matéria "${subject.name}", cobrindo os tópicos mais cobrados neste edital:
${subject.topics.map(t => '- ' + t).join('\n')}

${focusHint}

Flashcards que o aluno JÁ SALVOU (não repita o mesmo conceito):
${existingText || '(nenhum ainda)'}

REGRAS OBRIGATÓRIAS:
1. Cada flashcard tem uma FRENTE curta (uma pergunta direta ou um termo/conceito) e um VERSO com a resposta ou explicação — direto, sem enrolação, no máximo 2-3 frases.
2. Cubra os tópicos mais relevantes e mais cobrados primeiro, não os mais raros.
3. Use APENAS fatos corretos e verificáveis. Não invente número de artigo de lei ou normativo se não tiver certeza.
4. Português do Brasil.
5. Responda APENAS com um JSON válido, sem texto antes ou depois, neste formato exato:

{
  "flashcards": [
    { "front": "pergunta ou conceito curto", "back": "resposta ou explicação direta" }
  ]
}`;
  },

  async generateFlashcards(subjectId, count = 6) {
    const key = this.getKey();
    if (!key) return { ok: false, reason: 'no-key' };

    const subject = SUBJECTS.find(s => s.id === subjectId);
    if (!subject) return { ok: false, reason: 'invalid-subject' };

    const saved = Store.getSavedFlashcards(subjectId);
    const existingFronts = saved.slice(-15).map(c => c.front);
    const progress = Store.state.progress[subjectId];
    const accuracy = progress && progress.answered > 0 ? Math.round((progress.correct / progress.answered) * 100) : null;

    const prompt = this._buildFlashcardPrompt(subject, count, existingFronts, accuracy);

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      const res = await fetch(GROQ_ENDPOINT, {
        method: 'POST',
        signal: controller.signal,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body: JSON.stringify({
          model: GROQ_MODEL,
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.6,
          response_format: { type: 'json_object' }
        })
      });
      clearTimeout(timeoutId);

      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status}: ${errText.slice(0, 150)}`);
      }

      const data = await res.json();
      const rawContent = data.choices?.[0]?.message?.content;
      if (!rawContent) throw new Error('Resposta vazia da IA.');

      const parsed = JSON.parse(rawContent);
      const rawCards = Array.isArray(parsed.flashcards) ? parsed.flashcards : [];
      const validated = this._validateFlashcards(rawCards, subjectId);

      if (validated.length === 0) throw new Error('Nenhum flashcard passou na validação de formato.');

      return { ok: true, cards: validated };
    } catch (e) {
      console.error('Erro ao gerar flashcards:', e);
      return { ok: false, reason: 'error', error: e };
    }
  },

  _validateFlashcards(rawCards, subjectId) {
    const stamp = Date.now();
    const valid = [];
    rawCards.forEach((c, i) => {
      if (!c || typeof c.front !== 'string' || !c.front.trim()) return;
      if (typeof c.back !== 'string' || !c.back.trim()) return;
      valid.push({
        id: `${subjectId}-fc-${stamp}-${i}`,
        subjectId,
        front: c.front.trim(),
        back: c.back.trim(),
        aiGenerated: true
      });
    });
    return valid;
  }
};

// Helper: envolve um ícone SVG (de ICONS) num span consistente, com fallback silencioso
function iconEl(key, extraClass = '') {
  const svg = ICONS[key];
  if (!svg) {
    console.warn(`[iconEl] Ícone "${key}" não existe em ICONS — verifique data.js/views.js.`);
    return '';
  }
  return `<span class="icon-wrap ${extraClass}">${svg}</span>`;
}

Views.reviewSession = function () {
  const s = Quiz.reviewSession;
  if (!s) return '<div class="empty">Nenhuma revisão ativa.</div>';

  if (s.questions.length === 0) {
    return `
      <button class="btn btn-ghost btn-sm" id="rv-back">${iconEl('arrowLeft')} Voltar</button>
      <div class="card center"><p class="muted">Nenhum erro pendente para revisar aqui.</p></div>
    `;
  }

  if (s.index >= s.questions.length) {
    const correctedCount = s.answers.filter(a => a.correct).length;
    return `
      <div class="card center">
        <div class="big-icon">${iconEl('trophy')}</div>
        <h2>Revisão concluída</h2>
        <p class="muted">Você acertou ${correctedCount} de ${s.answers.length} questão(ões) revisada(s).</p>
        <button class="btn btn-primary btn-block" id="rv-done">Voltar ao início</button>
      </div>
    `;
  }

  const q = s.questions[s.index];
  const answered = s.answers.length > s.index;
  const last = answered ? s.answers[s.index] : null;
  const letters = Array.from({ length: EXAM_CONFIG.alternativesPerQuestion }, (_, i) => String.fromCharCode(65 + i));

  return `
    <div class="q-header">
      <button class="btn btn-ghost btn-sm" id="rv-back">${iconEl('arrowLeft')} Voltar</button>
      <span class="badge">${s.index + 1}/${s.questions.length}</span>
    </div>
    <div class="card">
      <p class="q-text">${q.text}</p>
      ${q.options.map((opt, i) => {
        let cls = 'q-option';
        if (answered) {
          if (i === q.correct) cls += ' correct';
          else if (i === last.selected) cls += ' wrong';
        }
        return `<div class="${cls}" data-i="${i}"><span class="letter">${letters[i]}</span>${opt}</div>`;
      }).join('')}
      ${answered ? `
        <div class="explanation">
          <strong>${last.correct ? iconEl('checkCircle') + ' Acertou dessa vez!' : iconEl('xCircle') + ' Ainda não foi.'}</strong>
          <p>${q.explanations[last.selected]}</p>
          ${!last.correct ? `<p><strong>Resposta certa:</strong> ${q.explanations[q.correct]}</p>` : ''}
        </div>
        <button class="btn btn-primary btn-block" id="rv-next">${s.index + 1 < s.questions.length ? 'Próxima' : 'Finalizar'}</button>
      ` : ''}
    </div>
  `;
};

Views.practice = function () {
  const subjectId = UI.practiceSubject;
  if (!subjectId) return '<div class="empty">Nenhuma matéria selecionada.</div>';

  const hasCurrent = Quiz.ensureCurrent(subjectId);
  if (!hasCurrent) {
    const subject = SUBJECTS.find(x => x.id === subjectId);
    return `
      <button class="btn btn-ghost btn-sm" id="practice-back">${iconEl('arrowLeft')} Voltar</button>
      <div class="card center">
        <div class="big-icon">${iconEl('trophy')}</div>
        <h2>Você viu todas as questões ${subject ? 'de ' + subject.name : 'disponíveis'}!</h2>
        <p class="muted">Gere novas com IA pra continuar praticando sem repetir nada.</p>
        <button class="btn btn-primary btn-block" id="q-generate-more">${iconEl('bot')} Gerar novas questões com IA</button>
      </div>
    `;
  }

  const feed = Quiz.getFeed(subjectId);
  const q = Quiz.currentQuestion(subjectId);
  const answered = Quiz.isAnsweredAnywhere(q.id);
  const selected = answered ? Store.state.answerLog[q.id] : null;
  const correct = answered ? selected === q.correct : null;
  const letters = Array.from({ length: EXAM_CONFIG.alternativesPerQuestion }, (_, i) => String.fromCharCode(65 + i));
  const canGoPrev = feed.position > 0;
  const isFrontier = feed.position === feed.order.length - 1;
  const needsMoreToAdvance = isFrontier && !Quiz.hasMoreFresh(subjectId);

  return `
    <button class="btn btn-ghost btn-sm" id="practice-back">${iconEl('arrowLeft')} Voltar</button>
    <div class="q-header">
      <span class="badge">Questão ${feed.position + 1}</span>
      ${q.aiGenerated ? `<span class="badge badge-ai">${iconEl('bot')} IA</span>` : ''}
    </div>
    <div class="card">
      <p class="q-text">${q.text}</p>
      ${q.options.map((opt, i) => {
        let cls = 'q-option';
        if (answered) {
          if (i === q.correct) cls += ' correct';
          else if (i === selected) cls += ' wrong';
        }
        return `<div class="${cls}" data-i="${i}"><span class="letter">${letters[i]}</span>${opt}</div>`;
      }).join('')}
      ${answered ? `
        <div class="explanation">
          <strong>${correct ? iconEl('checkCircle') + ' Correto!' : iconEl('xCircle') + ' Incorreto.'}</strong>
          <p>${q.explanations[selected]}</p>
          ${!correct ? `<p><strong>Resposta certa:</strong> ${q.explanations[q.correct]}</p>` : ''}
        </div>
        ${needsMoreToAdvance ? `
          <p class="muted center">Você viu todas as questões disponíveis até aqui.</p>
          <div class="grid-2">
            <button class="btn btn-outline btn-block" id="q-prev" ${canGoPrev ? '' : 'disabled'}>${iconEl('arrowLeft')} Anterior</button>
            <button class="btn btn-primary btn-block" id="q-generate-inline">${iconEl('bot')} Gerar mais</button>
          </div>
        ` : `
          <div class="grid-2">
            <button class="btn btn-outline btn-block" id="q-prev" ${canGoPrev ? '' : 'disabled'}>${iconEl('arrowLeft')} Anterior</button>
            <button class="btn btn-primary btn-block" id="q-next">Próxima ${iconEl('chevronRight')}</button>
          </div>
        `}
      ` : `
        ${canGoPrev ? `<button class="btn btn-ghost btn-sm" id="q-prev">${iconEl('arrowLeft')} Ver anterior</button>` : ''}
      `}
    </div>
  `;
};

Views.bind.practice = function () {
  const subjectId = UI.practiceSubject;
  document.getElementById('practice-back')?.addEventListener('click', () => UI.render('pickSubject'));

  document.querySelectorAll('.q-option').forEach(el => {
    el.addEventListener('click', () => {
      const q = Quiz.currentQuestion(subjectId);
      if (Quiz.isAnsweredAnywhere(q.id)) return; // já respondida, não deixa responder de novo
      Quiz.answerFeedQuestion(subjectId, parseInt(el.dataset.i, 10));
      UI.render('practice');
    });
  });

  document.getElementById('q-prev')?.addEventListener('click', () => {
    Quiz.goPrev(subjectId);
    UI.render('practice');
  });

  document.getElementById('q-next')?.addEventListener('click', () => {
    const result = Quiz.goNext(subjectId);
    if (result === 'need-more') {
      UI.toast('Você chegou ao fim das questões disponíveis desta matéria.', 'warn');
    }
    UI.render('practice');
  });

  document.getElementById('q-generate-inline')?.addEventListener('click', async (e) => {
    if (!GroqAI.hasKey()) { UI.toast('Cadastre sua chave da Groq em Configurações.', 'warn'); UI.render('settings'); return; }
    const btn = e.target;
    btn.innerHTML = iconEl('bot') + ' Gerando...';
    btn.disabled = true;
    const targetSubject = subjectId === 'todas' ? Quiz.mostNeededSubjectForGeneration().id : subjectId;
    const result = await GroqAI.generateQuestions(targetSubject, 6);
    if (result.ok) {
      UI.toast(`${result.added} questão(ões) nova(s) geradas!`, 'success');
      Quiz.goNext(subjectId); // avança direto pra primeira questão nova, sem precisar de outro clique
    } else {
      UI.toast('Não consegui gerar agora. Verifique sua chave e internet.', 'warn');
    }
    UI.render('practice');
  });

  document.getElementById('q-generate-more')?.addEventListener('click', async (e) => {
    if (!GroqAI.hasKey()) { UI.toast('Cadastre sua chave da Groq em Configurações.', 'warn'); UI.render('settings'); return; }
    const btn = e.target;
    btn.innerHTML = iconEl('bot') + ' Gerando...';
    btn.disabled = true;
    const targetSubject = subjectId === 'todas' ? Quiz.mostNeededSubjectForGeneration().id : subjectId;
    const result = await GroqAI.generateQuestions(targetSubject, 6);
    if (result.ok) {
      UI.toast(`${result.added} questão(ões) nova(s) geradas!`, 'success');
    } else {
      UI.toast('Não consegui gerar agora. Verifique sua chave e internet.', 'warn');
    }
    UI.render('practice'); // ensureCurrent vai pegar automaticamente uma das novas
  });
};

// ---------------- FLASHCARDS: SESSÃO (revisar novos ou navegar salvos) ----------------
Views.flashcardsSession = function () {

  if (!s) return '<div class="empty">Nenhuma sessão de flashcards ativa.</div>';

  if (s.cards.length === 0) {
    return `
      <button class="btn btn-ghost btn-sm" id="fc-session-back">${iconEl('arrowLeft')} Voltar</button>
      <div class="card center">
        <p class="muted">${s.mode === 'browse' ? 'Você ainda não salvou nenhum flashcard desta matéria.' : 'Nenhum flashcard disponível.'}</p>
      </div>

    const savedCount = s.mode === 'review' ? s.savedCount || 0 : s.cards.length;
    return `
      <div class="card center">
        <div class="big-icon">${iconEl('checkCircle')}</div>
        <h2>${s.mode === 'review' ? 'Revisão concluída' : 'Fim da lista'}</h2>
        ${s.mode === 'review' ? `<p class="muted">Você salvou ${savedCount} de ${s.cards.length} flashcard(s) gerados.</p>` : ''}
        <button class="btn btn-primary btn-block" id="fc-session-done">Voltar</button>
      </div>
    `;
  }

  const card = s.cards[s.index];
  const isSaved = s.mode === 'browse' || (Store.getSavedFlashcards(s.subjectId).some(c => c.front === card.front));

  return `
    <div class="q-header">
      <button class="btn btn-ghost btn-sm" id="fc-session-back">${iconEl('arrowLeft')} Voltar</button>

        <div class="flashcard-face flashcard-back">${card.back}</div>

    </div>

    ${s.mode === 'review' ? `

Views.bind.flashcardsSession = function () {
  const s = UI.flashcardSession;
  document.getElementById('fc-session-back')?.addEventListener('click', () => UI.render('flashcardsSubject'));
  document.getElementById('fc-session-done')?.addEventListener('click', () => UI.render('flashcardsSubject'));

  document.getElementById('flashcard-el')?.addEventListener('click', () => {
    s.flipped = !s.flipped;
    UI.render('flashcardsSession');
  });

  document.getElementById('fc-skip')?.addEventListener('click', () => {
    s.index++; s.flipped = false;
    UI.render('flashcardsSession');
  });

  document.getElementById('fc-save')?.addEventListener('click', () => {
    const card = s.cards[s.index];
    Store.saveFlashcard(s.subjectId, card);
    s.savedCount = (s.savedCount || 0) + 1;
    s.index++; s.flipped = false;
    UI.toast('Flashcard salvo!', 'success');
    UI.render('flashcardsSession');
  });

  document.getElementById('fc-remove')?.addEventListener('click', () => {
    const card = s.cards[s.index];
    Store.removeFlashcard(s.subjectId, card.id);
    s.cards.splice(s.index, 1);
    s.flipped = false;
    UI.render('flashcardsSession');
  });

  document.getElementById('fc-next-browse')?.addEventListener('click', () => {
    s.index++; s.flipped = false;
    UI.render('flashcardsSession');
  });
};

// ---------------- SIMULADO: SETUP ----------------
Views.simuladoSetup = function () {
  const resumable = Quiz.resumableSimulado();
  if (resumable) {
    return `
      <button class="btn btn-ghost btn-sm" id="back-home">${iconEl('arrowLeft')} Voltar</button>
      <h2>${iconEl('clipboard')} Simulado em andamento</h2>
      <div class="card">
        <p>Você tem um simulado começado, na questão <strong>${resumable.index + 1} de ${resumable.questions.length}</strong>.</p>
        <button class="btn btn-primary btn-block" id="continue-simulado">Continuar de onde parei</button>
        <button class="btn btn-danger btn-block" id="abandon-simulado">Abandonar e começar um novo</button>
      </div>
    `;
  }

  const readiness = Quiz.simuladoReadiness();
  const allReady = readiness.every(r => r.missing === 0);

  return `
    <button class="btn btn-ghost btn-sm" id="back-home">${iconEl('arrowLeft')} Voltar</button>
    <h2>${iconEl('clipboard')} Simulado Oficial</h2>
    <p class="muted">Reproduz exatamente a estrutura do ${EXAM_CONFIG.editalNumber}: ${EXAM_CONFIG.totalQuestions} questões, ${EXAM_CONFIG.alternativesPerQuestion} alternativas, ${EXAM_CONFIG.totalPoints} pontos, mínimo ${EXAM_CONFIG.passingScore} para aprovação, ${EXAM_CONFIG.durationHours} horas de duração.</p>
    <div class="card">
      ${readiness.map(r => `
        <div class="subj-row">
          <div class="subj-name">${r.subject.icon} ${r.subject.name}</div>
          <div class="subj-pct">${r.have}/${r.need}</div>
        </div>
      `).join('')}
    </div>
    ${allReady ? `
      <button class="btn btn-primary btn-block" id="start-simulado">Iniciar Simulado (4h)</button>
    ` : `
      <div class="card warn-card">
        <p><strong>Faltam questões para montar o simulado oficial completo.</strong></p>
        <p class="muted">Posso gerar as que faltam agora com IA (usa sua chave da Groq).</p>
        <button class="btn btn-primary btn-block" id="fill-missing">${iconEl('bot')} Gerar questões faltantes</button>
      </div>
      <button class="btn btn-outline btn-block" id="start-simulado-partial">Iniciar mesmo assim (com o que tem)</button>
    `}
  `;
};

Views.bind.simuladoSetup = function () {
  document.getElementById('back-home')?.addEventListener('click', () => UI.render('home'));
  document.getElementById('continue-simulado')?.addEventListener('click', () => {
    Quiz.session = Quiz.resumableSimulado();
    UI.render('simuladoRunning');
  });
  document.getElementById('abandon-simulado')?.addEventListener('click', () => {
    if (confirm('Abandonar o simulado atual? O progresso dele será perdido.')) {
      Quiz.clearPersisted();
      Quiz.session = null;
      UI.render('simuladoSetup');
    }
  });
  document.getElementById('start-simulado')?.addEventListener('click', () => {
    Quiz.startSimulado();
    UI.render('simuladoRunning');
  });
  document.getElementById('start-simulado-partial')?.addEventListener('click', () => {
    Quiz.startSimulado();
    UI.render('simuladoRunning');
  });
  document.getElementById('fill-missing')?.addEventListener('click', async (e) => {
    if (!GroqAI.hasKey()) { UI.toast('Cadastre sua chave da Groq em Configurações.', 'warn'); UI.render('settings'); return; }
    const btn = e.target;
    btn.disabled = true;
    const readiness = Quiz.simuladoReadiness().filter(r => r.missing > 0);
    for (const r of readiness) {
      btn.innerHTML = iconEl('bot') + ' Gerando ' + r.subject.name + '...';
      await GroqAI.fillSubjectTo(r.subject.id, r.need);
    }
    UI.toast('Banco de questões atualizado!', 'success');
    UI.render('simuladoSetup');
  });
};

// ---------------- SIMULADO: EXECUÇÃO ----------------
Views.simuladoRunning = function () {
  const s = Quiz.session;
  if (!s || s.type !== 'simulado') return '<div class="empty">Nenhum simulado ativo.</div>';

  if (s.index >= s.questions.length) {
    UI._lastResult = Quiz.finishSimulado();
    return Views.simuladoResult();
  }

  const q = s.questions[s.index];
  const answered = s.answers.length > s.index;
  const last = answered ? s.answers[s.index] : null;
  const letters = Array.from({ length: EXAM_CONFIG.alternativesPerQuestion }, (_, i) => String.fromCharCode(65 + i));

  return `
    <button class="btn btn-ghost btn-sm" id="sim-back">${iconEl('arrowLeft')} Sair do simulado</button>
    <div class="q-header">
      <span class="badge">${s.index + 1}/${s.questions.length}</span>
      <span class="badge timer" id="sim-timer">${iconEl('clock')} --:--:--</span>
    </div>
    <div class="card">
      <p class="q-text">${q.text}</p>
      ${q.options.map((opt, i) => {
        let cls = 'q-option';
        if (answered) {
          if (i === q.correct) cls += ' correct';
          else if (i === last.selected) cls += ' wrong';
        }
        return `<div class="${cls}" data-i="${i}"><span class="letter">${letters[i]}</span>${opt}</div>`;
      }).join('')}
      ${answered ? `
        <div class="explanation"><p>${q.explanations[last.selected]}</p></div>
        <button class="btn btn-primary btn-block" id="sim-next">${s.index + 1 < s.questions.length ? 'Próxima' : 'Finalizar'}</button>
      ` : ''}
    </div>
  `;
};

Views.bind.simuladoRunning = function () {
  document.getElementById('sim-back')?.addEventListener('click', () => {
    if (confirm('Sair do simulado? Seu progresso fica salvo e você pode continuar depois, na tela de Simulado.')) {
      clearInterval(UI._timerInterval);
      UI.render('home');
    }
  });
  const s = Quiz.session;
  if (s && s.type === 'simulado') {
    clearInterval(UI._timerInterval);
    UI._timerInterval = setInterval(() => {
      const el = document.getElementById('sim-timer');
      if (!el) { clearInterval(UI._timerInterval); return; }
      const elapsed = Math.round((Date.now() - s.startedAt) / 1000);
      const remaining = Math.max(0, s.timeLimitSeconds - elapsed);
      const h = String(Math.floor(remaining / 3600)).padStart(2, '0');
      const m = String(Math.floor((remaining % 3600) / 60)).padStart(2, '0');
      const sec = String(remaining % 60).padStart(2, '0');
      el.innerHTML = iconEl('clock') + ` ${h}:${m}:${sec}`;
      if (remaining <= 0) {
        clearInterval(UI._timerInterval);
        s.index = s.questions.length;
        UI.render('simuladoRunning');
      }
    }, 1000);
  }
  document.querySelectorAll('.q-option').forEach(el => {
    el.addEventListener('click', () => {
      if (Quiz.session.answers.length > Quiz.session.index) return;
      Quiz.answerCurrent(parseInt(el.dataset.i, 10));
      UI.render('simuladoRunning');
    });
  });
  document.getElementById('sim-next')?.addEventListener('click', () => {
    Quiz.nextQuestion();
    UI.render('simuladoRunning');
  });
};

Views.simuladoResult = function () {
  const r = UI._lastResult;
  if (!r) return '<div class="empty">Nenhum resultado disponível.</div>';
  const pct = Math.round((r.score / r.total) * 100);
  const passed = r.score >= 60;

  return `
    <div class="card center">
      <div class="big-icon">${passed ? iconEl('trophy') : iconEl('book')}</div>
      <h2>${r.score} / ${r.total} pontos</h2>
      <p class="${passed ? 'text-green' : 'text-orange'}"><strong>${passed ? 'Aprovado(a)! Acima dos 60 pontos mínimos.' : 'Abaixo dos 60 pontos mínimos — bora reforçar.'}</strong></p>
      <p class="muted">Tempo utilizado: ${Math.floor(r.timeSpentSec / 60)} min</p>
    </div>
    <div class="section-title">Desempenho por matéria</div>
    ${SUBJECTS.map(s => {
      const b = r.bySubject[s.id];
      const pct2 = b.total > 0 ? Math.round((b.correct / b.total) * 100) : 0;
      return `
        <div class="card">
          <div class="subj-row"><div class="subj-name">${s.icon} ${s.name}</div><div class="subj-pct">${b.correct}/${b.total}</div></div>
          <div class="progress-bar"><div class="fill" style="width:${pct2}%"></div></div>
        </div>
      `;
    }).join('')}
    <button class="btn btn-primary btn-block" id="result-home">Voltar ao início</button>
  `;
};

Views.bind.simuladoResult = function () {
  document.getElementById('result-home')?.addEventListener('click', () => { Quiz.session = null; UI.render('home'); });
};
